    // Crudo Pirate: single-mast wooden sailing dinghy (replaces the motorboat)
    const wood="#8a5c34", woodDk="#5e3c1e", woodLt="#a5713a", dark="#0a0a12", sail="#e6ddc4", sailDk="#cbc0a0", lamp="#ffe0a0";
    // wake
    ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.fillRect(x-2,y+16,20,2);
    if(dir==="left"||dir==="right"){
      const bowRight=(dir==="right");
      // wooden hull (extends beyond the tile)
      ctx.fillStyle=dark; ctx.fillRect(x-3,y+8,22,8);
      ctx.fillStyle=wood; ctx.fillRect(x-2,y+9,20,6);
      ctx.fillStyle=woodLt; ctx.fillRect(x-2,y+9,20,1);
      ctx.fillStyle=woodDk; ctx.fillRect(x-2,y+13,20,2);            // planks/waterline
      // pointed bow
      ctx.fillStyle=wood; ctx.fillRect(x+(bowRight?18:-5),y+10,3,3); ctx.fillStyle=dark; ctx.fillRect(x+(bowRight?20:-5),y+10,1,3);
      // mast + triangular sail
      ctx.fillStyle=woodDk; ctx.fillRect(x+7,y-6,1,15);
      ctx.fillStyle=sail; ctx.fillRect(x+(bowRight?8:2),y-5,6,10); ctx.fillStyle=sailDk; ctx.fillRect(x+(bowRight?8:2),y+2,6,1);
      // no lamp/headlight: it's a 1700s boat
      ctx.fillStyle=woodLt; ctx.fillRect(x+(bowRight?18:-4),y+9,2,2);
    } else {
      const bowUp=(dir==="up");
      ctx.fillStyle=dark; ctx.fillRect(x+1,y+6,14,11);
      ctx.fillStyle=wood; ctx.fillRect(x+2,y+7,12,9);
      ctx.fillStyle=woodLt; ctx.fillRect(x+2,y+7,12,1);
      ctx.fillStyle=woodDk; ctx.fillRect(x+2,y+13,12,2);
      ctx.fillStyle=wood; ctx.fillRect(x+4,y+(bowUp?4:16),6,2);     // pointed bow/stern
      // mast + sail
      ctx.fillStyle=woodDk; ctx.fillRect(x+7,y+3,1,10);
      ctx.fillStyle=sail; ctx.fillRect(x+4,y+4,7,6); ctx.fillStyle=sailDk; ctx.fillRect(x+4,y+9,7,1);
      ctx.fillStyle=woodLt; ctx.fillRect(x+7,y+(bowUp?4:15),2,2);
    }
    // Crudo Pirate (Fase 6): overlay extra masts/sails by boat type, or oars for the rowboat
    const masts=(BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop).masts;
    if(player.boatType==="rowboat"){
      // hide the sail with hull colour, add oars
      ctx.fillStyle=woodDk;
      if(dir==="left"||dir==="right"){ ctx.fillRect(x-4,y+7,3,1); ctx.fillRect(x+16,y+7,3,1); ctx.fillRect(x-4,y+13,3,1); ctx.fillRect(x+16,y+13,3,1); }
      else { ctx.fillRect(x-1,y+8,3,1); ctx.fillRect(x+13,y+8,3,1); ctx.fillRect(x-1,y+12,3,1); ctx.fillRect(x+13,y+12,3,1); }
    } else if(masts>=2){
      // add a second (and third) mast + square sail, sitting a touch higher for bigger ships
      if(dir==="left"||dir==="right"){
        ctx.fillStyle=woodDk; ctx.fillRect(x+2,y-7,1,16); if(masts>=3) ctx.fillRect(x+13,y-6,1,15);
        ctx.fillStyle=sail; ctx.fillRect(x+0,y-6,4,7); if(masts>=3) ctx.fillRect(x+11,y-5,4,6);
        ctx.fillStyle=sailDk; ctx.fillRect(x+0,y-0,4,1); if(masts>=3) ctx.fillRect(x+11,y+0,4,1);
      } else {
        ctx.fillStyle=woodDk; ctx.fillRect(x+3,y+2,1,11); if(masts>=3) ctx.fillRect(x+11,y+3,1,10);
        ctx.fillStyle=sail; ctx.fillRect(x+1,y+3,4,5); if(masts>=3) ctx.fillRect(x+10,y+4,4,4);
      }

      if(masts>=3){ ctx.fillStyle="#1a1a1e"; ctx.fillRect(x+7,y-8,3,1); }
    }
    if(moving && Math.floor(performance.now()/150)%2===0){ ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillRect(x+ (dir==="right"?0:(dir==="left"?14:7)), y+14, 2,2); }

  function drawNpc(n,x,y){ x=Math.round(x); y=Math.round(y);
    const walking=!!(n.moving), frame=walking?(Math.floor((n.animT||0)*7)%2):0;
    const opt={skin:"#f0c890",hair:n.hairCol||n.colorDk,shirt:n.color,shirtDk:n.colorDk,pants:n.pants||n.colorDk,kind:n.kind||"ym",outfit:outfitFor(n)};

      drawHuman(x, y-2, n.dir||"right", false, 0, opt);

    if(n.fishing) drawRod(x,y,n.animT||0, n.dir||"down");

  // Decide an NPC's outfit from its base role + current area + season.
  function outfitFor(n){
    const base=n.outfitBase||"";   // "", "worker","tirolese","hiker","lumberjack","vacation","skier"
    // fixed-role outfits (always worn)
    if(base==="worker") return "worker";
    if(base==="sailor") return "sailor";
    if(base==="hiker") return "hiker";
    if(base==="lumberjack") return "lumberjack";
    if(base==="skier") return "skier";
    if(base==="tirolese"){ return season==="winter" ? "coat" : "tirolese"; }
    if(base==="vacation"){
      if(season==="summer"||season==="spring") return "swim";
      if(season==="winter") return "coat";
      return ""; // autumn = normal clothes
    }
    // Crudo Pirate: area-themed default dress for generic townsfolk (no fixed role base)
    if(areaKey==="industrial") return "guard";                       // King's Borough: royal soldiers in uniform
    if(areaKey==="forestNW") return "rags";                          // Outcasts' Valley: dressed in rags
    if(areaKey==="forestNE") return "farmer";                        // King's Countryside: farmers in overalls + straw hat
    if(areaKey==="town"||areaKey==="holiday"||areaKey==="cape"||areaKey==="mountain"||areaKey==="island") return "pirate";  // pirate ports & isles
    // townsfolk (no base): coat in winter, else normal
    return season==="winter" ? "coat" : "";
  }
  // bobbing "!" marker over a quest NPC
  function drawQuestMark(x,y,kind){
    const bob=Math.floor(performance.now()/300)%2;
    const mx=x+6, my=y-9-bob;
    const isCase=(kind==="case");
    const body=isCase?"#e00010":"#ffd020";        // deep vivid red for the case, yellow for casual
    const hi=isCase?"#ff5a4a":"#fff2a0";           // red highlight (not orange) for the case marker
    ctx.fillStyle="#0a0a12"; ctx.fillRect(mx-1,my-1,5,9);          // outline
    ctx.fillStyle=body; ctx.fillRect(mx,my,3,5); ctx.fillRect(mx,my+6,3,2);  // ! body + dot
    ctx.fillStyle=hi; ctx.fillRect(mx,my,1,4);             // highlight
  }
  // Redraw all quest "!" markers ON TOP of the night overlay + fog, so they stay bright/legible
  // at any time of day (they are UI guidance, not part of the lit scene).
  function drawQuestMarksOverlay(){
    if(insideKey) return;
    const list = currentNpcs();
    for(const n of list){
      if(!n) continue;
      const qk = npcQuestKind(n); if(!qk) continue;
      const x = Math.round(n.px - cam.x), y = Math.round(n.py - cam.y);
      // skip if clearly off-screen
      if(x < -TILE || x > W+TILE || y < -TILE || y > H+TILE) continue;
      drawQuestMark(x, y, qk);
    }
  }
  // fishing rod + line into the water, pointing in the given direction ('left'=west, else 'down'=south)
  function drawRod(x,y,animT,dir){
    const bob=Math.floor((animT||0)*3)%2;
    ctx.fillStyle="#8a5a2a"; // rod
    if(dir==="left"){
      for(let i=0;i<10;i++) ctx.fillRect(x+3-i, y+6-Math.floor(i*0.8), 1,1);   // rod up-left
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x-7, y+0, 1, 12+bob);              // line down at tip
      ctx.fillStyle="#e04040"; ctx.fillRect(x-8, y+12+bob, 2,2);               // float
    } else { // down/south
      for(let i=0;i<10;i++) ctx.fillRect(x+12+i, y+6-Math.floor(i*0.8), 1,1);
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x+21, y+0, 1, 14+bob);
      ctx.fillStyle="#e04040"; ctx.fillRect(x+20, y+14+bob, 2,2);
    }
  }

  // ---- animals (wandering dog + cat) ----
  function drawAnimal(a,x,y){ x=Math.round(x); y=Math.round(y); const step=Math.floor(a.animT*5)%2;
    if(a.kind==="cat"){ drawCat(x,y,a.animT); return; }

    ctx.fillStyle="rgba(0,0,0,0.24)"; ctx.fillRect(x+3,y+13,10,2);  // ground shadow

    ctx.fillStyle=B; ctx.fillRect(x+11,y+5,4,4);          // head

    ctx.fillStyle="#2a2028"; ctx.fillRect(x+14,y+8,1,1);  // nose
    // legs (step)
    ctx.fillStyle=D; if(step){ ctx.fillRect(x+4,y+12,2,2); ctx.fillRect(x+9,y+12,2,2); } else { ctx.fillRect(x+3,y+12,2,2); ctx.fillRect(x+10,y+12,2,2); }

  // ---- generic ambient fauna sprites ----
  function drawFaunaCritter(a,x,y){ x=Math.round(x); y=Math.round(y); const step=Math.floor(a.animT*5)%2; const c=a.col||"#999"; const left=(a.dir==="left");
    const sh=()=>{ ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x+3,y+13,10,2); };
    if(a.kind==="cat"){ drawCat(x,y,a.animT); return; }
    if(a.kind==="deer"){ sh();
      const bodyC=c, darkC=tint(c,-22), lightC=tint(c,16);
      const bob=step?0:1;   // subtle head/body bob with the stride
      // body

  // Lighthouse on the SE cliff of Lighthouse Village; rotating beam, brighter at night.
  function drawLighthouse(x,y){
    x=Math.round(x); y=Math.round(y);
    const bx=x-4, by=y-30;
    // warm halo around the lantern, like the street lamps (stronger at night)
    const nf0=(typeof nightFactor==="function")?nightFactor():0;
    const halo=0.14+0.5*nf0;
    const lampx=bx+7, lampy=by-7;
    ctx.fillStyle="rgba(255,224,150,"+(0.10*halo).toFixed(3)+")"; ctx.fillRect(lampx-22,lampy-18,44,44);
    ctx.fillStyle="rgba(255,224,150,"+(0.16*halo).toFixed(3)+")"; ctx.fillRect(lampx-13,lampy-10,26,26);
    ctx.fillStyle="rgba(255,240,190,"+(0.28*halo).toFixed(3)+")"; ctx.fillRect(lampx-6,lampy-5,12,12);
    // tower body (white with red bands)
    ctx.fillStyle="#0a0a12"; ctx.fillRect(bx-1,by-1,16,34);
    ctx.fillStyle="#e6e6ea"; ctx.fillRect(bx,by,14,32);
    ctx.fillStyle="#c83a3a"; ctx.fillRect(bx,by+6,14,4); ctx.fillRect(bx,by+16,14,4); ctx.fillRect(bx,by+26,14,4);
    ctx.fillStyle="#b0b0b8"; ctx.fillRect(bx,by,2,32);            // shading
    // gallery + lantern room
    ctx.fillStyle="#3a3a44"; ctx.fillRect(bx-2,by-4,18,4);
    ctx.fillStyle="#2a2a34"; ctx.fillRect(bx+1,by-12,12,8);
    // lamp
    const nf=(typeof nightFactor==="function")?nightFactor():0;
    const on = nf>0.2 || (Math.floor(performance.now()/700)%2===0);
    ctx.fillStyle=on?"#fff2b0":"#8a8a6a"; ctx.fillRect(bx+4,by-10,6,5);
    // rotating beam (sweeps), stronger at night
    const t2=performance.now()/900; const dir=Math.sin(t2);
    const beamAlpha=(0.10+0.35*nf).toFixed(3);
    ctx.fillStyle="rgba(255,240,170,"+beamAlpha+")";
    const cxp=bx+7, cyp=by-7;
    if(dir>0){ ctx.beginPath(); ctx.moveTo(cxp,cyp); ctx.lineTo(cxp+40, cyp-8+dir*20); ctx.lineTo(cxp+40, cyp+8+dir*20); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(cxp,cyp); ctx.lineTo(cxp-40, cyp-8-dir*20); ctx.lineTo(cxp-40, cyp+8-dir*20); ctx.closePath(); ctx.fill(); }
    // roof
    ctx.fillStyle="#c83a3a"; ctx.fillRect(bx+2,by-14,10,3); ctx.fillStyle="#902828"; ctx.fillRect(bx+5,by-17,4,3);
  }

  // ---- HUD ----
  function firstActiveQuest(){
    // priority: active main quests in order, then active side quests
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active" && q.type==="main") return q; }
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active") return q; }
    return null;
  }
  function activeQuestText(){
    const q=firstActiveQuest();
    if(q){
      // ---- RED CASE QUEST: show the NEXT step based on progress, never a stale one ----
      if(q.type==="case" && typeof CASE_QUESTS!=="undefined" && CASE_QUESTS.has(q.id) && window.CASE_REF){
        const cq=window.CASE_REF.byId[q.id];
        const clue=window.CASE_REF.clues[q.id];
        const ready = (typeof caseClueReady==="function") ? caseClueReady(q.id) : true;
        // 1) clue/beat still to do -> guide to FIND it (step s1) + area + location hint
        if(!ready && cq && cq.pickup && clue && !clue.taken){
          const parts=[ t(q.steps[1]) || t(q.steps[q.step]) ];   // "find the ..." step
          const destArea=cq.pickup.area;
          if(destArea && destArea!==areaKey && !insideKey){ parts.push("\u25B6 "+(t("area_"+destArea)||destArea)); }
          const hint=t("cs_"+q.id+"_hint"); if(hint && hint!=="cs_"+q.id+"_hint") parts.push("("+hint+")");
          return parts.join("  ");
        }
        // 2) clue collected (or beat done) but quest not completed yet -> go report it
        if(ready){ return t("hud_report_clue"); }
        // fallback: current step
        return t(q.steps[q.step]);
      }
      // non-case active quest: show its current step
      return t(q.steps[q.step]);
    }
    // No quest currently ACTIVE. If the central story isn't finished and a red case is waiting to be
    // started (available), guide the player to look for the red "!" instead of showing a stale step.
    if(typeof CASE_QUESTS!=="undefined" && window.CASE_REF){
      const anyCaseAvailable = CASE.order.some(id=> QUESTS[id] && QUESTS[id].status==="available");
      const storyDone = (typeof caseAllDone==="function" && caseAllDone());
      if(anyCaseAvailable && !storyDone) return t("hud_find_red");
    }
    // any available (not yet started) main quest?
    for(const k of QORDER){ const qq=QUESTS[k]; if(qq.status==="available"&&qq.type==="main") return t(qq.nameK); }
    return t("q_none");
  }

  function drawCompass(cx,cy){

    // 4-point star (rose): N-S red/white vertical, E-W grey horizontal
    ctx.fillStyle="#c85040"; ctx.beginPath(); ctx.moveTo(cx,cy-r+1); ctx.lineTo(cx-2,cy); ctx.lineTo(cx+2,cy); ctx.closePath(); ctx.fill();   // N (red)

    ctx.fillStyle="#9aa0aa"; ctx.beginPath(); ctx.moveTo(cx-r+1,cy); ctx.lineTo(cx,cy-2); ctx.lineTo(cx,cy+2); ctx.closePath(); ctx.fill();   // W
    ctx.beginPath(); ctx.moveTo(cx+r-1,cy); ctx.lineTo(cx,cy-2); ctx.lineTo(cx,cy+2); ctx.closePath(); ctx.fill();                           // E
    ctx.fillStyle="#1a1a26"; ctx.fillRect(cx-1,cy-1,2,2);   // hub

    const tx0 = showPortrait ? bx+30 : bx+6;   // text left margin

    ctx.font="8px monospace"; const maxW=(bx+bw-8)-tx0;   // safe inner width (accounts for portrait)
    // word-wrap; if a single word is still too wide, break it by characters
    function fitWords(str){
      const out=[]; let line="";
      const push=()=>{ if(line){ out.push(line); line=""; } };
      str.split(" ").forEach(w=>{
        // break overly long words
        while(ctx.measureText(w).width>maxW){ let cut=w.length; while(cut>1 && ctx.measureText(w.slice(0,cut)).width>maxW) cut--;
          const part=w.slice(0,cut); if(line){ push(); } out.push(part); w=w.slice(cut); }
        const test=line?line+" "+w:w;
        if(ctx.measureText(test).width>maxW){ push(); line=w; } else line=test;
      });
      if(line) out.push(line);
      return out;
    }
    const lines=fitWords(shown);
    const maxRows=3; let ly=by+15;
    lines.slice(0,maxRows).forEach(l=>{ text(l,tx0,ly,"#f0f0e0"); ly+=10; });
    if(dialog.reveal>=full.length && Math.floor(performance.now()/400)%2===0) text((dialog.idx<dialog.lines.length-1)?"\u25BC":"\u25A0",bx+bw-14,by+bh-12,pal().accent); }

    const atk = Math.round((NAVAL_BASE_BROADSIDE*NAVAL_CANNONS[Math.min(3,s.cannons)].mul
                 + NAVAL_RAM_BASE*PROW_TIERS[Math.min(4,s.prow)].dmg) * pct);               // Potere d'attacco

  // ================= CENTRAL STORY LOADER (data-driven, from window.STORY_DATA) =================
  // Builds the detective case: quests (red markers), clue pickups, new NPCs and i18n strings
  // from the JSON produced offline. Casual quests stay untouched and separate.
  const CASE = { data:null, quests:[], byId:{}, order:[], clues:{}, closedUntil:{}, deduced:{}, reconstructed:{}, morals:{}, fought:{}, chaseCaught:{}, naval:{}, started:false, introDone:false };
  window.CASE_REF = CASE;
  (function loadStory(){
    const S = window.STORY_DATA, P = window.STORY_POS;
    if(!S || !S.quests){ return; }
    // --- inject the special "foot chase -> scooter reward" beat between case3 and case4 ---
    CASE.data = S;
    // 1) inject i18n strings for case quests + dialogues (keys namespaced with "cs_")
    function put(key, val){ if(val && val.it!==undefined) STR.it[key]=val.it; if(val && val.en!==undefined) STR.en[key]=val.en; }
    S.quests.forEach(q=>{
      put("cs_"+q.id+"_t", q.title);
      (q.steps||[]).forEach((st,i)=> put("cs_"+q.id+"_s"+i, st));
      put("cs_"+q.id+"_startb", q.start_banner);
      put("cs_"+q.id+"_doneb", q.done_banner);
      if(q.pickup && q.pickup.what) put("cs_"+q.id+"_clue", q.pickup.what);
      if(q.pickup && q.pickup.hint) put("cs_"+q.id+"_hint", q.pickup.hint);
    });
    // dialogues: key = cs_dlg_<npc>_<questId>_<state>
    S.dialogues.forEach(dl=>{ put("cs_dlg_"+dl.npc_id+"_"+dl.quest_id+"_"+dl.state, dl.lines); });
    // names for new npcs
    (S.new_npcs||[]).forEach(n=>{ if(n.name) put("cs_name_"+n.id, n.name); });

    // 2) build case quests into the engine (chained by order), mark them as CASE
    const sorted = S.quests.slice().sort((a,b)=>(a.order||0)-(b.order||0));
    sorted.forEach((q,idx)=>{
      const prev = idx>0 ? sorted[idx-1].id : null;
      QUESTS[q.id] = { id:q.id, chap:1, type:"case", nameK:"cs_"+q.id+"_t",
        steps:[ "cs_"+q.id+"_s0", "cs_"+q.id+"_s1" ], status:"locked", step:0, needs:prev,
        season:q.season, startNpc:q.start_npc, completeNpc:q.complete_npc,
        hasPickup: !!q.pickup, chase: !!q.chase };
      QORDER.push(q.id);
      CASE_QUESTS.add(q.id);
      CASE.order.push(q.id);
      CASE.byId[q.id] = q;
      // clue pickup state
      const pos = P && P.pickups && P.pickups[q.id];
      if(q.pickup && pos){ CASE.clues[q.id] = { area:pos[0], tx:pos[1], ty:pos[2], taken:false, animT:0 }; }
    });

    // 3) create the 3 new NPCs and place them
    const NPC_KIND = (look)=> look.age==="child" ? (look.sex==="f"?"girl":"boy") : (look.sex==="f"? (look.age==="old"?"ow":"yw") : (look.age==="old"?"om":"ym"));
    (S.new_npcs||[]).forEach(n=>{
      const pos = P && P.npc && P.npc[n.id];
      if(!pos) return;
      const [area,tx,ty]=pos;
      const lk = n.look || {};
      // distinctive default colors per story NPC (used when the look has no explicit shirt/hair),
      // so each dialogue portrait looks unique.
      const NPC_LOOK = {
        vedova:{shirt:"#3a3a44",shirtDk:"#24242c",hair:"#c8c8cc"},   // grey shawl, black dress, grey hair
        guardia:{shirt:"#2c5aa0",shirtDk:"#1e3e70",hair:"#3a2a1a"},  // blue work suit
        eremita:{shirt:"#6a4a2a",shirtDk:"#4a3018",hair:"#e2e2e6"},  // brown coat, white beard/hair
        custode:{shirt:"#3a3050",shirtDk:"#241e38",hair:"#2a2038"},  // dark hooded tunic
      };
      const dl = NPC_LOOK[n.id] || {};
      const npc = { id:n.id, tx:tx, ty:ty, dir:"down",
        color: lk.shirt || dl.shirt || "#7a8290", colorDk: lk.shirtDk || dl.shirtDk || "#4a5058", kind:NPC_KIND(lk), hairCol: lk.hair || dl.hair || "#3a2a1a",
        pants: lk.pants || "#3a3a44", outfitBase: lk.outfit || undefined, nameKey:"cs_name_"+n.id, caseNpc:true,
        lines:()=>{ const cl=caseLines(n.id); return cl || t("passerby_l"); }, onTalk:()=>caseOnTalk(n.id) };
      npc.px=npc.tx*TILE; npc.py=npc.ty*TILE;
      if(area==="town") npcs.push(npc);
      else { (AREA_NPCS[area]=AREA_NPCS[area]||[]).push(npc); }
    });

    // 4) attach a case hook to EXISTING npcs involved in the story (without breaking casual lines)
    const involved = new Set();
    sorted.forEach(q=>{ involved.add(q.start_npc); involved.add(q.complete_npc); });
    function hook(list){ list.forEach(npc=>{ if(!involved.has(npc.id) || npc.caseNpc) return;

  // ---- DEDUCTIONS: on 3 key beats, connect two clues before interrogating ----

  function startDeduction(id, after){

    if(!scour.active || areaKey!==scour.area) return;
    scour.points.forEach((p,i)=>{ if(scour.found[i]) return;
      const d=Math.abs(p[0]-player.tx)+Math.abs(p[1]-player.ty);
      if(d<=2){ const x=p[0]*TILE-cam.x, y=p[1]*TILE-cam.y; const pulse=0.4+0.4*Math.sin(performance.now()/160);
        ctx.fillStyle="rgba(255,240,150,"+(0.5*pulse).toFixed(2)+")"; ctx.fillRect(x+6,y+6,4,4); }
    });
  }

  const chase = { active:false, id:null, target:null, msg:"", msgT:0, _onWin:null, _onFail:null };
  function startChase(id){
    // suspect flees across town from near vito toward the far edge
    chase.active=true; chase.id=id; chase.msg=t("chase_intro"); chase.msgT=2.4;
    chase.target={ px:34*TILE, py:16*TILE, dir:"down", animT:0, dest:[2,2], speed:59, path:null, replan:0, tgt:null, escaped:0 };
    if(player.scooter){ player.scooter=false; SFX.scooterStop(); }   // on foot only
  }
  function endChase(caught){
    const id=chase.id; const cbW=chase._onWin, cbF=chase._onFail; chase.active=false; chase.target=null; chase._onWin=null; chase._onFail=null;
    if(id===null){   // casual scooter chase
      if(caught){ showExamine([t("chase_caught")], cbW||null); } else { showExamine([t("chase_lost0"),t("chase_lost1")], cbF||null); }
      saveGame(); return;
    }
    if(caught){ if(!CASE.chaseCaught) CASE.chaseCaught={}; CASE.chaseCaught[id]=true; showExamine([t("chase_caught")]); saveGame(); }
    else { showExamine([t("chase_lost0"),t("chase_lost1")]); saveGame(); }   // try again: re-talk to vito
  }
  function updateChase(dt){
    const tg=chase.target; if(!tg) return;
    if(chase.msgT>0) chase.msgT-=dt;
    // reached by player?
    const cx=Math.round(tg.px/TILE), cy=Math.round(tg.py/TILE);
    if(Math.abs(cx-player.tx)+Math.abs(cy-player.ty)<=1){ endChase(true); return; }
    // move suspect toward destination
    if(tg.tgt && !(Math.abs(tg.px-tg.tgt[0]*TILE)<0.6 && Math.abs(tg.py-tg.tgt[1]*TILE)<0.6)){
      const tX=tg.tgt[0]*TILE, tY=tg.tgt[1]*TILE, sp=tg.speed*dt;
      if(tg.px<tX){tg.px=Math.min(tX,tg.px+sp);tg.dir="right";} else if(tg.px>tX){tg.px=Math.max(tX,tg.px-sp);tg.dir="left";}
      if(tg.py<tY){tg.py=Math.min(tY,tg.py+sp);tg.dir="down";} else if(tg.py>tY){tg.py=Math.max(tY,tg.py-sp);tg.dir="up";}
      tg.animT+=dt;
    } else {
      tg.px=cx*TILE; tg.py=cy*TILE; tg.tgt=null;
      if(cx===tg.dest[0] && cy===tg.dest[1]){ endChase(false); return; }   // escaped
      tg.replan-=dt;
      if(!tg.path || tg.path.length===0 || tg.replan<=0){ tg.path=bfsPath(cx,cy,tg.dest[0],tg.dest[1]); tg.replan=1.5; }
      if(tg.path && tg.path.length){ tg.tgt=tg.path.shift(); } else { endChase(false); return; }
    }
  }
  function drawChase(){
    const tg=chase.target; if(!tg) return;
    // fleeing suspect (dark, hurried)
    drawHuman(tg.px-cam.x, tg.py-cam.y, tg.dir, true, Math.floor(tg.animT*8)%2, {skin:"#e0b080",hair:"#1a1a1a",shirt:"#4a2a2a",shirtDk:"#301818",pants:"#22222a",kind:"ym"});
    // "!" over him
    ctx.fillStyle="#ff2a2a"; ctx.fillRect(tg.px-cam.x+6, tg.py-cam.y-8, 2,4); ctx.fillRect(tg.px-cam.x+6, tg.py-cam.y-2, 2,2);
    // 🧭 freccia-bussola attorno al detective, punta sempre verso il fuggitivo
    const ang=Math.atan2((tg.py+8)-(player.py+8), (tg.px+8)-(player.px+8));
    const cx=player.px-cam.x+8, cy=player.py-cam.y+8, r=15;
    const ax=cx+Math.cos(ang)*r, ay=cy+Math.sin(ang)*r;
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(ang);
    ctx.fillStyle="#ff3030"; ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(-3,-3); ctx.lineTo(-3,3); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 🔴 se il fuggitivo è FUORI schermo, freccia rossa pulsante sul bordo
    const sx=tg.px-cam.x+8, sy=tg.py-cam.y+8;
    if(sx<0||sx>W||sy<0||sy>H){
      const mang=Math.atan2(sy-H/2, sx-W/2);
      const mx=Math.max(8,Math.min(W-8, W/2+Math.cos(mang)*88));
      const my=Math.max(14,Math.min(H-14, H/2+Math.sin(mang)*76));
      ctx.save(); ctx.translate(mx,my); ctx.rotate(mang);
      ctx.fillStyle="#ff2a2a"; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-5); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  function drawChaseUI(){
    const tg=chase.target;
    if(tg){
      // 📊 pannello: direzione cardinale + distanza + barra di prossimità
      const cx=Math.round(tg.px/TILE), cy=Math.round(tg.py/TILE);
      const d=Math.abs(cx-player.tx)+Math.abs(cy-player.ty);
      const dirs=["E","SE","S","SO","O","NO","N","NE"];
      const a=Math.atan2(tg.py-player.py, tg.px-player.px)*180/Math.PI;
      const card=dirs[Math.round(((a+360)%360)/45)%8];
      panelBox(W-70,2,68,12);
      text(card, W-66, 5, "#ffd0d0");
      text("d"+d, W-52, 5, d<=3?"#7ae06a":(d<=8?"#e0d040":"#ff8a6a"));
      const near=Math.max(0,1-Math.min(d,20)/20);
      ctx.fillStyle="#0a0a12"; ctx.fillRect(W-38,5,32,6);
      ctx.fillStyle= near>0.7?"#7ae06a":(near>0.35?"#e0d040":"#e05a5a");
      ctx.fillRect(W-37,6,Math.round(30*near),4);
    }
    if(chase.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(chase.msg,W/2,H-18,pal().accent); }
    else textCenter(t("chase_hint"),W/2,H-12,"#ffd0d0");
  }
  function drawClue(x,y){
    // small glowing evidence marker (folded paper / object)
    ctx.fillStyle="#0a0a12"; ctx.fillRect(x+4,y+6,8,7);
    ctx.fillStyle="#d8d0b0"; ctx.fillRect(x+5,y+7,6,5);
    ctx.fillStyle="#b83028"; ctx.fillRect(x+5,y+7,6,1);
    if(Math.floor(performance.now()/300)%2===0){ ctx.fillStyle="#ffcf50"; ctx.fillRect(x+7,y+4,2,2); }
  }

  // ---- INTRO (casual, yellow): Crudo arrives; marinaio sends him to the widow; talking to her
  //      completes the intro and unlocks the case + the casual quests. ----
  const INTRO = { startNpc:"hawkins", endNpc:"moll" };
  function introActiveFor(npcId){
    const q=QUESTS.intro; if(!q) return null;
    if(npcId===INTRO.startNpc && q.status==="available") return "start";
    if(npcId===INTRO.startNpc && q.status==="active") return "active";
    if(npcId===INTRO.endNpc && q.status==="active") return "end";
    return null;
  }
  function introLines(npcId){
    const m=introActiveFor(npcId); if(!m) return null;
    const key = m==="end" ? "intro_end" : (m==="active" ? "intro_wait" : "intro_start");
    const v=t(key); return (v===key)? null : v;
  }
  function introOnTalk(npcId){
    const m=introActiveFor(npcId); if(!m) return false;
    if(m==="start"){
      qStart("intro"); saveGame();
      // explain the marker system, then ask if understood; "no" repeats the explanation.
      const explainThenAsk=()=>{
        showExamine([].concat(t("intro_marks"), t("intro_marks2")), ()=>{
          askYesNo(t("intro_understood_q"), ()=>{
            showExamine(t("intro_go_widow"));   // YES -> go to the widow
          }, ()=>{
            explainThenAsk();                    // NO -> explain again + ask again
          });
        });
      };
      explainThenAsk();
      return true;
    }
    if(m==="end"){ qComplete("intro"); unlockCasualQuests(); unlockAfterIntro(); banner(t("intro_done")); saveGame(); return true; }
    return true; // "active": marinaio just repeats, no state change
  }
  function introNpcHasMark(npcId){ const m=introActiveFor(npcId); return m==="start"||m==="end"; }
  function unlockAfterIntro(){
    if(CASE.introDone) return; CASE.introDone=true;
    const first = CASE.order[0]; if(first && QUESTS[first]) QUESTS[first].status="available";
    if(typeof sqActivate==="function") sqActivate();   // unlock casual side-quests now
    saveGame();
  }

  // ================= SIDE-QUEST SLOT ENGINE (casual yellow quests, self-contained) =================
  const SQ_KINDS = ["recon","morale","confront","tail","fight","scooter","courier"];
  const SLOTS_PER_KIND = 1;   // one active side-quest per kind at a time (6 kinds pre-scooter, 7 after unlock),
                              // rotated by the slot engine. While one yellow is ACCEPTED/in progress
                              // (SQ.acceptedNpc set) all OTHER yellow markers hide, in-game and on the map.
  const SQ = { pool:{}, queueIdx:{}, active:[], done:{}, byNpc:{}, acceptedNpc:null, log:[] };
  SQ_KINDS.forEach(k=>{ SQ.pool[k]=[]; SQ.queueIdx[k]=0; });
  function sqLoadPool(){
    const src = window.SIDEQUESTS || null;
    if(src){ SQ_KINDS.forEach(k=>{ SQ.pool[k] = (src[k]||[]).slice(); }); return; }
    SQ_KINDS.forEach(k=>{ SQ.pool[k]=[]; for(let i=0;i<4;i++){ SQ.pool[k].push({ id:k+"_ph"+i, kind:k, title:{it:k+" #"+i, en:k+" #"+i}, giver:{it:["..."],en:["..."]} }); } });
  }
  // NPCs that are already dedicated micro-quest givers/receivers: they must NEVER also receive an SQ
  // side-quest (no "double hat" -> a single yellow source per NPC).
  const MICRO_GIVER_NPCS = new Set(["nonna","pino","boy","girl","fornaio","marinaio","nico","mamma"]);
  function sqCandidateNpcs(area){
    const all=[];
    if(!area || area==="town"){ npcs.forEach(n=>{ if(n) n._area="town"; all.push(n); }); }
    for(const ak in AREA_NPCS){ (AREA_NPCS[ak]||[]).forEach(n=>{ if(n){ n._area=ak; all.push(n); } }); }
    let list = all.filter(n=> n && n.id && !n.caseNpc && !n.fishing && !MICRO_GIVER_NPCS.has(n.id));
    if(area) list = list.filter(n=> n._area===area);
    return list;
  }
  function npcBusy(npcId){
    if(typeof caseActiveFor==="function" && caseActiveFor(npcId)) return true;
    if(typeof introActiveFor==="function" && introActiveFor(npcId)) return true;
    if(SQ.byNpc[npcId]) return true;
    return false;
  }
  function sqActivate(){
    // casual side-quests unlock only AFTER the intro is completed
    if(!(window.CASE_REF && window.CASE_REF.introDone)) return;
    SQ_KINDS.forEach(kind=>{
      if(kind==="scooter" && !scooterUnlocked) return;   // scooter missions only after unlock
      let activeOfKind = SQ.active.filter(m=>m.kind===kind).length;
      while(activeOfKind < SLOTS_PER_KIND && SQ.queueIdx[kind] < SQ.pool[kind].length){
        const m = SQ.pool[kind][SQ.queueIdx[kind]++];
        if(SQ.done[m.id]) continue;
        let npcId = m.npcId;
        if(!npcId || npcBusy(npcId)){
          // prefer a free NPC in the mission's own area, else any free NPC
          let free = sqCandidateNpcs(m.area).find(n=>!npcBusy(n.id));
          if(!free) free = sqCandidateNpcs().find(n=>!npcBusy(n.id));
          if(!free){ SQ.queueIdx[kind]--; break; }
          npcId = free.id;
        }
        m._npc = npcId; SQ.byNpc[npcId]=m; SQ.active.push(m); activeOfKind++;
      }
    });
  }
  function sqNpcMission(npcId){ return SQ.byNpc[npcId] || null; }
  function sqComplete(m){
    SQ.done[m.id]=true; SQ.active = SQ.active.filter(x=>x!==m); if(m._npc) delete SQ.byNpc[m._npc];
    // chronological log for the Journal's "completed micro-quests" list
    if(!SQ.log) SQ.log=[];
    if(!SQ.log.some(e=>e.id===m.id)){
      SQ.log.push({ id:m.id, kind:m.kind, title:(m.title||{it:m.id,en:m.id}), giver:(m.giver||null) });
    }
    saveGame(); sqActivate();
  }
  // true if a casual side-quest activity is currently in progress (one yellow at a time)
  function sqBusy(){
    if(typeof courier!=="undefined" && courier.active) return true;
    if(typeof scDeliv!=="undefined" && scDeliv.active) return true;
    if(tail.active && tail.id===null) return true;      // a casual tail is running
    if(chase.active && chase.id===null) return true;    // a casual scooter chase is running
    if(confront.active || fight.active || battle.active || naval.active || choice.active || fishing.active) return true;
    return false;
  }
  function sqStart(m){
    if(sqBusy() || SQ.acceptedNpc){ banner(t("sq_busy")); return; }   // finish the current yellow quest first
    // mark this yellow quest as accepted/in-progress: hides ALL other yellow markers (game + map)
    SQ.acceptedNpc = m._npc || null;
    const release = ()=>{ SQ.acceptedNpc=null; };
    const win = ()=>{ release(); banner(t("sq_done")); sqComplete(m); };
    const fail = (msgKey)=>{ release(); banner(t(msgKey||"sq_fail")); saveGame(); };
    if(m.kind==="morale"){
      askChoice((m.q&&m.q[lang])||"...", [ {label:(m.a&&m.a[lang])||"A",key:"A"}, {label:(m.b&&m.b[lang])||"B",key:"B"} ], ()=>{ showExamine(vpick("moral_after"), win); });
    } else if(m.kind==="recon"){
      const items=(m.events||[]).map((e,i)=>({key:"e"+i, label:trim((e[lang]||e.it||"")) }));
      runReconstruction(items, win, ()=>fail());
    } else if(m.kind==="confront"){
      const opts=(m.args||[]).map(a=>({label:trim((a.t&&a.t[lang])||""), good:!!a.good}));
      confront.caseId=null;
      runConfront(opts, win, ()=>fail(), (m.intro&&m.intro[lang]));
    } else if(m.kind==="tail"){
      runTailCfg(m.tail, win, ()=>fail());
    } else if(m.kind==="fight"){
      startFight("sq_"+m.id, win);
    } else if(m.kind==="scooter"){
      if(m.sub==="chase"){ startScChase(m, win, ()=>fail()); }
      else { startScDelivery(m, win, ()=>fail()); }
    } else if(m.kind==="courier"){
      startCourier(m, win, ()=>fail());
    } else { win(); }
  }
  // ---- scooter side-quest: timed delivery (reach the target before time runs out) ----
  const scDeliv={ active:false, tx:0, ty:0, t:0, onWin:null, onFail:null, msg:"", msgT:0 };
  function startScDelivery(m, onWin, onFail){
    if(!player.scooter){ banner(t("sc_needscooter")); if(onFail) onFail(); return; }
    scDeliv.active=true; scDeliv.tx=m.to[0]; scDeliv.ty=m.to[1]; scDeliv.t=m.time||26; scDeliv.onWin=onWin; scDeliv.onFail=onFail;
    scDeliv.msg=t("sc_go"); scDeliv.msgT=2.0;
  }
  function updateScDelivery(dt){
    if(!scDeliv.active) return;
    if(scDeliv.msgT>0) scDeliv.msgT-=dt;
    if(!player.scooter){ scDeliv.active=false; showExamine([t("sc_gotoff")], scDeliv.onFail); return; }  // got off -> fail
    scDeliv.t-=dt;
    if(Math.abs(player.tx-scDeliv.tx)+Math.abs(player.ty-scDeliv.ty)<=1){ scDeliv.active=false; showExamine([t("sc_delivered")], scDeliv.onWin); return; }
    if(scDeliv.t<=0){ scDeliv.active=false; showExamine([t("sc_toolate")], scDeliv.onFail); return; }
  }
  function drawScDeliveryUI(){
    if(!scDeliv.active) return;
    // timer bar + target arrow hint
    text(t("sc_label"),8,6,"#ffd0d0");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#1e2a3a"; ctx.fillRect(8,16,W-16,6);
    const frac=Math.max(0,Math.min(1,scDeliv.t/26)); ctx.fillStyle=frac<0.3?"#d83a3a":"#3a8ad0"; ctx.fillRect(8,16,Math.round((W-16)*frac),6);
    if(scDeliv.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(scDeliv.msg,W/2,H-18,pal().accent); }
  }
  // ---- COURIER side-quest: cross-map timed delivery on foot (reach a target in ANOTHER area) ----
  const courier={ active:false, area:"", tx:0, ty:0, t:0, tmax:1, onWin:null, onFail:null, msg:"", msgT:0 };
  function startCourier(m, onWin, onFail){
    courier.active=true; courier.area=m.to[0]; courier.tx=m.to[1]; courier.ty=m.to[2];
    courier.t=m.time||70; courier.tmax=m.time||70; courier.onWin=onWin; courier.onFail=onFail;
    courier.msg=t("cr_go"); courier.msgT=2.4;
  }
  function updateCourier(dt){
    if(!courier.active) return;
    if(courier.msgT>0) courier.msgT-=dt;
    courier.t-=dt;
    if(areaKey===courier.area && !insideKey && Math.abs(player.tx-courier.tx)+Math.abs(player.ty-courier.ty)<=1){
      courier.active=false; showExamine([t("cr_done")], courier.onWin); return;
    }
    if(courier.t<=0){ courier.active=false; showExamine([t("cr_toolate")], courier.onFail); return; }
  }
  function drawCourierUI(){
    if(!courier.active) return;
    text(t("cr_label"),8,6,"#ffe0a0");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#3a2e1a"; ctx.fillRect(8,16,W-16,6);
    const frac=Math.max(0,Math.min(1,courier.t/courier.tmax)); ctx.fillStyle=frac<0.3?"#d83a3a":"#e0a840"; ctx.fillRect(8,16,Math.round((W-16)*frac),6);
    // destination hint (area name), and whether you are in the right area
    const dest=(t("area_"+courier.area)||courier.area);
    const here=(areaKey===courier.area);
    if(courier.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(courier.msg,W/2,H-18,pal().accent); }
    else { panelBox(6,H-22,W-12,18); textCenter((here?t("cr_here"):t("cr_to")+" "+dest),W/2,H-18, here?"#7ae06a":pal().accent); }
  }
  // ---- scooter side-quest: chase (catch the fleeing target while on the scooter) ----
  function startScChase(m, onWin, onFail){
    chase.active=true; chase.id=null; chase.msg=t("chase_intro"); chase.msgT=2.4; chase._onWin=onWin; chase._onFail=onFail;
    chase.target={ px:m.from[0]*TILE, py:m.from[1]*TILE, dir:"down", animT:0, dest:m.to.slice(), speed:m.speed||70, path:null, replan:0, tgt:null };
  }
  function runTailCfg(cfg, onWin, onFail){
    tail.active=true; tail.id=null; tail.suspicion=0; tail.msg=t("tail_intro"); tail.msgT=2.4;
    tail._onWin=onWin; tail._onFail=onFail;
    tail.target={ px:cfg.from[0]*TILE, py:cfg.from[1]*TILE, dir:"down", animT:0, dest:cfg.to.slice(), speed:cfg.speed||16, path:null, replan:0, tgt:null };
  }
  function serializeSQ(){ return { done:SQ.done, qi:SQ.queueIdx, log:SQ.log||[] }; }
  function restoreSQ(o){ if(!o) return; if(o.done) SQ.done=o.done; if(o.qi) SQ.queueIdx=o.qi; SQ.log=o.log||[]; }
  function sqInit(){ sqLoadPool(); SQ.active=[]; SQ.byNpc={}; SQ.acceptedNpc=null; if(!SQ.log) SQ.log=[]; sqActivate(); }
  window.SQ_REF = SQ;

  // ================= LOOP =================
  let last=performance.now();
  function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1; SFX.setTempoScale(1.0); update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
