  const GUIDE_PAGES = GUIDE_PAGES_DATA;

  function openMenu(){ menu.open=true; menu.index=0; menu.showMap=false; menu.showJournal=false; menu.showNotebook=false; menu.showRules=false; menu.showGuide=false; menu.showCrew=false; menu.rulesPage=0; menu.guidePage=0; menu.jView="main"; menu.jSel=0; menu.jDoneMenuSel=0; menu.jDetail=null; SFX.confirm(); }
  function closeMenu(){ menu.open=false; menu.showMap=false; menu.showJournal=false; menu.showNotebook=false; menu.showRules=false; menu.showGuide=false; menu.showCrew=false; menu.jDetail=null; SFX.cancel(); }
  function updateMenu(dt){
    if(menu.showMap){
      if(mapNav.zoom){
        // zoomed into one area: B goes back to the grid
        if(consumePress("b")||consumePress("a")||consumePress("start")){ mapNav.zoom=null; SFX.cancel(); }
        return;
      }
      // grid view: move selection with the d-pad
      if(consumePress("left")){ do{ mapNav.col=(mapNav.col+2)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("right")){ do{ mapNav.col=(mapNav.col+1)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("up")){ do{ mapNav.row=(mapNav.row+2)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("down")){ do{ mapNav.row=(mapNav.row+1)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("a")){ const k=AREA_GRID[mapNav.col+","+mapNav.row]; if(k){ mapNav.zoom=k; SFX.confirm(); } return; }
      if(consumePress("b")||consumePress("start")){ menu.showMap=false; SFX.cancel(); }
      return;
    }
    if(menu.showJournal){
      // ---- REGISTRO DEL CAPITANO: 2 schede (0=Missioni, 1=Economia) ----
      if(menu.jTab===undefined) menu.jTab=0;
      // detail view (mission detail): B torna alla lista
      if(menu.jDetail!==null){
        if(consumePress("b")||consumePress("start")){ menu.jDetail=null; SFX.cancel(); }
        return;
      }
      // cambio scheda con sinistra/destra (0=Missioni, 1=Economia, 2=Prezzi)
      if(consumePress("left")){ menu.jTab=(menu.jTab+2)%3; menu.jSel=0; SFX.up&&SFX.up(); if(menu.jTab===2 && typeof tut2OnPrices==="function") tut2OnPrices(); }
      if(consumePress("right")){ menu.jTab=(menu.jTab+1)%3; menu.jSel=0; SFX.down&&SFX.down(); if(menu.jTab===2 && typeof tut2OnPrices==="function") tut2OnPrices(); }
      if(menu.jTab===0){
        // MISSIONI: lista unica (attive + completate), niente distinzione rosso/giallo
        const list=journalAllMissions();
        if(consumePress("up")){ if(list.length){ menu.jSel=(menu.jSel-1+list.length)%list.length; SFX.up&&SFX.up(); } }
        if(consumePress("down")){ if(list.length){ menu.jSel=(menu.jSel+1)%list.length; SFX.down&&SFX.down(); } }
        if(consumePress("a")){ if(list.length){ menu.jDetail=menu.jSel; SFX.confirm(); } }
      }
      // scheda ECONOMIA: sola lettura (nessuna selezione)
      if(consumePress("b")||consumePress("start")){ menu.showJournal=false; menu.jDetail=null; SFX.cancel(); }
      return;
    }
    if(menu.showNotebook){ if(consumePress("b")||consumePress("start")){ menu.showNotebook=false; SFX.cancel(); } return; }
    if(menu.showRules){
      const n=RULES_PAGES.length;
      if(consumePress("left")||consumePress("up")){ menu.rulesPage=(menu.rulesPage-1+n)%n; SFX.up&&SFX.up(); }
      if(consumePress("right")||consumePress("down")){ menu.rulesPage=(menu.rulesPage+1)%n; SFX.down&&SFX.down(); }
      if(consumePress("b")||consumePress("start")){ menu.showRules=false; SFX.cancel(); }
      return;
    }
    if(menu.showGuide){
      const n=GUIDE_PAGES.length;
      if(consumePress("left")||consumePress("up")){ menu.guidePage=(menu.guidePage-1+n)%n; SFX.up&&SFX.up(); }
      if(consumePress("right")||consumePress("down")){ menu.guidePage=(menu.guidePage+1)%n; SFX.down&&SFX.down(); }
      if(consumePress("b")||consumePress("start")){ menu.showGuide=false; SFX.cancel(); }
      return;
    }
    if(menu.showCrew){
      // Crudo Merchant: crew STATUS view (read-only). Recruitment happens at the Tavern.
      if(consumePress("b")||consumePress("start")||consumePress("a")){ menu.showCrew=false; SFX.cancel(); }
      return;
    }
    if(consumePress("up")) { menu.index=(menu.index-1+MENU_KEYS.length)%MENU_KEYS.length; SFX.up&&SFX.up(); }
    if(consumePress("down")) { menu.index=(menu.index+1)%MENU_KEYS.length; SFX.down&&SFX.down(); }
    if(consumePress("b")||consumePress("start")){ closeMenu(); return; }
    if(consumePress("a")){
      const k=MENU_KEYS[menu.index];
      if(k==="menu_journal"){ menu.showJournal=true; menu.jView="main"; menu.jTab=0; menu.jSel=0; menu.jDetail=null; if(typeof tutOnLog==="function") tutOnLog(); SFX.confirm(); }
      else if(k==="menu_notebook"){ menu.showNotebook=true; SFX.confirm(); }
      else if(k==="menu_crew"){ menu.showCrew=true; menu.crewSel=0; SFX.confirm(); }
      else if(k==="menu_map"){ menu.showMap=true; mapNav.zoom=null; const gp=gridPosOf(areaKey); mapNav.col=gp[0]; mapNav.row=gp[1]; SFX.confirm(); }
      else if(k==="menu_lang"){ toggleLang(); }
      else if(k==="menu_guide"){ menu.showGuide=true; menu.guidePage=0; SFX.confirm(); }
      else if(k==="menu_rules"){ menu.showRules=true; menu.rulesPage=0; SFX.confirm(); }
      else if(k==="menu_exit"){ saveGame(); closeMenu(); screen="title"; titleIndex=0; SFX.confirm(); }
    }
  }

  // ================= UPDATE =================
  function update(dt){
    if(cam.shake>0){ cam.shake=Math.max(0, cam.shake - dt*22); }   // shake decays quickly
    if(screen==="title") updateTitle(dt);
    else if(screen==="overworld"){ if(menu.open) updateMenu(dt); else updateWorld(dt); }
    // Crudo Merchant: two background tracks — 'sea' when sailing (boat / sea areas), 'pirate' on land.
    if(screen==="overworld" && SFX.musicPlaying && SFX.musicPlaying()){
      const seaNow = !insideKey && (player.boat || areaKey==="opensea");
      const want = seaNow ? "sea" : "pirate";
      if(SFX._track !== want) SFX.setTrack(want);
      // On land & standing still, slow the melody down (more stately, "Pirates of the Caribbean" swing);
      // it picks back up to normal tempo while walking. Sea theme keeps its steady roll.
      if(SFX.setTempoScale){
        const standingOnLand = !seaNow && !insideKey && !player.moving;
        SFX.setTempoScale(standingOnLand ? 1.35 : 1.0);
      }
    }
    if(seasonPopup>0) seasonPopup-=dt;
    if(bannerT>0) bannerT-=dt;
    if(questPopT>0) questPopT-=dt;
    if(screen==="overworld" && !insideKey && !menu.open){ updateWeather(dt); updateFog(dt); advanceClock(dt); if(typeof marketTick==="function") marketTick(dt); if(typeof routeTick==="function") routeTick(dt); if(typeof contractTick==="function") contractTick(dt);
      // Crudo Merchant: l'ultimo ordine (salpa) si completa appena lasci Porto Franco via mare.
      if(typeof tutActive==="function" && tutActive() && tutCur()==="sail" && areaKey!=="town"){ tutAdvance("sail"); }
      // Crudo Merchant: avvia la seconda serie di guide (Imprese del Capitano) appena gli Ordini finiscono.
      if(typeof tut2Maybe==="function") tut2Maybe();
      // Crudo Merchant: le stagioni ruotano SEMPRE col passare del tempo (economia + aspetto del mondo)
      seasonAutoTimer+=dt; if(seasonAutoTimer>=SEASON_AUTO_SECS){ seasonAutoTimer=0; cycleSeason(); }
    }
  }
  function updateTitle(dt){
    const options=hasSave()?2:1;
    if(consumePress("up")) titleIndex=(titleIndex-1+options)%options;
    if(consumePress("down")) titleIndex=(titleIndex+1)%options;
    if(consumePress("select")) toggleLang();
    if(consumePress("a")){ SFX.confirm(); if(hasSave()&&titleIndex===0) loadGame(); else resetProgress(); SFX.setTrack("pirate"); if(!SFX.musicPlaying()) SFX.startMusic("pirate"); screen="overworld"; }
    else if(consumePress("start")){ toggleLang(); }
  }
  function facingTile(){ let fx=player.tx,fy=player.ty; if(player.dir==="up")fy--; else if(player.dir==="down")fy++; else if(player.dir==="left")fx--; else if(player.dir==="right")fx++; return {fx,fy}; }
  function npcAt(tx,ty){
    if(insideKey){ for(const inpc of currentInteriorNpcs()){ if(inpc.tx===tx && inpc.ty===ty) return inpc; } return null; }
    return currentNpcs().find(n=>Math.round(n.px/TILE)===tx && Math.round(n.py/TILE)===ty);
  }
  function opposite(d){ return {up:"down",down:"up",left:"right",right:"left"}[d]; }

  function enterInterior(key,outX,outY){ returnArea=areaKey; insideKey=key; outsideReturn={tx:outX,ty:outY};
    useMap(INTERIORS[key].rows); const sp=INTERIORS[key].spawn; player.tx=sp.tx; player.ty=sp.ty; player.px=sp.tx*TILE; player.py=sp.ty*TILE; player.dir="up"; player.moving=false; SFX.door(); }
  function exitInterior(){ insideKey=null; areaKey=returnArea||"town"; useMap(AREAS[areaKey]); player.tx=outsideReturn.tx; player.ty=outsideReturn.ty; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir="down"; player.moving=false; outsideReturn=null; SFX.door(); saveGame(); }

  function updateWorld(dt){
    player.animT+=dt;
    if(player.scooter && SFX.scooterRev) SFX.scooterRev(player.moving);
    if(mauling.active){ updateMauling(dt); return; }   // freeze the world during the attack fade
    if(!insideKey && chase.active) updateChase(dt);
    if(areaKey==="opensea"){ updateSeaCurrent(dt); if(regatta.active) updateRegatta(dt); if(recovery.active) updateRecovery(dt); }
    if(!insideKey && typeof courier!=="undefined" && courier.active) updateCourier(dt);
    if(!insideKey){ maybeStartTail(); if(tail.active) updateTail(dt); }
    if(!insideKey){ maybeStartScour(); if(scour.active) updateScour(dt); }
    // spawn/refresh ambient fauna when the outdoor area changes; clear it indoors
    if(insideKey){ if(faunaArea!==null){ fauna=[]; faunaArea=null; } }
    else if(faunaArea!==areaKey){ spawnFauna(areaKey); faunaArea=areaKey; discoverArea(areaKey); }
    if(!insideKey && fauna.length) updateFauna(dt);
    if(battleCooldown>0) battleCooldown-=dt;
    if(navalCooldown>0) navalCooldown-=dt;
    if(!insideKey && fauna.length) checkBattleEncounter();   // Crudo Merchant: contact with hostile fauna starts a battle
    // Crudo Merchant: ambient AI boats
    if(insideKey){ if(shipsArea!==null){ ships=[]; shipsArea=null; } }
    else if(shipsArea!==areaKey){ spawnShips(areaKey); shipsArea=areaKey; }
    if(!insideKey && ships.length) updateShips(dt);
    if(!insideKey && player.boat && ships.length && !naval.active) checkNavalEncounter();   // Crudo Merchant: contact with a hostile ship starts a naval battle
    if(!insideKey){ updateNpcs(dt);
      if(inTown()){ updateAnimals(dt);
        for(const s of swimmers){ s.animT+=dt; s.x+=s.dir*s.sp*dt; if(s.x<=s.x0){ s.x=s.x0; s.dir=1; } else if(s.x>=s.x1){ s.x=s.x1; s.dir=-1; } }
        updatePortFolk(portFolk, dt);
      }
      if(areaKey==="holiday"){
        for(const s of holidaySwimmers){ s.animT+=dt; s.x+=s.dir*s.sp*dt; if(s.x<=s.x0){ s.x=s.x0; s.dir=1; } else if(s.x>=s.x1){ s.x=s.x1; s.dir=-1; } }
        updatePortFolk(holidayPortFolk, dt);
      }
      for(const b of currentBuoys()) b.animT+=dt;
      if(areaKey==="mountain" && season==="winter") updateSkiers(dt);
    }

    // fishing activity: 5-second rod animation, no input except waiting
    if(fishing.active){ fishing.t+=dt; if(fishing.t>=5){ fishing.active=false;
      // Crudo Merchant: la pesca FRUTTA — 1-2 pesci in stiva (o un po' d'oro se la stiva e' piena).
      // Rete di sicurezza economica: il giocatore puo' sempre guadagnare da zero.
      const catchN = 1 + (Math.random()<0.5?1:0);
      let gained=0;
      if(typeof cargo!=="undefined" && typeof cargoUsed==="function" && typeof cargoCap==="function"){
        for(let k=0;k<catchN && cargoUsed()<cargoCap();k++){ cargo.fish=(cargo.fish||0)+1; gained++; }
      }
      if(gained>0){ banner(t("fishing_caught").replace("#n",gained)); }
      else { const coin=6+Math.floor(Math.random()*6); player.gold+=coin; banner(t("fishing_sold").replace("#d",coin)); }
      SFX.pickup(); saveGame(); } return; }
    // interrogation multiple-choice
    // Contextual tutorial / narrator panels take priority so they pause any minigame beneath them.
    if(dialog.active){ dialog.reveal+=dt*48; if(consumePress("a")||consumePress("start")||consumePress("b")) advanceDialog(); return; }
    if(naval.active){ updateNaval(dt); return; }
    if(battle.active){ updateBattle(dt); return; }
    if(fight.active){ updateFight(dt); return; }
    if(fishSkill.active){ updateFishingSkill(dt); return; }
    if(confront.active){ updateConfront(dt); return; }
    if(choice.active){ updateChoice(); return; }
    // yes/no prompt
    if(prompt2.active){
      if(consumePress("left")||consumePress("right")||consumePress("up")||consumePress("down")) prompt2.sel=prompt2.sel?0:1;
      if(consumePress("a")){ const y=prompt2.sel===0; prompt2.active=false; SFX.confirm(); if(y){ if(prompt2.yes) prompt2.yes(); } else { if(prompt2.no) prompt2.no(); } }
      else if(consumePress("b")){ prompt2.active=false; SFX.cancel(); if(prompt2.no) prompt2.no(); }
      return;
    }

    if(shipyard.open){ updateShipyard(); return; }   // Crudo Merchant: shipyard menu captures input
    if(trade.open){ updateTrade(); return; }   // Crudo Merchant: trade market captures input
    if(armory.open){ updateArmory(); return; }        // Crudo Merchant: armoury menu captures input
    if(dialog.active){ dialog.reveal+=dt*48; if(consumePress("a")||consumePress("start")||consumePress("b")) advanceDialog(); return; }
    if(consumePress("start")){ openMenu(); return; }     // START opens menu
    if(consumePress("select")){ return; }   // SELECT disabled (no scooters in the age of pirates)

    if(consumePress("a")){
      // Crudo Merchant: primo ORDINE del tutorial — garantisci lo sbarco iniziale dalla barca.
      if(typeof tutCur==="function" && tutCur()==="intro" && player.boat && !insideKey){
        let dst=null, bd=99;
        for(let dy=-2;dy<=2 && !dst;dy++) for(let dx=-2;dx<=2;dx++){ const tx=player.tx+dx, ty=player.ty+dy;
          const c=tileAt(tx,ty); if(c===undefined) continue;
          const landOk = (c==="w") ? !(typeof isMooredBlock==="function" && isMooredBlock(tx,ty)) : (c!=="~" && c!=="q" && !isSolid(tx,ty));
          if(landOk){ const d=Math.abs(dx)+Math.abs(dy); if(d<bd){ bd=d; dst={tx,ty}; } } }
        if(dst){ player.boat=false; player.swimming=false; player.tx=dst.tx; player.ty=dst.ty; player.px=dst.tx*TILE; player.py=dst.ty*TILE; player.dir="up";
          SFX.door&&SFX.door(); banner(t("island_land")); if(typeof tutOnLand==="function") tutOnLand(); saveGame(); return; }
      }
      // Crudo Merchant: INSEGNE informative — premi A se adiacente. Mostra la spiegazione, poi apre il menu.
      if(!insideKey && !player.boat && AREA_SIGNS[areaKey]){
        for(const s of AREA_SIGNS[areaKey]){ if(Math.abs(player.tx-s.tx)<=1 && Math.abs(player.ty-s.ty)<=1){
          const openIt=()=>{ if(s.act==="shipyard") openShipyard(); else if(s.act==="tavern") openTavern(); else if(s.act==="merchant") openMerchant(areaKey); else if(s.act==="armory") openArmory(); };
          const info=t(s.info);
          if(info && info!==s.info){ showExamine(info, openIt); } else { openIt(); }
          SFX.confirm&&SFX.confirm(); return;
        } }
      }
      const {fx,fy}=facingTile();
      const n=npcAt(fx,fy);
      if(n){ if(n.dir!==undefined) n.dir=opposite(player.dir);
        const sqm = (typeof sqNpcMission==="function") ? sqNpcMission(n.id) : null;
        const kind = npcQuestKind(n);   // single source of truth: matches the on-screen "!" exactly
        const storyActive = (typeof caseActiveFor==="function" && caseActiveFor(n.id)) || (typeof introActiveFor==="function" && introActiveFor(n.id)) || npcHasQuest(n);
        // Offer the SQ side-quest ONLY if this NPC's yellow marker is actually shown right now
        // (kind==="casual") and it's not a micro/story NPC. Keeps interaction == marker.
        if(sqm && kind==="casual" && !storyActive){ showExamine((sqm.giver&&sqm.giver[lang])||["..."], ()=>{ askYesNo(t("accept_quest_q"), ()=>sqStart(sqm)); }); return; }
        openDialog(n); return; }
      const fc=tileAt(fx,fy);
      // Crudo Merchant: BOUNTY TREASURE — dig the X (stand on/next to it, press A) to loot the chest
      if(!insideKey && bounty.treasure && bounty.treasure.area===areaKey && bounty.active && bounty.active.type==="treasure" && !bounty.active.dug){
        const t2=bounty.treasure; const near=(Math.abs(player.tx-t2.tx)<=1 && Math.abs(player.ty-t2.ty)<=1) || (fx===t2.tx&&fy===t2.ty);
        if(near){ bounty.active.dug=true; const g=Math.round(bounty.active.gold*0.5); player.gold+=g; addFame(8);
          banner(t("bnt_dug").replace("#",g)); SFX.unlock&&SFX.unlock(); saveGame(); return; }
      }
      // Crudo Merchant: SHIPYARD shack at the central pier tip -> press A to open the ship status/upgrade menu
      if(inTown() && !insideKey && !player.boat && fc==="$"){ openShipyard(); SFX.confirm&&SFX.confirm(); return; }
      // board the ship: standing at the end of the pier, facing the moored ferry
      if(inTown() && !insideKey && Math.abs(fx-ship.tx)<=2 && Math.abs(fy-ship.ty)<=2){ openDockMenu({kind:"openseaFerry"}); SFX.confirm(); return; }
      // Crudo Merchant: moored boats at King's Borough piers + Lighthouse Point pier -> unified dock menu
      if(!insideKey && (areaKey==="industrial"||areaKey==="cape")){
        for(const b of MOORED_BOATS){ if(b.area!==areaKey) continue;
          if(Math.abs(fx-b.tx)<=2 && Math.abs(fy-b.ty)<=2){
            if(b.action==="opensea"){ openDockMenu({kind:"openseaFerry"}); }
            else {
              // land onto the nearest dock tile (never leave the player floating on water)
              const dock = nearestDockTile(player.tx,player.ty,3) || nearestDockTile(b.tx,b.ty,3);
              openDockMenu({kind:"cape", boat:!!player.boat, boatTx:b.tx, boatTy:Math.min(cur.h-1,b.ty+1), landTx:(dock?dock.tx:player.tx), landTy:(dock?dock.ty:player.ty), landDir:player.dir});
            }
            SFX.confirm&&SFX.confirm(); return;
          }
        }
      }
      // Crudo Merchant: NORTHERN SEAS (Natives' Archipelago=forestNW, North Sea=mountain) and the
      // King's Countryside (forestNE) west beach: no piers. Press A to LAND onto an adjacent shore
      // when in the boat, or to SET SAIL from a shore when on foot/swimming. Message-driven.
      // FIX (bug SBARCO): include FREE PORT (town) too, so you can ALWAYS step ashore on any beach,
      // promenade or dock the boat is touching (previously town showed "A: land" but nothing happened).
      if(!insideKey && (areaKey==="forestNW"||areaKey==="mountain"||areaKey==="forestNE"||areaKey==="holiday"||areaKey==="industrial"||areaKey==="town")){
        const seaC=(areaKey==="industrial")?"q":"~";
        const isSea=(tx,ty)=>{ const c=tileAt(tx,ty); return c===seaC || c==="~"; };
        // A landing tile is any NON-water tile you can stand on: walkable shore/promenade/sand,
        // OR a dock tile 'w' (walkable pier) that isn't blocked by a moored hull.
        const landable=(tx,ty)=>{ if(isSea(tx,ty)) return false; const c=tileAt(tx,ty);
          if(c==="w") return !(typeof isMooredBlock==="function" && isMooredBlock(tx,ty));   // step onto the pier
          return !isSolid(tx,ty); };
        if(player.boat){
          // find an adjacent shore/deck/dock tile to step onto (facing first, then any neighbour)
          let dst=null;
          if(landable(fx,fy)) dst={tx:fx,ty:fy};
          else { for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(landable(player.tx+dx,player.ty+dy)){ dst={tx:player.tx+dx,ty:player.ty+dy}; break; } } }
          if(dst){ player.boat=false; player.swimming=false; player.tx=dst.tx; player.ty=dst.ty; player.px=dst.tx*TILE; player.py=dst.ty*TILE;
            SFX.door&&SFX.door(); banner(t("island_land")); if(typeof tutOnLand==="function")tutOnLand(); saveGame(); return; }
        } else {
          // on foot/swimming: set sail if facing water (or any adjacent water tile)
          let btx=null,bty=null;
          if(isSea(fx,fy)){ btx=fx; bty=fy; }
          else { for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(isSea(player.tx+dx,player.ty+dy)){ btx=player.tx+dx; bty=player.ty+dy; break; } } }
          if(btx!==null){ player.boat=true; player.swimming=false; player.tx=btx; player.ty=bty; player.px=btx*TILE; player.py=bty*TILE; player.dir="down";
            SFX.door&&SFX.door(); banner(t("island_board")); saveGame(); return; }
        }
      }
      // island signpost: read a warning about the cult
      if(areaKey==="island" && !insideKey && fc==="P"){ showExamine(t("sign_island")); SFX.confirm&&SFX.confirm(); return; }
      if(areaKey==="cape" && !insideKey && fc==="P"){ showExamine(t("sign_cape")); SFX.confirm&&SFX.confirm(); return; }
      // island temple: enter through the door
      if(areaKey==="island" && !insideKey && !player.boat && fc==="D"){ enterInterior("temple", player.tx, player.ty); return; }
      // island / cape docks: unified menu (see the moored boat, press A to board/disembark)
      if((areaKey==="island"||areaKey==="cape") && !insideKey){
        if(player.boat){
          // Robust disembark: land wherever a dock tile is TOUCHING the boat, not only the exact
          // facing tile. Prefer the facing dock tile; otherwise use the closest dock tile around us.
          // This guarantees you can always step onto the pier (inside its fences) instead of being
          // left stuck floating in the sea when the tip is blocked or you approached at an angle.
          let dock = (fc==="w" && !isMooredBlock(fx,fy)) ? {tx:fx,ty:fy} : nearestDockTile(player.tx,player.ty,2);
          if(dock){ openDockMenu({kind:areaKey, boat:true, landTx:dock.tx, landTy:dock.ty, landDir:player.dir}); SFX.confirm&&SFX.confirm(); return; }
          // FIX (bug SBARCO): no pier nearby (you rowed straight onto a beach/island shore) -> step
          // ashore directly onto any adjacent walkable land tile, so landing is ALWAYS possible.
          {
            const landable=(tx,ty)=>{ const c=tileAt(tx,ty); if(c==="~") return false;
              if(c==="w") return !isMooredBlock(tx,ty); return !isSolid(tx,ty); };
            let dst=null;
            if(landable(fx,fy)) dst={tx:fx,ty:fy};
            else { for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(landable(player.tx+dx,player.ty+dy)){ dst={tx:player.tx+dx,ty:player.ty+dy}; break; } } }
            if(dst){ player.boat=false; player.swimming=false; player.tx=dst.tx; player.ty=dst.ty; player.px=dst.tx*TILE; player.py=dst.ty*TILE;
              SFX.door&&SFX.door(); banner(t("island_land")); if(typeof tutOnLand==="function")tutOnLand(); saveGame(); return; }
          }
        } else {
          // On foot at the dock, facing water -> board. Accept any adjacent sea tile.
          if(tileAt(player.tx,player.ty)==="w" && (fc==="~"||fc==="w")){
            let btx=fx, bty=fy;
            if(tileAt(btx,bty)!=="~"){ // facing isn't open water: pick an adjacent sea tile to launch into
              const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
              for(const [dx,dy] of dirs){ if(tileAt(player.tx+dx,player.ty+dy)==="~"){ btx=player.tx+dx; bty=player.ty+dy; break; } }
            }
            if(tileAt(btx,bty)==="~"){ openDockMenu({kind:areaKey, boat:false, boatTx:btx, boatTy:bty}); SFX.confirm&&SFX.confirm(); return; }
          }
        }
      }
      if(!insideKey && inTown() && DOORS[fc]){ enterInterior(DOORS[fc].interior, DOORS[fc].outX, DOORS[fc].outY); return; }
      if(!insideKey && !inTown() && (/[1-9]/.test(fc)) && AREA_INTERIOR[areaKey]){
        const ai=AREA_INTERIOR[areaKey];
        const interior = (typeof ai==="string") ? ai : ai[fc];
        if(interior){ enterInterior(interior, player.tx, player.ty); return; }
      }
      if(insideKey && fc==="e"){ exitInterior(); return; }
      if(!insideKey && typeof tryScourSpot==="function" && scour.active && tryScourSpot(fx,fy)){ return; }
      if(!insideKey && typeof tryPickupClue==="function" && tryPickupClue(fx,fy)){ return; }
    }

    if(!player.moving){
      let ntx=player.tx,nty=player.ty,nd=player.dir,want=false;
      if(keys.up){nty--;nd="up";want=true;} else if(keys.down){nty++;nd="down";want=true;}
      else if(keys.left){ntx--;nd="left";want=true;} else if(keys.right){ntx++;nd="right";want=true;}
      if(want){ player.dir=nd;
        // edge crossing to a neighbor area (screen transition)
        if(!insideKey && (ntx<0||ntx>=cur.w||nty<0||nty>=cur.h)){
          let dir=null; if(nty<0) dir="N"; else if(nty>=cur.h) dir="S"; else if(ntx<0) dir="W"; else if(ntx>=cur.w) dir="E";
          if(areaKey==="opensea"){
            if(dir==="N"){ leaveOpenSea(); return; }        // north edge returns to the pier
            if(dir==="E"){ enterIslandWaters("opensea"); return; }   // sail east to reach Treasure Island (SE)
            if(dir==="W"){ enterCapeWaters(); return; }     // sail west to reach Lighthouse Cape (SW)
            return;   // south/other edges = open water wall (Deep Sea removed)
          }
          if(areaKey==="island"){
            if(dir==="W" && player.boat){ islandToOpenSea(); return; }      // WEST edge -> Open Sea (S)
            if(dir==="N" && player.boat){ crossSeaEdge("industrial","N"); return; }   // NORTH edge -> King's Borough SEA (not the pier)
            return;   // other edges (E/S) = open water wall
          }
          if(areaKey==="cape"){
            if(dir==="E" && player.boat){ capeToOpenSea(); return; }   // sail east back to the Open Sea
            if(player.boat && dir!=="N") return;   // in the boat, E/S/W of cape are open-water walls
            // NORTH edge (on foot OR by boat/swim through the west corridor) -> holiday, handled below
          }
          // Crudo Merchant: PORTO FRANCO (town) now ends in a northern cliff -> no walking north to the sea.
          if(areaKey==="town" && dir==="N") return;   // north cliff wall, no crossing
          // Crudo Merchant: sailing SOUTH out of Free Port's waters -> the Open Sea. (boat/swim only)
          if(areaKey==="town" && dir==="S" && (player.boat||player.swimming)){ if(typeof tutOnSail==="function") tutOnSail(); crossSeaEdge("opensea","S"); return; }
          // Crudo Merchant: sailing SOUTH out of King's Borough waters -> Treasure Island's sea. (boat/swim only)
          if(areaKey==="industrial" && dir==="S" && (player.boat||player.swimming)){ crossSeaEdge("island","S"); return; }
          // Crudo Merchant: the northern seas (Natives' Archipelago = forestNW, North Sea = mountain)
          // and the King's Countryside west beach connect PURELY by sea. Only cross where the exit
          // tile is water ('~'); a land/cliff edge is a wall. State (boat/swim) is preserved.
          const NORTH_SEA_AREAS = (areaKey==="forestNW"||areaKey==="mountain");
          if(NORTH_SEA_AREAS){
            // open edges: forestNW -> E:mountain, S:holiday(west corridor) ; mountain -> W:forestNW, E:forestNE
            const okDir = (areaKey==="forestNW") ? (dir==="E"||dir==="S")
                                                 : (dir==="W"||dir==="E");   // mountain: NEVER south
            if(!okDir) return;                                 // other edges = open-water wall
            // only cross over water
            if(tileAt(player.tx,player.ty)!=="~") return;
            // Natives' Archipelago SOUTH -> always enter the Pirates' Bay (holiday) WEST SEA CORRIDOR,
            // never Porto Franco. Force the entry column into the corridor (cols 1..6). (Bug fix.)
            if(areaKey==="forestNW" && dir==="S"){
              crossSeaEdge("holiday", "S", 3); return;   // 3 = middle of the west corridor
            }
            const nb0=neighborArea(dir); if(!nb0) return;
            crossSeaEdge(nb0, dir); return;
          }
          // holiday NORTH edge opens to the Natives' Archipelago ONLY through the west sea corridor
          if(areaKey==="holiday" && dir==="N"){
            if(player.boat||player.swimming||tileAt(player.tx,player.ty)==="~"){ crossSeaEdge("forestNW", dir, Math.min(4,player.tx)); return; }
            return;   // rest of the north border is cliff -> wall
          }
          // holiday SOUTH edge -> cape. In the boat/swimming (west corridor) keep afloat; on land walk across.
          if(areaKey==="holiday" && dir==="S"){
            if(player.boat||player.swimming||tileAt(player.tx,player.ty)==="~"){ crossSeaEdge("cape", "S", player.tx<=6?player.tx:undefined); return; }
            switchArea("cape", player.tx, 0); return;
          }
          // cape NORTH edge -> holiday. In the boat/swimming (west corridor) keep afloat; on land walk across. (Point 6)
          if(areaKey==="cape" && dir==="N"){
            if(player.boat||player.swimming||tileAt(player.tx,player.ty)==="~"){ crossSeaEdge("holiday", "N", player.tx<=6?player.tx:undefined); return; }
            // on foot on the cape land -> walk into holiday
            switchArea("holiday", player.tx, cur.h-1); return;
          }
          const nb=neighborArea(dir);
          if(nb && ISOLATED_AREAS.has(nb)) return;   // island/open sea: reachable only by ship
          // King's Countryside (forestNE) west edge -> North Sea (mountain), by sea only
          if(areaKey==="forestNE" && dir==="W"){
            if(tileAt(player.tx,player.ty)==="~"){ crossSeaEdge("mountain", dir); return; }
            return;   // rest of west border is land/tree -> wall
          }
          // King's Countryside SOUTH edge -> King's Borough, ON FOOT (dry land) ONLY. The west sea
          // strip must NOT lead south (that dumped the boat onto invalid tiles). (Bug 2 fix.)
          if(areaKey==="forestNE" && dir==="S"){
            if(tileAt(player.tx,player.ty)==="~" || player.boat || player.swimming) return;   // sea strip: south is a wall
            // fall through to the generic neighbor crossing below (dry land)
          }
          if(nb){
            let ex=player.tx, ey=player.ty;
            if(dir==="N") ey=cur.h-1; else if(dir==="S") ey=0; else if(dir==="W") ex=cur.w-1; else if(dir==="E") ex=0;
            // Crudo Merchant: if we're afloat (boat) or swimming, keep that state and land on the
            // neighbor's water via crossSeaEdge; otherwise walk across on foot.
            if((player.boat||player.swimming)){ crossSeaEdge(nb, dir); return; }
            // clamp entry into walkable range near the edge
            switchArea(nb, ex, ey);
          }
          return; // don't fall through to tryMove
        }
        if(tryMove(ntx,nty)) { player.moving=true; if(!player.boat && typeof tutOnMove==="function") tutOnMove(); }
      }
    } else {
      const footSpeed = keys.a ? SNEAK_SPEED : (keys.b ? RUN_SPEED : MOVE_SPEED);   // hold A=sneak, B=run
      const boatSp=BOAT_SPEED*((BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop).speedMul + crewBonus("speed"));
      const tX=player.tx*TILE,tY=player.ty*TILE,st=(player.boat?boatSp:(player.swimming?MOVE_SPEED*0.62:(player.scooter?SCOOTER_SPEED:footSpeed)))*dt;
      if(player.px<tX)player.px=Math.min(tX,player.px+st); if(player.px>tX)player.px=Math.max(tX,player.px-st);
      if(player.py<tY)player.py=Math.min(tY,player.py+st); if(player.py>tY)player.py=Math.max(tY,player.py-st);
      if(player.px===tX&&player.py===tY){ player.moving=false; if(insideKey && tileAt(player.tx,player.ty)==="e"){ exitInterior(); return; } if(!insideKey && !player.swimming) saveGame(); }
    }
    updateCamera();
  }

  // A collectible item sitting on a tile blocks movement (you bump into it and pick it up with A),
  // instead of walking over it. Covers story clues + the original micro-quest items.
  function isCollectibleBlocking(tx,ty){
    if(insideKey) return false;
    // story clues currently active in this area (tail beats have no physical pickup -> excluded)
    if(typeof currentClues==="function"){
      for(const {c} of currentClues()){ if(c.tx===tx && c.ty===ty) return true; }
    }
    return false;
  }

  // Handle a step attempt; returns true if the move starts. Manages swimming + buoys + messages.
  function tryMove(ntx,nty){
    const target=tileAt(ntx,nty);
    if(npcAt(ntx,nty) || (!insideKey && isCollectibleBlocking(ntx,nty))) return false;   // bump into pickups, don't walk over them
    // Crudo Merchant: moored boats at piers act like a WALL when you're on foot/swimming (don't swim past them)
    if(!insideKey && !player.boat && typeof isMooredBlock==="function" && isMooredBlock(ntx,nty)) return false;

    // ---- BOAT over water in ANY coastal/sea area: ride only over '~' (dock/land with A / step ashore).
    //      This must run BEFORE the swim branch so a boat entering Pirates' Bay / Free Port keeps the
    //      boat instead of being turned into a swimmer. (Bug fix: losing the boat in the west corridor.) ----
    if(!insideKey && player.boat && (areaKey==="opensea"||areaKey==="island"||areaKey==="cape"||areaKey==="holiday"||areaKey==="town"||areaKey==="industrial"||areaKey==="forestNW"||areaKey==="mountain"||areaKey==="forestNE")){
      if(target==="~" || (areaKey==="industrial" && target==="q")){ player.tx=ntx; player.ty=nty; return true; }
      return false;   // boat can't ride onto land/dock; press A near a shore to step off
    }
    // ---- SEA / SWIMMING (town & holiday use '~', industrial uses 'q'; cape/northern seas allow free swimming) ----
    const seaChar = (areaKey==="industrial") ? "q" : "~";
    const FREE_SWIM = (areaKey==="cape"||areaKey==="forestNW"||areaKey==="mountain"||areaKey==="forestNE");   // open seas: no buoy limit, no winter freeze
    const isSeaArea = (areaKey==="town"||areaKey==="holiday"||areaKey==="industrial"||areaKey==="cape"||areaKey==="forestNW"||areaKey==="mountain"||areaKey==="forestNE");
    // the moored ferry blocks the water south of the east pier: bump into it, don't dive past it
    if(isSeaArea && !insideKey && isShipBlock(ntx,nty)){ return false; }
    if(isSeaArea && !insideKey && target===seaChar){
      if(season==="winter" && !FREE_SWIM){ banner(t("sea_winter")); return false; }   // no swimming in winter (except open seas)
      // beach areas: block going past the old buoy line to the south; open seas have no limit
      if(!FREE_SWIM && nty>SWIM_BOTTOM && nty>=player.ty){ banner(t("buoy_msg")); return false; }
      // enter water: contextual message on first entry
      if(!player.swimming){ player.swimming=true; if(player.scooter){ player.scooter=false; SFX.scooterStop(); } banner(t(areaKey==="industrial"?"sea_polluted":("sea_"+season))); }
      player.tx=ntx; player.ty=nty; if(!player.boat)SFX.step(); return true;
    }
    // moving onto land
    if(isSolid(ntx,nty)) return false;
    if(player.swimming){ player.swimming=false; }   // climb out of the water
    player.tx=ntx; player.ty=nty; if(!player.boat)SFX.step(); return true;
  }

  function updateAnimals(dt){
    for(const a of animals){
      const wd=a.wander; const target=wd.pts[(wd.i+1)%wd.pts.length];
      const tX=target[0]*TILE, tY=target[1]*TILE, sp=wd.speed*dt;
      let dx=tX-a.px, dy=tY-a.py;
      if(Math.abs(dx)<=sp && Math.abs(dy)<=sp){ a.px=tX; a.py=tY; wd.i=(wd.i+1)%wd.pts.length; }
      else {
        let nx=Math.round(a.px/TILE), ny=Math.round(a.py/TILE);
        if(Math.abs(dx)>Math.abs(dy)){ nx+=Math.sign(dx); a.dir=dx>0?"right":"left"; }
        else { ny+=Math.sign(dy); a.dir=dy>0?"down":"up"; }
        if(isSolid(nx,ny)){ a.px=Math.round(a.px/TILE)*TILE; a.py=Math.round(a.py/TILE)*TILE; wd.i=(wd.i+1)%wd.pts.length; }
        else if(Math.abs(dx)>Math.abs(dy)) a.px+=Math.sign(dx)*sp;
        else a.py+=Math.sign(dy)*sp;
      }
      a.animT+=dt;
    }
  }

  function routineDest(n){
    const h=clock*24;
    if(n.routine){ for(const seg of n.routine){ if(h>=seg.h[0] && h<seg.h[1]) return seg.go; } }
    return n.home || [Math.round(n.px/TILE),Math.round(n.py/TILE)];
  }
  function npcTileFree(n,tx,ty){
    if(isSolid(tx,ty)) return false;
    // NPCs may pass through each other (soft) to avoid deadlocks; only avoid standing on the player.
    if(Math.round(player.px/TILE)===tx && Math.round(player.py/TILE)===ty) return false;
    return true;
  }
  // BFS path from (sx,sy) to (dx,dy) over walkable tiles (ignores dynamic NPC blocking for the plan;
  // dynamic avoidance happens per-step). Returns array of [tx,ty] steps or null.
  function bfsPath(sx,sy,dx,dy){
    if(sx===dx&&sy===dy) return [];
    const key=(x,y)=>x+","+y;
    const prev={}; const seen=new Set([key(sx,sy)]); const q=[[sx,sy]];
    let head=0, found=false;
    while(head<q.length){
      const [x,y]=q[head++];
      for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+ox, ny=y+oy, k=key(nx,ny);
        if(seen.has(k)) continue;
        if(isSolid(nx,ny)) continue;
        seen.add(k); prev[k]=[x,y];
        if(nx===dx&&ny===dy){ found=true; q.length=0; break; }
        q.push([nx,ny]);
      }
      if(found) break;
    }
    if(!found) return null;
    const path=[]; let cur=[dx,dy];
    while(!(cur[0]===sx&&cur[1]===sy)){ path.push(cur); const p=prev[key(cur[0],cur[1])]; if(!p) return null; cur=p; }
    path.reverse(); return path;
  }
  function updateNpcs(dt){
    for(const n of currentNpcs()){
      if(n.fishing){ n.animT=(n.animT||0)+dt; continue; }
      // freeze an NPC while it's the one you're talking to (or being asked/choosing about it)
      if((dialog.active && dialog.npc===n) || (prompt2.active && dialog.npc===n)){
        n.moving=false; n.tgt=null; n.path=null;
        n.px=Math.round(n.px/TILE)*TILE; n.py=Math.round(n.py/TILE)*TILE;   // snap to tile, stand still
        if(typeof player!=="undefined"){ n.dir=opposite(player.dir); }       // face the player
        continue;
      }
      if(!n.routine && !n.home) continue;
      const sp=(n.speed||22)*dt;
      const cx=Math.round(n.px/TILE), cy=Math.round(n.py/TILE);
      const dest=routineDest(n);
      const atTile=(Math.abs(n.px-cx*TILE)<0.6 && Math.abs(n.py-cy*TILE)<0.6);

      // If we still have a pixel target we haven't reached, keep gliding toward it.
      if(n.tgt && !(Math.abs(n.px-n.tgt[0]*TILE)<0.6 && Math.abs(n.py-n.tgt[1]*TILE)<0.6)){
        const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
        if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
        if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
        n.moving=true; n.animT=(n.animT||0)+dt;
        continue;   // don't re-decide mid-tile -> no jitter
      }

      // Aligned on a tile: snap and decide the next step.
      n.px=cx*TILE; n.py=cy*TILE; n.tgt=null;
      n.replan=(n.replan||0)-dt;
      if(cx===dest[0] && cy===dest[1]){ n.moving=false; n.path=null; continue; }   // arrived: idle (frozen)
      if(!n.path || n.path.length===0 || n.destKey!==dest[0]+","+dest[1] || n.replan<=0){
        n.path=bfsPath(cx,cy,dest[0],dest[1]); n.destKey=dest[0]+","+dest[1]; n.replan=2.0;
      }
      if(n.path && n.path.length){
        const [nx,ny]=n.path[0];
        if(npcTileFree(n,nx,ny)){ n.tgt=[nx,ny]; n.path.shift(); n.moving=true;
          n.dir=(nx>cx)?"right":(nx<cx)?"left":(ny>cy?"down":"up");
          const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
          if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
          if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
          n.animT=(n.animT||0)+dt;
        } else { n.moving=false; n.replan=0.5; }   // blocked (usually the player): wait, no jitter
      } else { n.moving=false; }
    }
  }

  function updateCamera(){
    const worldW=cur.w*TILE, worldH=cur.h*TILE;
    cam.x=Math.round(player.px+TILE/2-W/2); cam.y=Math.round(player.py+TILE/2-H/2);
    if(worldW<=W) cam.x=Math.round((worldW-W)/2); else cam.x=Math.max(0,Math.min(worldW-W,cam.x));
    if(worldH<=H) cam.y=Math.round((worldH-H)/2); else cam.y=Math.max(0,Math.min(worldH-H,cam.y));
  }

  // ================= DRAW =================
  function draw(){
    if(screen==="title"){ drawTitle(); return; }
    // screen shake offset (decays in update); applied to the whole scene
    const _shk = cam.shake>0.2 ? cam.shake : 0;
    let _sx=0,_sy=0;
    if(_shk){ _sx=Math.round((Math.random()*2-1)*_shk); _sy=Math.round((Math.random()*2-1)*_shk); ctx.save(); ctx.translate(_sx,_sy); }
    if(insideKey) drawInterior(); else drawWorld();
    if(screen==="overworld" && !insideKey && !menu.open) drawWeather();
    if(!insideKey){ const nf=nightFactor(); if(nf>0){ ctx.fillStyle="rgba(20,26,60,"+(0.55*nf).toFixed(3)+")"; ctx.fillRect(0,0,W,H); drawNightLights(nf); } }
    if(screen==="overworld" && !insideKey && !menu.open) drawFog();
    // Crudo Merchant: eerie cursed haze over Cursed Valley (forestNE)
    // Crudo Merchant: (former Cursed Valley haze removed) - forestNE is now the King's Countryside, clear skies
    if(screen==="overworld" && !insideKey && !menu.open) drawQuestMarksOverlay();   // markers stay bright over night/fog
    if(screen==="overworld" && !insideKey && !menu.open && bounty.treasure && bounty.treasure.area===areaKey && bounty.active && bounty.active.type==="treasure" && !bounty.active.dug){
      const t2=bounty.treasure; const bx=t2.tx*TILE-cam.x, by=t2.ty*TILE-cam.y; const pulse=Math.floor(performance.now()/300)%2;
      ctx.strokeStyle=pulse?"#ff4a3a":"#e0c040"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(bx+3,by+3); ctx.lineTo(bx+13,by+13); ctx.moveTo(bx+13,by+3); ctx.lineTo(bx+3,by+13); ctx.stroke();
    }
    drawHUD();
    // Crudo Merchant: il testo degli ORDINI (tutorial) appare nel box in alto a destra (activeQuestText), non a schermo intero.
    if(screen==="overworld" && !insideKey && inTown() && !menu.open) drawTownHint();
    if(screen==="overworld" && !insideKey && areaKey==="industrial" && !menu.open) drawRaftHint();
    if(screen==="overworld" && !insideKey && areaKey==="opensea" && !menu.open) drawSeaHint();
    // Crudo Merchant: unified "A: land / set sail" hint in every coastal/sea area (piers, beaches, islands, rafts)
    if(screen==="overworld" && !insideKey && !menu.open && (areaKey==="island"||areaKey==="cape"||areaKey==="holiday"||areaKey==="town"||areaKey==="industrial"||areaKey==="forestNW"||areaKey==="mountain"||areaKey==="forestNE")) drawBoatLandHint();

    if(trade.open) drawTrade();   // Crudo Merchant: trade market overlay
    if(armory.open) drawArmory();       // Crudo Merchant: armoury menu overlay
    if(seasonPopup>0) drawSeasonPopup();
    if(bannerT>0) drawBanner(bannerMsg, pal().accent);
    else if(questPopT>0) drawBanner(questPop, "#f0d840");
    if(menu.open){ if(menu.showMap) drawMinimap(); else if(menu.showJournal) drawJournal(); else if(menu.showNotebook) drawNotebook(); else if(menu.showRules) drawRules(); else if(menu.showGuide) drawGuide(); else if(menu.showCrew) drawCrew(); else drawMenu(); }
    if(prompt2.active) drawPrompt();
    if(choice.active) drawChoice();
    if(confront.active) drawConfront();
    if(naval.active) drawNaval();

  function drawWorld(){
    const p=pal();
    ctx.fillStyle=p.grass; ctx.fillRect(0,0,W,H);
    const t0x=Math.floor(cam.x/TILE)-2, t0y=Math.floor(cam.y/TILE)-3;
    const t1x=Math.ceil((cam.x+W)/TILE)+2, t1y=Math.ceil((cam.y+H)/TILE)+2;
    // ground + shadow passes (always under everything)
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawGround(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawTileShadow(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y);

    // Collect movable entities with their tile-row for depth sorting.
    const ents=[];
    const push=(ty,fn)=> ents.push({ty,fn});
    if(inTown()){
      animals.forEach(a=> push(Math.round(a.py/TILE), ()=>drawAnimal(a, a.px-cam.x, a.py-cam.y)));
    }
    // ambient fauna (all areas): ground critters depth-sorted; flyers/jumpers drawn on top later
    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="wander") push(Math.round(a.py/TILE), ()=>drawFaunaCritter(a, a.px-cam.x, a.py-cam.y)); });
    if(typeof currentClues==="function"){ currentClues().forEach(({c})=> push(c.ty, ()=>drawClue(c.tx*TILE-cam.x, c.ty*TILE-cam.y))); }
    if(typeof drawScourSpots==="function") drawScourSpots();
    if(tail.active && tail.target){ push(Math.round(tail.target.py/TILE), ()=>drawTail()); }
    if(chase.active && chase.target){ push(Math.round(chase.target.py/TILE), ()=>drawChase()); }
    currentNpcs().forEach(n=> push(Math.round(n.py/TILE), ()=>drawNpc(n, n.px-cam.x, n.py-cam.y)));
    if(areaKey==="mountain" && season==="winter") skiers.forEach(s=> push(Math.round(s.y/TILE), ()=>drawSkier(s)));
    push(Math.round(player.py/TILE), ()=>drawPlayer(player.px-cam.x, player.py-cam.y, player.dir, player.animT));
    // Bucket entities by row for interlacing with object rows.
    const byRow={}; ents.forEach(e=>{ (byRow[e.ty]=byRow[e.ty]||[]).push(e.fn); });

    // Interlaced pass: for each row (top->bottom) draw that row's object tiles, then the entities standing on that row.
    for(let ty=t0y;ty<=t1y;ty++){
      for(let tx=t0x;tx<=t1x;tx++) drawObject(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
      if(byRow[ty]) byRow[ty].forEach(fn=>fn());

    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="fly"||a.mode==="jump") drawFaunaCritter(a, a.px-cam.x, a.py-cam.y); });

    if(areaKey==="cape"){ drawTradeHouse(21*TILE-cam.x, 10*TILE-cam.y, "E"); }        // Lighthouse Cape — NE waters, east of the hut
    if(areaKey==="industrial"){ drawTradeHouse(16*TILE-cam.x, 32*TILE-cam.y, "S"); }  // King's Borough — starts on the shore, into the harbour water

  // Crudo Merchant: reusable cobblestone texture (screenshot 1). Small rounded stones + dark mortar.
  function drawCobbles(x,y,tx,ty){

    const stone=winter?"#c6ccd2":"#a6aab2", stoneDk=winter?"#a4acb6":"#8a8e96";

      const jx=((tx*7+ty*3+r*5+cc)%2), jy=((tx*3+ty*7+r+cc*5)%2);
      const bx=x+1+cc*5+jx, by=y+1+r*5+jy;
      ctx.fillStyle=((r+cc+tx+ty)%2)?stoneDk:stone; ctx.fillRect(bx,by,4,4);
      ctx.fillStyle="#ffffff1a"; ctx.fillRect(bx,by,4,1); ctx.fillRect(bx,by,1,3);
      ctx.fillStyle="#00000022"; ctx.fillRect(bx,by+3,4,1);

  }

  // ---- tile sprites ----
  function drawTree(x,y,p){
    // trunk
    ctx.fillStyle=p.trunk; ctx.fillRect(x+6,y+11,4,5); ctx.fillStyle="#3a2a18"; ctx.fillRect(x+9,y+11,1,5);
    ctx.fillStyle=tint(p.trunk,20); ctx.fillRect(x+6,y+11,1,5);
    // BIG rounded canopy rising above the tile (top at y-6)
    const top=y-6;
    ctx.fillStyle=p.treeDk;
    ctx.fillRect(x+3,top+2,10,12); ctx.fillRect(x+1,top+5,14,7); ctx.fillRect(x+5,top,6,3); ctx.fillRect(x+2,top+3,12,2);
    ctx.fillStyle=p.tree;
    ctx.fillRect(x+3,top+3,9,9); ctx.fillRect(x+4,top+1,7,3); ctx.fillRect(x+2,top+6,11,4);
    // volume: bright upper-left + shaded lower-right
    ctx.fillStyle=tint(p.tree,30); ctx.fillRect(x+3,top+2,5,4); ctx.fillRect(x+4,top+1,3,2);
    ctx.fillStyle=tint(p.treeDk,-14); ctx.fillRect(x+9,top+8,5,5);
    // leaf clumps by season
    if(season==="autumn"){ ctx.fillStyle="#e0a030"; ctx.fillRect(x+5,top+3,2,2); ctx.fillStyle="#f0c040"; ctx.fillRect(x+9,top+6,2,2); }
    else if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x+3,top+1,6,2); ctx.fillRect(x+9,top+3,3,2); }
    else { ctx.fillStyle=tint(p.tree,44); ctx.fillRect(x+5,top+3,2,2); }
  }

  function drawHouseRoof(x,y,p){
    const tx=Math.round((x+cam.x)/TILE), ty=Math.round((y+cam.y)/TILE); const v=vary(tx,ty)*14;
    // Crudo Merchant: wooden/shingle roofs (1650-1730) in the pirate ports & King's Borough
    if(PIRATE_BUILD_AREAS.has(areaKey)){
      const top=y-8;
      // Crudo Merchant: saturated terracotta/red-brown roofs; King's Borough slate; Outcasts' shacks = poor weathered wood
      // Crudo Merchant: King's Borough slate, Outcasts' shacks poor wood, Porto Franco red;
      // Borgo dei Pirati (holiday) = lively, COLOURFUL warm roofs (varied per building) from Porto Franco's palette
      let baseRoof;
      if(areaKey==="industrial") baseRoof="#7a5a4a";
      else if(areaKey==="forestNW") baseRoof="#8a7458";
      else if(areaKey==="holiday"){ const warm=["#a5462c","#c0692c","#b8863a","#9a5a34","#c8503a"]; baseRoof=warm[((tx*3+ty*5)>>>0)%warm.length]; }

      ctx.fillStyle=tint(woodR,26); ctx.fillRect(x-1,top,TILE+2,8);
      ctx.fillStyle=tint(woodR,48); ctx.fillRect(x-1,top,TILE+2,1);          // bright ridge
      ctx.fillStyle=woodR; ctx.fillRect(x-1,top+8,TILE+2,6);
      ctx.fillStyle=tint(woodR,-28); ctx.fillRect(x-1,top+14,TILE+2,4);
      ctx.fillStyle="rgba(0,0,0,0.16)"; for(let j=top+3;j<top+16;j+=3) ctx.fillRect(x-1,j,TILE+2,1);
      ctx.fillStyle="rgba(255,255,255,0.08)"; for(let i=3;i<TILE;i+=6) ctx.fillRect(x+i,top+1,1,15);
      ctx.fillStyle=tint(woodR,-36); ctx.fillRect(x-2,y+13,TILE+4,3);        // eave
      ctx.fillStyle="rgba(0,0,0,0.34)"; ctx.fillRect(x-1,y+16,TILE+2,1);     // strong ground shadow
      ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(x-1,top,1,16); ctx.fillRect(x+TILE,top,1,16);   // side outline
      if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x-1,top,TILE+2,3); }

    }

  function shadow(x,y,w,h){ ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x,y,w,h); ctx.fillStyle="rgba(0,0,0,0.12)"; ctx.fillRect(x-1,y,w+2,h); }
  // deterministic per-tile variation (-1,0,1) so identical buildings differ a little
  function vary(tx,ty){ const h=(tx*73856093 ^ ty*19349663)>>>0; return (h%3)-1; }
  function tint(hex,amt){ // amt in [-40..40] lightens/darkens
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  // Long directional shadow (light from NW -> shadow to SE) cast by "tall" tiles.
  const TALL_TILES=new Set(["T","b","H","W","R","C","D","A","B","V","S","G","J","L","P","Q","K","$"]);
  function isTall(c){ return TALL_TILES.has(c) || /[1-9]/.test(c); }
  function drawTileShadow(c,x,y){
    if(insideKey) return;
    if(!isTall(c)) return;
    // shadow projects down-right; length depends on "height" of the element
    const tall = (c==="T"||c==="R"||c==="C"||c==="A"||c==="J"||c==="K"||c==="S"); // roofs/tree crowns = taller
    const dx = tall?7:4, dy = tall?6:3;
    ctx.fillStyle="rgba(20,24,40,0.22)";
    // a slanted quad approximated by two offset rects
    ctx.fillRect(x+3+dx, y+6+dy, TILE-4, TILE-6);
    ctx.fillStyle="rgba(20,24,40,0.14)";
    ctx.fillRect(x+1+dx, y+8+dy, TILE-2, TILE-8);
  }

  // Shared human sprite: head + hair + torso + arms + legs, with an expressive walk cycle.
  function drawHuman(x,y,dir,walking,frame,o){
    x=Math.round(x); y=Math.round(y);
    const kind0=o.kind||"ym";
    // ---- CHILDREN (smaller sprite) ----
    if(kind0==="boy" || kind0==="girl"){
      const girlc=(kind0==="girl");
      const skinc=o.skin||"#f0c890";
      const hairc = girlc ? (o.hair||"#6a4a2a") : "#1a1a1a";   // boy: black; girl: castano
      const shirtc=o.shirt||"#e0483a", shirtDk=o.shirtDk||"#c0382c", bottom=o.pants||"#2a3a6a";
      const s=walking?(frame?1:-1):0;

        ctx.fillStyle=skinc; ctx.fillRect(x+5,y+14,2,1); ctx.fillRect(x+9,y+14,2,1); }

        ctx.fillStyle=skinc; ctx.fillRect(x+5,y+13,2,1); ctx.fillRect(x+9,y+13,2,1);  // bare legs (shorts)
        ctx.fillStyle="#2a2028"; ctx.fillRect(x+5,y+14,2,1); ctx.fillRect(x+9,y+14,2,1); }

      // arms
      ctx.fillStyle=skinc; const a=walking?(frame?1:-1):0;

      else { ctx.fillRect(x+4,y+7+a,1,4); ctx.fillRect(x+11,y+7-a,1,4); }

    const kind=kind0;                                 // ym/yw/om/ow

    const s = walking ? (frame?1:-1) : 0;

      ctx.fillStyle=shirt; ctx.fillRect(x+6,y+10,4,3);          // waist narrower

      ctx.fillStyle=tint(shirt,-14); ctx.fillRect(x+5,y+9,2,1); ctx.fillRect(x+9,y+9,2,1); // bust shading

      ctx.fillRect(x+3,y+8,2,2); ctx.fillRect(x+11,y+8,2,2);  // waves widening at the ends
      ctx.fillRect(x+4,y+3,1,1); ctx.fillRect(x+11,y+3,1,1);  // side bangs framing the face

      else { const a=walking?(frame?2:-2):0; ctx.fillRect(x+3,y+8+a,2,5); ctx.fillRect(x+11,y+8-a,2,5); ctx.fillStyle=white; ctx.fillRect(x+3,y+10+a,2,1); ctx.fillRect(x+11,y+10-a,2,1); }

      else { const a=walking?(frame?2:-2):0; ctx.fillRect(x+3,y+13+a,2,1); ctx.fillRect(x+11,y+13-a,2,1); }
      // red wool beanie on the head (covers the hair line)

  function drawPlayer(x,y,dir,animT){
    if(player.swimming){ drawSwimmingPlayer(x,y,dir,animT); return; }
    // Crudo (Corto Maltese): giacca blu marina + camicia bianca + cappello bianco da marinaio, tutte le stagioni.
    const pOutfit = "crudo";
    const pOpt={skin:"#f0c890",hair:"#2a2018",shirt:"#2b4c9b",shirtDk:"#1e3670",pants:"#3a2e22",outfit:pOutfit};
    if(fishing.active){ drawHuman(x, y, "left", false, 0, pOpt); drawRod(x,y,fishing.t*2,"left"); return; }
    if(player.boat){
      drawBoatV(x, y, dir, player.moving);   // Crudo Merchant: show only the vessel, no rider on top
      return;
    }
    const walking=player.moving, frame=Math.floor(animT*8)%2;
    const bob=(walking&&frame===0)?1:0;
    drawHuman(x, y-bob, dir, walking, frame, pOpt);
  }

  // Crudo Merchant: the player vessel (no running lights — ships are dark at night).
  function drawBoatV(x,y,dir,moving){
    x=Math.round(x); y=Math.round(y);
    // Crudo Merchant: the overworld vessel reflects your OWNED boat type — 5 clearly distinct silhouettes.
    const type=player.boatType||"rowboat";
    // per-type profile: hull half-length, mast count, sail height, hull tint, flag colour
    const P={
      rowboat:{len:8,  masts:0, sailH:0, wood:"#8a6a44", accent:null,      flag:null,     windows:false },
      sloop:  {len:10, masts:1, sailH:11,wood:"#8a5c34", accent:"#a5713a", flag:null,     windows:false }, // sloop ambientale: 1 albero, vela alta
      caravel:{len:12, masts:2, sailH:11,wood:"#7a5230", accent:"#b8863a", flag:"#c0322c", windows:false }, // come BRIG: 2 alberi, 2 vele grandi
      frigate:{len:16, masts:2, sailH:11,wood:"#6a4a28", accent:"#c89a40", flag:"#3a4a8a", windows:true  }, // BRIG allungata + finestre laterali
      galleon:{len:17, masts:3, sailH:13,wood:"#5a4020", accent:"#e8c24a", flag:"#141418", windows:true  }  // 3 alberi, 3 vele
    }[type]||{len:10,masts:1,sailH:11,wood:"#8a5c34",accent:"#a5713a",flag:null,windows:false};
    const dark="#0a0a12", woodDk=tint(P.wood,-22), woodLt=tint(P.wood,20), sail="#efe6c8", sailDk="#cdbf98", sailLt="#fbf7ea";
    const L=P.len;
    // wake
    ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.fillRect(x+8-L, y+16, L*2-4, 2);

    // ---- ROWBOAT: profilo originale (remi + teste), che ruota con la direzione ----
    if(type==="rowboat"){
      if(dir==="left"||dir==="right"){
        const hx=x+8-L, hw=L*2-1;
        ctx.fillStyle=dark; ctx.fillRect(hx-1,y+7,hw+2,9);
        ctx.fillStyle=P.wood; ctx.fillRect(hx,y+8,hw,7);
        ctx.fillStyle=woodLt; ctx.fillRect(hx,y+8,hw,1);
        ctx.fillStyle=woodDk; ctx.fillRect(hx,y+13,hw,2);
        const stroke=Math.floor(performance.now()/260)%2; const so=stroke?1:-1;
        [hx+4, hx+hw-5].forEach((ox,oi)=>{ const dx=ox+(oi?so:-so);
          ctx.fillStyle=woodDk; ctx.fillRect(dx,y+3,1,4); ctx.fillStyle=P.wood; ctx.fillRect(dx-1+(stroke?1:0),y+2,3,2);
          ctx.fillStyle=woodDk; ctx.fillRect(dx,y+16,1,4); ctx.fillStyle=P.wood; ctx.fillRect(dx-1+(stroke?1:0),y+19,3,2); });
      } else {
        const hy=y+7, hh=9;
        ctx.fillStyle=dark; ctx.fillRect(x+0,hy-1,16,hh+2);
        ctx.fillStyle=P.wood; ctx.fillRect(x+1,hy,14,hh);
        ctx.fillStyle=woodLt; ctx.fillRect(x+1,hy,14,1); ctx.fillStyle=woodDk; ctx.fillRect(x+1,hy+hh-2,14,2);
        const stroke=Math.floor(performance.now()/260)%2; const off=stroke?1:0;
        ctx.fillStyle=woodDk; ctx.fillRect(x-4,hy+2+off,4,1); ctx.fillRect(x+15,hy+2+off,4,1); ctx.fillRect(x-4,hy+hh-2-off,4,1); ctx.fillRect(x+15,hy+hh-2-off,4,1);
        ctx.fillStyle=P.wood; ctx.fillRect(x-5,hy+1+off,2,3); ctx.fillRect(x+18,hy+1+off,2,3); ctx.fillRect(x-5,hy+hh-3-off,2,3); ctx.fillRect(x+18,hy+hh-3-off,2,3);
      }
    }
    // ---- NAVI A VELA (sloop/caravel/frigate/galleon): stile "navi ambientali" con vele quadrate grandi ----
    else {
      const N=P.masts;
      // helper: una vela quadrata grande (bianca écru, bordo illuminato + ombra bassa)
      function squareSail(sx,sy,sw,sh){
        ctx.fillStyle=dark; ctx.fillRect(sx-1,sy-1,sw+2,sh+2);      // outline
        ctx.fillStyle=sail; ctx.fillRect(sx,sy,sw,sh);
        ctx.fillStyle=sailLt; ctx.fillRect(sx,sy,sw,1);            // bordo illuminato
        ctx.fillStyle=sailDk; ctx.fillRect(sx,sy+sh-1,sw,1);       // ombra bassa
        ctx.fillStyle="#0a0a1230"; ctx.fillRect(sx+Math.floor(sw/2),sy,1,sh);   // cucitura centrale
      }
      if(dir==="left"||dir==="right"){
        // VISTA DI LATO: scafo orizzontale + alberi verticali con vele quadrate
        const br=(dir==="right"); const hx=x+8-L, hw=L*2-1;
        // vele + alberi (sopra lo scafo), da poppa a prua
        const mxs = N===1?[x+7] : (N===2?[hx+5,hx+hw-6] : [hx+4,x+7,hx+hw-6]);
        mxs.forEach(mx=>{ const sh=P.sailH, sw=7; const top=y+7-sh;
          ctx.fillStyle=woodDk; ctx.fillRect(mx,top-1,1,sh+3);      // albero
          squareSail(mx-Math.floor(sw/2), top, sw, sh);
        });
        // scafo
        ctx.fillStyle=dark; ctx.fillRect(hx-1,y+7,hw+2,8);
        ctx.fillStyle=P.wood; ctx.fillRect(hx,y+8,hw,6);
        ctx.fillStyle=woodLt; ctx.fillRect(hx,y+8,hw,1);
        ctx.fillStyle=woodDk; ctx.fillRect(hx,y+13,hw,1);
        if(P.accent){ ctx.fillStyle=P.accent; ctx.fillRect(hx,y+11,hw,1); }
        // prua a punta
        ctx.fillStyle=P.wood; ctx.fillRect(br?hx+hw:hx-3,y+9,3,3);
        // finestre laterali (fregata/galeone)
        if(P.windows){ for(let i=0;i<Math.min(6,L-5);i++){ ctx.fillStyle="#d8e4f0"; ctx.fillRect(hx+3+i*3, y+10, 2,2); ctx.fillStyle=woodDk; ctx.fillRect(hx+3+i*3, y+10, 1,1); } }
      } else {
        // VISTA DAVANTI/DIETRO: scafo compatto in basso + alberi verticali con vele quadrate impilate
        const cols = N===1?[x+8] : (N===2?[x+5,x+11] : [x+3,x+8,x+13]);
        // vele: per ogni albero, 1-2 vele quadrate impilate secondo la stazza
        const stacked = N>=3 ? 2 : 1;
        cols.forEach(cx=>{
          ctx.fillStyle=woodDk; ctx.fillRect(cx,y+1,1,13);          // albero
          for(let s=0;s<stacked;s++){ const sw=(N===1?7:6); const shh=(N===1?7:5);
            squareSail(cx-Math.floor(sw/2), y+1+s*(shh+1), sw, shh); }
        });
        // scafo compatto (trapezio: prua stretta in alto o in basso)
        const bowUp=(dir==="up"); const hy=y+13, hw=16, hh=4;
        ctx.fillStyle=dark; ctx.fillRect(x, hy-1, hw, hh+2);
        ctx.fillStyle=P.wood; ctx.fillRect(x+1, hy, hw-2, hh);
        ctx.fillStyle=woodLt; ctx.fillRect(x+1, hy, hw-2, 1);
        ctx.fillStyle=woodDk; ctx.fillRect(x+1, hy+hh-1, hw-2, 1);
        // prua/poppa
        ctx.fillStyle=P.wood; ctx.fillRect(x+5, bowUp?hy-2:hy+hh, 6, 2);
        if(P.accent){ ctx.fillStyle=P.accent; ctx.fillRect(x+2, hy+1, hw-4, 1); }
        // finestre (fregata/galeone) sulla poppa
        if(P.windows){ ctx.fillStyle="#d8e4f0"; ctx.fillRect(x+4, hy+1, 2,1); ctx.fillRect(x+7, hy+1, 2,1); ctx.fillRect(x+10, hy+1, 2,1); }
        // bandiera in cima all'albero centrale
        if(P.flag){ ctx.fillStyle=P.flag; ctx.fillRect(cols[Math.floor(cols.length/2)]+1, y, 3, 2); }
      }
    }
    // (rowboat: teste dell'equipaggio disegnate sotto)
    if(type==="rowboat"){
      const heads=Math.min(3, 1 + (crew||0));   // Crudo + crew, cap 3
      const skin="#f0c890";
      // seat positions across the hull, centred, close together
      const cx = x+8;                            // hull centre x
      const seatY = y+5;                         // heads sit just above the gunwale
      const spread = (heads===1)?[0]:(heads===2?[-4,4]:[-6,0,6]);
      for(let i=0;i<heads;i++){
        const hx = Math.round(cx + spread[i]) - 2, hy = seatY;
        // head (skin)
        ctx.fillStyle="#0a0a12"; ctx.fillRect(hx-1,hy-1,6,6);
        ctx.fillStyle=skin; ctx.fillRect(hx,hy,4,4);
        ctx.fillStyle="#e0b890"; ctx.fillRect(hx,hy,4,1);
        if(i===0){
          // Crudo — white sailor's cap with black band
          ctx.fillStyle="#eef2f6"; ctx.fillRect(hx,hy-1,4,2); ctx.fillStyle="#14161c"; ctx.fillRect(hx,hy+1,4,1);
          // eyes (facing down/side)
          ctx.fillStyle="#0a0a12"; ctx.fillRect(hx+1,hy+2,1,1); ctx.fillRect(hx+2,hy+2,1,1);
        } else {
          // crew — a coloured bandana + hair
          const band=["#b83028","#2c4a7a","#3a7a3a"][(i-1)%3];
          ctx.fillStyle="#2a2018"; ctx.fillRect(hx,hy,4,1);          // hair line
          ctx.fillStyle=band; ctx.fillRect(hx,hy-1,4,1);            // bandana
          ctx.fillStyle="#0a0a12"; ctx.fillRect(hx+1,hy+2,1,1); ctx.fillRect(hx+2,hy+2,1,1);
        }
      }
    }
    if(moving && Math.floor(performance.now()/150)%2===0){ ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillRect(x+ (dir==="right"?0:(dir==="left"?14:7)), y+15, 2,2); }
  }
  function drawSwimmingPlayer(x,y,dir,animT){
    x=Math.round(x); y=Math.round(y);
    const p=pal();
    const stroke=Math.floor(animT*6)%2;
    // water ripple ring
    ctx.fillStyle=p.waterDk; ctx.fillRect(x+2,y+12,12,2);
    ctx.fillStyle="#ffffff40"; ctx.fillRect(x+3,y+11,3,1); ctx.fillRect(x+9,y+13,3,1);
    // head
    outlineRect(x+5,y+5,6,6);
    ctx.fillStyle="#f0c890"; ctx.fillRect(x+5,y+5,6,6);
    ctx.fillStyle="#eef2f6"; ctx.fillRect(x+5,y+4,6,2); ctx.fillStyle="#14161c"; ctx.fillRect(x+5,y+6,6,1);   // white sailor's cap + black band
    ctx.fillStyle="#0a0a12"; ctx.fillRect(x+6,y+8,1,1); ctx.fillRect(x+9,y+8,1,1);
    // arms stroking around the face (alternate)
    ctx.fillStyle="#f0c890";
    if(stroke===0){ ctx.fillRect(x+2,y+6,2,2); ctx.fillRect(x+12,y+9,2,2); }
    else { ctx.fillRect(x+2,y+9,2,2); ctx.fillRect(x+12,y+6,2,2); }
    // splash droplets
    ctx.fillStyle="#dff0ff"; if(stroke===0){ ctx.fillRect(x+1,y+5,1,1); } else { ctx.fillRect(x+14,y+5,1,1); }
  }

  function drawNpc(n,x,y){ x=Math.round(x); y=Math.round(y);
    const walking=!!(n.moving), frame=walking?(Math.floor((n.animT||0)*7)%2):0;
    const opt={skin:"#f0c890",hair:n.hairCol||n.colorDk,shirt:n.color,shirtDk:n.colorDk,pants:n.pants||n.colorDk,kind:n.kind||"ym",outfit:outfitFor(n)};
    drawHuman(x, y, n.dir||"down", walking, frame, opt);
    if(n.fishing) drawRod(x,y,n.animT||0, n.dir||"down");
    // quest "!" marker is drawn in drawQuestMarksOverlay() (on top of night/fog, always bright)
  }
  // Decide an NPC's outfit from its base role + current area + season.
  function outfitFor(n){
    const base=n.outfitBase||"";   // "", "worker","tirolese","hiker","lumberjack","vacation","skier"
    // fixed-role outfits (always worn)
    if(base==="worker") return "worker";
    if(base==="sailor") return "sailor";
    if(base==="hiker") return "hiker";
    if(base==="lumberjack") return "lumberjack";
    if(base==="skier") return "skier";
    if(base==="tirolese"){ return season==="winter" ? "coat" : "tirolese"; }
    if(base==="vacation"){
      if(season==="summer"||season==="spring") return "swim";
      if(season==="winter") return "coat";
      return ""; // autumn = normal clothes
    }
    // Crudo Merchant: area-themed default dress for generic townsfolk (no fixed role base)
    if(areaKey==="industrial") return "guard";                       // King's Borough: royal soldiers in uniform
    if(areaKey==="forestNW") return "rags";                          // Outcasts' Valley: dressed in rags
    if(areaKey==="forestNE") return "farmer";                        // King's Countryside: farmers in overalls + straw hat
    if(areaKey==="town"||areaKey==="holiday"||areaKey==="cape"||areaKey==="mountain"||areaKey==="island") return "pirate";  // pirate ports & isles
    // townsfolk (no base): coat in winter, else normal
    return season==="winter" ? "coat" : "";
  }
  // bobbing "!" marker over a quest NPC
  function drawQuestMark(x,y,kind){
    const bob=Math.floor(performance.now()/300)%2;
    const mx=x+6, my=y-9-bob;
    const isCase=(kind==="case");
    const body="#ffd020";        // Crudo Merchant: tutti i marker sono GIALLI (niente distinzione rossa)
    const hi="#fff2a0";
    ctx.fillStyle="#0a0a12"; ctx.fillRect(mx-1,my-1,5,9);          // outline
    ctx.fillStyle=body; ctx.fillRect(mx,my,3,5); ctx.fillRect(mx,my+6,3,2);  // ! body + dot
    ctx.fillStyle=hi; ctx.fillRect(mx,my,1,4);             // highlight
  }
  // Redraw all quest "!" markers ON TOP of the night overlay + fog, so they stay bright/legible
  // at any time of day (they are UI guidance, not part of the lit scene).
  function drawQuestMarksOverlay(){
    if(insideKey) return;
    const list = currentNpcs();
    // Crudo Merchant: bersaglio del TUTORIAL — un "!" giallo sull'NPC del passo corrente.
    const tutTgt = (typeof tutTargetNpc==="function") ? tutTargetNpc() : null;
    for(const n of list){
      if(!n) continue;
      const qk = npcQuestKind(n);
      const isTut = (tutTgt && n.id===tutTgt);
      if(!qk && !isTut) continue;
      const x = Math.round(n.px - cam.x), y = Math.round(n.py - cam.y);
      // skip if clearly off-screen
      if(x < -TILE || x > W+TILE || y < -TILE || y > H+TILE) continue;
      drawQuestMark(x, y, qk||"casual");
    }
    // Crudo Merchant: FRECCIA-GUIDA sopra la testa di Crudo, che punta verso il bersaglio della missione.
    const tp = (typeof questTargetPoint==="function") ? questTargetPoint() : null;
    if(tp){
      const tgx=tp.px, tgy=tp.py;                              // posizione mondo del bersaglio
      const pgx=player.px, pgy=player.py;                      // posizione mondo del player
      const dist=Math.hypot(tgx-pgx, tgy-pgy);
      if(dist>8){                                              // mostra solo se non sei gia' sul posto
        let dx=tgx-pgx, dy=tgy-pgy; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
        // centro freccia: appena sopra la testa del player sullo schermo
        const sx=Math.round(player.px-cam.x)+8, sy=Math.round(player.py-cam.y)-6;
        const bob=Math.floor(performance.now()/220)%2;
        const cx2=sx, cy2=sy-bob;
        // disco scuro di sfondo + freccia gialla con bordo (ben visibile a ogni ora)
        ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.beginPath(); ctx.arc(cx2,cy2,7,0,Math.PI*2); ctx.fill();
        const px=-dy, py=dx; const tipx=cx2+dx*7, tipy=cy2+dy*7;
        ctx.fillStyle="#141018"; ctx.beginPath(); ctx.moveTo(tipx+dx, tipy+dy); ctx.lineTo(cx2+px*5-dx*3, cy2+py*5-dy*3); ctx.lineTo(cx2-px*5-dx*3, cy2-py*5-dy*3); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#ffd020"; ctx.beginPath(); ctx.moveTo(tipx, tipy); ctx.lineTo(cx2+px*4-dx*3, cy2+py*4-dy*3); ctx.lineTo(cx2-px*4-dx*3, cy2-py*4-dy*3); ctx.closePath(); ctx.fill();
      }
    }
  }
  // fishing rod + line into the water, pointing in the given direction ('left'=west, else 'down'=south)
  function drawRod(x,y,animT,dir){
    const bob=Math.floor((animT||0)*3)%2;
    ctx.fillStyle="#8a5a2a"; // rod
    if(dir==="left"){
      for(let i=0;i<10;i++) ctx.fillRect(x+3-i, y+6-Math.floor(i*0.8), 1,1);   // rod up-left
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x-7, y+0, 1, 12+bob);              // line down at tip
      ctx.fillStyle="#e04040"; ctx.fillRect(x-8, y+12+bob, 2,2);               // float
    } else { // down/south
      for(let i=0;i<10;i++) ctx.fillRect(x+12+i, y+6-Math.floor(i*0.8), 1,1);
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x+21, y+0, 1, 14+bob);

  // ---- generic ambient fauna sprites ----
  // Crudo Merchant: BIG, detailed battle sprites for the common foes (used in the Pokémon-style duel arena
  // and as sea-monster naval opponents). Anchored at (cx,cy)=centre; unit U px per pixel-cell (~48px tall).
  // Returns true if it drew a dedicated sprite, false to fall back to the small critter.
  function drawBattleBeast(kind, cx, cy){
    const U=3; cx=Math.round(cx); cy=Math.round(cy);
    // px helper with a baked dark outline: draw a 1-cell black border, then fill
    const rects=[]; const P=(gx,gy,gw,gh,c)=>rects.push([gx,gy,gw,gh,c]);
    // build the shape in a small grid centred on (0,0), then blit with outline
    function blit(){
      // outline pass
      ctx.fillStyle="#0a0a12";
      rects.forEach(r=>{ ctx.fillRect(cx+(r[0])*U-1, cy+(r[1])*U-1, r[2]*U+2, r[3]*U+2); });
      // colour pass
      rects.forEach(r=>{ ctx.fillStyle=r[4]; ctx.fillRect(cx+r[0]*U, cy+r[1]*U, r[2]*U, r[3]*U); });
    }
    if(kind==="wolf"){ const c="#8a8f98",d="#5f646d",lt="#b6bcc4";
      P(-6,-1,10,4,c); P(-6,-1,10,1,lt); P(-6,2,10,1,d);                 // body
      P(-9,-3,4,4,c); P(-9,-4,1,2,d); P(-6,-4,1,2,d);                     // head + ears
      P(-10,-1,2,1,"#2a2830");                                            // snout
      P(4,0,3,2,d); P(6,-1,1,2,c);                                        // tail
      P(-6,3,2,3,d); P(-2,3,2,3,d); P(2,3,2,3,d);                         // legs
      P(-8,-2,1,1,"#e0c020"); blit(); return true; }                      // eye
    if(kind==="bear"){ const c="#5a4030",d="#3c2a1e",lt="#74553f";
      P(-7,-2,13,7,c); P(-7,-2,13,1,lt); P(-7,4,13,1,d);
      P(-10,-4,5,5,c); P(-10,-5,2,2,d); P(-6,-5,2,2,d);                   // head + ears
      P(-11,-1,2,2,"#2a2028");                                            // snout
      P(-7,5,3,3,d); P(-1,5,3,3,d); P(3,5,3,3,d);                         // legs
      P(-9,-2,1,1,"#e04030"); blit(); return true; }                     // angry eye
    if(kind==="fox"){ const c="#d06a2a",d="#a8501c",w="#f0e0d0";
      P(-6,0,10,3,c); P(-6,0,10,1,"#e0854a");
      P(-9,-2,4,4,c); P(-9,-3,1,2,d); P(-6,-3,1,2,d);                     // head + pointed ears
      P(-10,0,1,1,"#2a1a10"); P(4,-1,4,3,c); P(7,-1,1,3,w);              // snout, bushy tail w/ white tip
      P(-6,3,2,3,d); P(-1,3,2,3,d); P(2,3,2,3,d);
      P(-8,-1,1,1,"#1a1a1a"); blit(); return true; }
    if(kind==="rat"){ const c="#6a6460",d="#48443f",pk="#c88";
      P(-5,0,9,3,c); P(-5,0,9,1,"#7c766f"); P(-8,-1,4,3,c);              // body + head
      P(-9,0,1,1,"#1a1a1a"); P(-6,-2,1,1,pk); P(-4,-2,1,1,pk);          // eye + ears
      P(4,1,5,1,"#4a4642"); P(-5,3,2,2,d); P(1,3,2,2,d); blit(); return true; }  // tail + feet
    if(kind==="wisp"){ const t=performance.now(); const puls=0.6+0.4*Math.sin(t/240);
      // glowing mystic orb + wispy tail (mystic creature)
      ctx.save();
      const g=ctx.createRadialGradient(cx,cy,2,cx,cy,20); g.addColorStop(0,"rgba(220,180,255,"+puls.toFixed(2)+")"); g.addColorStop(1,"rgba(120,60,200,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,20,20,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#c080f0"; ctx.beginPath(); ctx.ellipse(cx,cy-2,9,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#e6c8ff"; ctx.beginPath(); ctx.ellipse(cx-2,cy-4,4,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#2a1038"; ctx.fillRect(cx-4,cy-2,2,3); ctx.fillRect(cx+2,cy-2,2,3);   // hollow eyes
      ctx.fillStyle="#8040c0"; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(cx+(i-1)*6, cy+12+Math.sin(t/200+i)*2, 3,4,0,0,Math.PI*2); ctx.fill(); }  // trailing wisps
      ctx.restore(); return true; }
    if(kind==="lizard"){ const c="#4c8a3a",d="#356428",lt="#6ab04a";   // basilisk/lizard
      P(-8,0,12,3,c); P(-8,0,12,1,lt); P(-8,2,12,1,d);
      P(-11,-1,4,3,c); P(-12,0,1,1,"#1a1a1a");                          // head
      P(4,1,6,1,d); P(9,1,2,1,c);                                       // long tail
      P(-3,-2,1,2,lt); P(0,-2,1,2,lt); P(3,-2,1,2,lt);                  // dorsal ridge
      P(-7,3,2,2,d); P(-2,3,2,2,d); P(3,3,2,2,d); P(-10,-1,1,1,"#e0c020"); blit(); return true; }
    if(kind==="octopus"){ // KRAKEN — bulbous mantle, textured skin, writhing suckered tentacles
      const c="#7a2f5e",d="#4e1d3c",lt="#b06090",hi="#d68ab0",sk="#93406f";

      P(-4,-3,1,1,"#ffffff"); P(1,-3,1,1,"#ffffff");                     // catchlights
      // 6 tentacles that curl with the swell, each tapering
      for(let i=0;i<6;i++){ const ph=Math.sin(t/220+i*0.8); const off=Math.round(ph*2);
        const bx=-6+i*2; P(bx,2,2,3,c); P(bx+off*0+ (i<3?-1:1),5,2,3,d); P(bx+off,7,1,3,d);

    if(kind==="orca"){ // ORCA — sleek countershaded body, saddle patch, tall dorsal, fluke

      P(-6,-2,3,2,w);                                                    // white eye/jaw patch
      P(-5,-2,1,1,"#0a0a12"); P(-2,-3,4,1,sd);                           // eye + grey saddle
      P(-1,-6,3,4,c); P(0,-7,1,2,c2);                                    // tall curved dorsal fin
      P(6,-2,4,2,c); P(8,-4,2,2,c); P(8,2,2,2,c); P(9,-3,1,6,c2);        // wide tail fluke
      P(-3,3,3,2,c);                                                     // pectoral fin

      const c="#33465a",lt="#54697e",w="#c6d8e6",d="#243444",bn="#7d8a74";

      P(-6,-3,14,1,lt);                                                  // dorsal sheen

      P(-8,-1,1,4,d); P(-3,-1,1,5,d); P(2,-1,1,4,d);

      // massive tail fluke
      P(8,-4,3,7,c); P(10,-6,2,3,c); P(10,3,2,3,c); P(11,-5,1,10,d);
