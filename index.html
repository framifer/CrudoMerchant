  // ================= DAY / NIGHT =================
  // clock in [0,1): 0=midnight, 0.25=6am, 0.5=noon, 0.75=6pm. One full day = DAY_LEN seconds.
  let clock=0.35;                 // start mid-morning
  const DAY_LEN=180;              // seconds for a full day/night cycle
  let dayCount=0;                 // whole days elapsed (advances when the clock passes midnight)
  let seasonAutoTimer=0;          // after the story ends, seasons rotate every SEASON_AUTO_SECS of play
  const SEASON_AUTO_SECS=600;     // 10 minutes of effective play
  function advanceClock(dt){ const nc=clock+dt/DAY_LEN; if(nc>=1){ dayCount+=Math.floor(nc); } clock=nc%1; }
  // 0 = full day, 1 = deep night (used for tinting + lit windows)
  function nightFactor(){
    // dark between ~19:30 (0.81) and ~5:30 (0.23), smooth transitions
    const h=clock;
    if(h>0.27 && h<0.75) return 0;                 // daytime
    if(h>=0.75 && h<0.83) return (h-0.75)/0.08;    // dusk
    if(h>=0.83 || h<0.19) return 1;                // night
    return 1-((h-0.19)/0.08);                      // dawn
  }
  function clockLabel(){ const mins=Math.floor(clock*24*60); const hh=String(Math.floor(mins/60)).padStart(2,"0"); const mm=String(mins%60).padStart(2,"0"); return hh+":"+mm; }

  // ===== PHOTO STAKEOUT: shoot 3 good photos in a row. A vertical "tension bar" (right side) has a

  // a row = success; a miss resets the streak to 0; 3 misses in a row = "spotted", retry another night. =====
  const photoCam={ active:false, pos:0.5, vel:0.6, zoneC:0.5, zoneH:0.16, zVel:0.4, streak:0, misses:0, flash:0, msg:"", msgT:0, onWin:null, onFail:null };
  function startPhotoCam(onWin,onFail){

    photoCam.streak=0; photoCam.misses=0; photoCam.flash=0; photoCam.msg=t("photo_intro"); photoCam.msgT=2.4;

  function updatePhotoCam(dt){
    if(photoCam.msgT>0) photoCam.msgT-=dt;
    if(photoCam.flash>0) photoCam.flash-=dt;

    photoCam.pos+=photoCam.vel*dt;
    if(photoCam.pos>=1){ photoCam.pos=1; photoCam.vel=-(0.6+Math.random()*0.5); }
    else if(photoCam.pos<=0){ photoCam.pos=0; photoCam.vel=(0.6+Math.random()*0.5); }
    // green zone drifts irregularly (random walk), staying within bounds
    photoCam.zoneC+=photoCam.zVel*dt;
    if(photoCam.zoneC> (1-photoCam.zoneH/2)){ photoCam.zoneC=1-photoCam.zoneH/2; photoCam.zVel=-(0.25+Math.random()*0.35); }
    else if(photoCam.zoneC< (photoCam.zoneH/2)){ photoCam.zoneC=photoCam.zoneH/2; photoCam.zVel=(0.25+Math.random()*0.35); }
    if(Math.random()<0.03) photoCam.zVel=(Math.random()*2-1)*(0.25+Math.random()*0.4);   // occasional random direction change
    if(consumePress("a")){
      const lo=photoCam.zoneC-photoCam.zoneH/2, hi=photoCam.zoneC+photoCam.zoneH/2;

  // ================= WEATHER (particles ~50% duty per season) =================
  // spring=wind (drifting petals/breeze), autumn=rain, winter=snow. summer=clear.
  const weather = { on:false, timer:0, phase:6, particles:[] };
  function weatherKind(){ if(season==="winter") return "snow"; if(season==="autumn") return "rain"; if(season==="spring") return "wind"; return "none"; }
  function resetWeather(){ weather.particles.length=0; weather.on=false; weather.timer=0; weather.phase=3+Math.random()*4; }
  function spawnParticles(kind){
    weather.particles.length=0;
    const n = kind==="rain"?70 : kind==="snow"?55 : kind==="wind"?26 : 0;
    for(let i=0;i<n;i++){
      weather.particles.push({ x:Math.random()*(W+40)-20, y:Math.random()*H, s:Math.random()*0.6+0.7, o:Math.random()*Math.PI*2 });
    }
  }
  function updateWeather(dt){
    const kind=weatherKind();
    if(kind==="none"){ weather.on=false; weather.particles.length=0; return; }
    weather.timer+=dt;
    if(weather.timer>=weather.phase){ // toggle on/off -> ~50% duty
      weather.timer=0; weather.phase=4+Math.random()*4; weather.on=!weather.on;
      if(weather.on) spawnParticles(kind); else weather.particles.length=0;
    }
    if(!weather.on) return;
    for(const p of weather.particles){
      if(kind==="rain"){ p.y+=dt*220*p.s; p.x+=dt*40; }
      else if(kind==="snow"){ p.o+=dt*2; p.y+=dt*38*p.s; p.x+=Math.sin(p.o)*dt*22; }
      else if(kind==="wind"){ p.o+=dt*3; p.x+=dt*70*p.s; p.y+=Math.sin(p.o)*dt*18; }
      if(p.y>H+4){ p.y=-4; p.x=Math.random()*(W+40)-20; }
      if(p.x>W+20){ p.x=-20; p.y=Math.random()*H; }
    }
  }
  function drawWeather(){
    if(!weather.on) return;
    const kind=weatherKind();
    if(kind==="rain"){
      ctx.strokeStyle="rgba(180,210,240,0.6)"; ctx.lineWidth=1;
      ctx.beginPath();
      for(const p of weather.particles){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+5); }
      ctx.stroke();
      ctx.fillStyle="rgba(40,60,90,0.10)"; ctx.fillRect(0,0,W,H);
    } else if(kind==="snow"){
      ctx.fillStyle="rgba(255,255,255,0.92)";
      for(const p of weather.particles){ const s=p.s>1.1?2:1; ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s); }
    } else if(kind==="wind"){
      // breeze streaks + a few drifting petals/leaves
      ctx.strokeStyle="rgba(255,255,255,0.22)"; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+8,p.y-1); }
      ctx.stroke();
      const petal = season==="spring" ? "#f6b8d6" : "#e0a030";
      for(let i=1;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.fillStyle=petal; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); }
    }
  }

  // ================= FOG (rolling banks, all seasons, ~independent duty) =================
  // Drifting fog banks that roll in and out regardless of season, for a noir atmosphere.
  const fog = { banks:[], intensity:0, target:0, timer:0, phase:8 };
  function resetFog(){ fog.banks.length=0; fog.intensity=0; fog.target=0.9; fog.timer=0; fog.phase=6+Math.random()*4;
    for(let i=0;i<12;i++){
      fog.banks.push({ x:Math.random()*(W+120)-60, y:Math.random()*H, s:Math.random()*0.6+0.7,
        vx:5+Math.random()*10, w:44+Math.random()*70, h:16+Math.random()*20, o:Math.random()*Math.PI*2 });
    }
  }
  function updateFog(dt){
    // toggle target intensity in/out (~50% duty) so banks roll through then thin out
    fog.timer+=dt;
    if(fog.timer>=fog.phase){ fog.timer=0; fog.phase=7+Math.random()*6; fog.target = fog.target>0.4 ? 0.0 : 0.9; }
    // ease current intensity toward target
    fog.intensity += (fog.target-fog.intensity)*Math.min(1,dt*0.6);
    for(const b of fog.banks){
      b.o+=dt*0.25; b.x+=dt*(b.vx*(0.6+b.s*0.6)); b.y+=Math.sin(b.o)*dt*3;
      if(b.x-b.w>W+60){ b.x=-b.w-Math.random()*40; b.y=Math.random()*H; }
    }
  }
  function drawFog(){
    if(fog.intensity<=0.01) return;
    const gi=fog.intensity;
    // low uniform haze
    ctx.fillStyle="rgba(158,170,180,"+(0.12*gi).toFixed(3)+")"; ctx.fillRect(0,0,W,H);
    // drifting banks
    for(const b of fog.banks){
      ctx.fillStyle="rgba(184,196,204,"+((0.05+0.05*b.s)*gi).toFixed(3)+")";
      ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h));
    }
  }
  resetFog();

  // Per-area interiors keyed by the door char. A plain string means "any door 1-9 -> that interior"

  // Does talking to this NPC currently start or complete a quest? (drives the "!" marker)

  const SHIP_KINDS=["rowboat","sloop","brig","galleon"];

  const SHIPS_BY_AREA={ opensea:5, island:3, cape:3, town:2, holiday:2, industrial:2 };
  let ships=[];               // active ambient boats in the current area

  function seaTileAt(area,tx,ty){ const rows=AREAS[area]; if(!rows) return false; if(ty<0||ty>=rows.length||tx<0||tx>=rows[0].length) return false;
    const c=rows[ty][tx]; return c==="~"||c==="q"; }   // open navigable water (~ everywhere, q = King's Borough harbour)
  // Crudo Pirate: ambient boats stay OFFSHORE in coastal areas (far from the beach), where the buoys used to be.
  const SHIP_COASTAL=new Set(["town","holiday","industrial"]);
  const SHIP_FAR_ROW=37;   // in coastal areas, boats only sail on rows >= this (deep water)
  function shipWaterAt(area,tx,ty){
    if(!seaTileAt(area,tx,ty)) return false;
    if(SHIP_COASTAL.has(area) && ty<SHIP_FAR_ROW) return false;   // keep them far from shore
    return true;
  }
  function spawnShips(area){
    ships=[]; const n=SHIPS_BY_AREA[area]; if(!n) return;
    const rows=AREAS[area]; if(!rows) return; const W2=rows[0].length,H2=rows.length;
    for(let i=0;i<n;i++){
      let tx,ty,tries=0;
      do{ tx=2+Math.floor(Math.random()*(W2-4)); ty=2+Math.floor(Math.random()*(H2-4)); tries++; }while(!shipWaterAt(area,tx,ty)&&tries<160);
      if(!shipWaterAt(area,tx,ty)) continue;
      const kind=SHIP_KINDS[Math.floor(Math.random()*SHIP_KINDS.length)];
      const speed=(kind==="rowboat"?10:kind==="sloop"?16:kind==="brig"?22:26);
      // Crudo Pirate: in the Deep Sea, some ships are HOSTILE (trigger a naval battle on contact)
      const hostile = (area==="opensea") && (i<2) && kind!=="rowboat";
      const navalKind = kind==="galleon"?"galleon":(kind==="brig"?"brig":"sloop");
      ships.push({ kind, px:tx*TILE, py:ty*TILE, dir:(Math.random()<0.5?"left":"right"),

  // ---- FIGHT (Zelda-like scripted duel): move + attack (A) + dodge (B), HP bars ----
  // Arena in screen space. Rare, story-scripted encounters only.
  const AR = { x:16, y:52, w:W-32, h:H-84 };   // arena rectangle
  const fight = { active:false, id:null, onWin:null,
    px:0, py:0, pdir:"down", php:100, patk:0, pdodge:0, pinv:0, phit:0,
    ex:0, ey:0, ehp:100, etimer:0, elunge:0, ehit:0, msg:"", msgT:0, endT:0, ended:null };
  function startFight(id, onWin){
    fight.active=true; fight.id=id; fight.onWin=onWin;
    fight.px=AR.x+20; fight.py=AR.y+AR.h/2; fight.pdir="right"; fight.php=100; fight.patk=0; fight.pdodge=0; fight.pinv=0; fight.phit=0;

    SFX.talk();
  }
  function updateFight(dt){
    if(fight.msgT>0) fight.msgT-=dt;
    if(fight.ended){ fight.endT-=dt; if(fight.endT<=0){ if(fight.ended==="win"){ const cb=fight.onWin; fight.active=false; if(cb) cb(); } else { startFight(fight.id, fight.onWin); } } return; }
    const PSPD=70;
    // player movement
    let mvx=0,mvy=0;
    if(keys.left){mvx=-1;fight.pdir="left";} else if(keys.right){mvx=1;fight.pdir="right";}
    if(keys.up){mvy=-1;fight.pdir="up";} else if(keys.down){mvy=1;fight.pdir="down";}
    // dodge dash
    if(fight.pdodge>0){ fight.pdodge-=dt; fight.pinv=Math.max(fight.pinv, 0.02); }
    const spd = fight.pdodge>0 ? PSPD*2.4 : PSPD;
    fight.px=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.px+mvx*spd*dt));
    fight.py=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.py+mvy*spd*dt));
    if(fight.pinv>0) fight.pinv-=dt;
    if(fight.phit>0) fight.phit-=dt;
    if(fight.ehit>0) fight.ehit-=dt;
    if(fight.patk>0) fight.patk-=dt;
    // attack (A): short reach in facing direction
    if(consumePress("a") && fight.patk<=0){ fight.patk=0.22; SFX.b&&SFX.b();
      const range=16; let ax=fight.px, ay=fight.py;
      if(fight.pdir==="left")ax-=range; else if(fight.pdir==="right")ax+=range; else if(fight.pdir==="up")ay-=range; else ay+=range;
      if(Math.abs(ax-fight.ex)<12 && Math.abs(ay-fight.ey)<12){ fight.ehp=Math.max(0,fight.ehp-18); fight.ehit=0.2;
        triggerShake(3, 25);   // small shake + short vibration on a landed hit
        if(fight.ehp<=0){ fight.msg=csvar(fight.id,"fight_win")||t("fight_win"); fight.msgT=1.6; fight.ended="win"; fight.endT=1.6; SFX.questDone&&SFX.questDone(); triggerShake(5,60); }
      }
    }
    // dodge (B)
    if(consumePress("b") && fight.pdodge<=0){ fight.pdodge=0.18; fight.pinv=0.3; SFX.confirm(); }
    // enemy AI: chase, then lunge periodically
    if(fight.elunge>0){ fight.elunge-=dt;

      fight.ex+=fight.elvx*dt; fight.ey+=fight.elvy*dt;
    } else {
      const dx=fight.px-fight.ex, dy=fight.py-fight.ey; const d=Math.hypot(dx,dy)||1;

      if(fight.etimer<=0){ fight.etimer=1.4+Math.random()*0.8; fight.elunge=0.35; const dd=Math.hypot(dx,dy)||1; fight.elvx=dx/dd*160; fight.elvy=dy/dd*160; }
    }
    fight.ex=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.ex));
    fight.ey=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.ey));
    // enemy hits player on contact (unless dodging/invulnerable)
    if(Math.abs(fight.px-fight.ex)<10 && Math.abs(fight.py-fight.ey)<10 && fight.pinv<=0 && fight.phit<=0){
      fight.php=Math.max(0, fight.php-12); fight.phit=0.6; fight.pinv=0.4; SFX.cancel();
      triggerShake(4, 40);   // taking a hit shakes a bit more + vibrates

    }
  }

  // ================= Crudo Pirate: NAVAL BATTLE (real-time, top-down, Zelda-style) =================
  // Fought directly on the sea. Steer with the D-pad; broadside (A) when an enemy is abeam (to your side);
  // ram with your prow for reduced damage. Wind boosts/limits speed. Upgrades: cannons per side, prow, hull.
  const NAVAL_CANNONS=[  // per-side cannon count -> total broadside damage multiplier (1..4 guns)
    {n:1,mul:1}, {n:2,mul:2}, {n:3,mul:3}, {n:4,mul:4}
  ];
  const PROW_TIERS=[  // ram prow material -> ram damage % (of a base) ; index = tier
    {key:"prow_wood",   dmg:0.20}, {key:"prow_solid", dmg:0.30}, {key:"prow_double", dmg:0.42},
    {key:"prow_bronze", dmg:0.58}, {key:"prow_iron",  dmg:0.80}
  ];
  const HULL_TIERS=[  // hull material -> max HP
    {key:"hull_wood",   hp:100}, {key:"hull_solid", hp:135}, {key:"hull_double", hp:180},
    {key:"hull_bronze", hp:235}, {key:"hull_iron",  hp:300}
  ];
  const NAVAL_BASE_BROADSIDE=14;   // damage of a single-cannon broadside (scaled by cannon count)
  const NAVAL_RAM_BASE=40;         // base ram damage, scaled by prow % (so wood prow = 8)
  // Enemy ship roster
  const NAVAL_ENEMIES={
    sloop:   { nameKey:"nv_sloop",   hp:90,  guns:1, speed:52, gold:40,  col:"#8a6a3a" },
    brig:    { nameKey:"nv_brig",    hp:150, guns:2, speed:46, gold:70,  col:"#7a5230" },
    galleon: { nameKey:"nv_galleon", hp:230, guns:3, speed:40, gold:120, col:"#6a4a28" },
    royal:   { nameKey:"nv_royal",   hp:300, guns:4, speed:44, gold:200, col:"#3a4a7a" }
  };
  const naval = { active:false, onEnd:null, result:null, msg:"", msgT:0, ended:null, endT:0, intro:0,
    px:0, py:0, pang:0, pvel:0, php:0, pmax:0, pcool:0, pflash:0, pfire:0,
    ex:0, ey:0, eang:0, evel:0, ehp:0, emax:0, ecool:0, eflash:0, efire:0, etimer:0,
    windAng:0, windT:0, shots:[], enemyKind:"sloop", saveTx:0, saveTy:0, saveDir:"down",
    mode:"sink", timer:0, ally:null, forts:[], boarded:false };
  function playerShipStats(){
    const ty=BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop;
    const s=player.ship||{cannons:0,prow:0,hull:0};
    const gunIdx=Math.min(NAVAL_CANNONS.length-1, s.cannons, ty.gunMax-1);   // cannons capped by type
    const prow=Math.min(PROW_TIERS.length-1, s.prow, ty.prowMax);
    const hull=Math.min(HULL_TIERS.length-1, s.hull, ty.hullMax);
    const pct=crewPct();
    return { guns:NAVAL_CANNONS[gunIdx].n, broMul:NAVAL_CANNONS[gunIdx].mul*pct,
      ramPct:PROW_TIERS[prow].dmg*pct, maxhp:Math.round(HULL_TIERS[hull].hp*pct),
      speedMul:ty.speedMul*(1+ (pct-1)*0.5), agiMul:ty.agiMul };
  }
  function startNaval(enemyKind, onEnd, opts){
    opts=opts||{};
    const e=NAVAL_ENEMIES[enemyKind]||NAVAL_ENEMIES.sloop;
    naval.saveTx=player.tx; naval.saveTy=player.ty; naval.saveDir=player.dir;
    const st=playerShipStats();
    naval.active=true; naval.onEnd=onEnd||null; naval.enemyKind=enemyKind; naval.result=null; naval.ended=null; naval.endT=0; naval.intro=1.4;
    naval.px=AR.x+30; naval.py=AR.y+AR.h/2; naval.pang=0; naval.pvel=0; naval.pmax=st.maxhp; naval.php=st.maxhp; naval.pcool=0; naval.pflash=0; naval.pfire=0;
    naval.ex=AR.x+AR.w-30; naval.ey=AR.y+AR.h/2; naval.eang=Math.PI; naval.evel=0; naval.emax=e.hp; naval.ehp=e.hp; naval.ecool=0; naval.eflash=0; naval.efire=0; naval.etimer=1.5;
    naval.windAng=Math.random()*Math.PI*2; naval.windT=0; naval.shots=[];
    // --- objective mode ---
    naval.mode = opts.mode || "sink";
    naval.timer = opts.time || 0;        // for flee (countdown to safety) / survive
    naval.ally = null; naval.forts = []; naval.boarded=false;
    if(naval.mode==="escort"){ naval.ally={ x:AR.x+20, y:AR.y+18, hp:100, max:100, ang:0, t:0 }; }
    if(naval.mode==="board"){ naval.emax=e.hp; naval.ehp=e.hp; }   // reduce to threshold, then ram to board
    if(naval.mode==="batteries"){
      naval.ex=-999; naval.ey=-999;   // no ship (batteries only)
      naval.forts=[ {x:AR.x+AR.w-20,y:AR.y+16,hp:40,max:40,cool:Math.random()*2},
                    {x:AR.x+AR.w-20,y:AR.y+AR.h-16,hp:40,max:40,cool:Math.random()*2},
                    {x:AR.x+AR.w-40,y:AR.y+AR.h/2,hp:40,max:40,cool:Math.random()*2} ];
    }
    if(naval.mode==="flee"){ naval.timer=opts.time||22; }   // survive/escape for N seconds (or reach the left edge)
    naval.msg = t(naval.mode==="sink" ? "nv_appears" : ("nv_obj_"+naval.mode)).replace("%",t(e.nameKey)); naval.msgT=2.2;
    SFX.talk&&SFX.talk();
  }
  function navalEnemy(){ return NAVAL_ENEMIES[naval.enemyKind]||NAVAL_ENEMIES.sloop; }
  function angDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
  function windFactor(ang){ // 1.5 downwind .. 0.6 upwind (dot of heading vs wind)
    const dot=Math.cos(angDiff(ang,naval.windAng)); return 1.05+0.45*dot;   // 0.6 .. 1.5
  }
  function navalFireBroadside(){
    if(naval.pcool>0) return;
    const st=playerShipStats();
    // cannons fire perpendicular to heading (both sides). Check enemy is roughly abeam.
    const toE=Math.atan2(naval.ey-naval.py, naval.ex-naval.px);
    const rel=angDiff(toE, naval.pang);   // ~±90° means abeam
    const abeam=Math.abs(Math.abs(rel)-Math.PI/2) < 0.5;   // within ~28° of perpendicular
    const dist=Math.hypot(naval.ex-naval.px, naval.ey-naval.py);
    naval.pcool=1.1; naval.pfire=0.2; SFX.b&&SFX.b(); triggerShake(3,25);
    // muzzle smoke shots on both sides
    const side=(rel>0?1:-1);
    for(let i=0;i<st.guns;i++){ naval.shots.push({x:naval.px+Math.cos(naval.pang+side*Math.PI/2)*(6+i*3), y:naval.py+Math.sin(naval.pang+side*Math.PI/2)*(6+i*3), t:0.3, side:side}); }
    if(abeam && dist<70){
      const dmg=NAVAL_BASE_BROADSIDE*st.broMul + Math.floor(Math.random()*5);
      // in "board" mode you can't sink below 1 HP with cannons: you must ram to board & capture
      const floor = (naval.mode==="board") ? Math.round(naval.emax*0.18) : 0;
      naval.ehp=Math.max(floor,naval.ehp-dmg); naval.eflash=0.25; triggerShake(4,40);
      naval.msg=t("nv_broadside").replace("#",dmg); naval.msgT=1.0; SFX.cancel&&SFX.cancel();
      if(naval.ehp<=0 && naval.mode!=="board"){ navalWin(); }
    } else if(naval.mode==="batteries" && naval.forts.length){
      // broadside a shore battery when abeam of it
      let hit=false;
      for(const f of naval.forts){ if(f.hp<=0) continue;
        const toF=Math.atan2(f.y-naval.py, f.x-naval.px); const relF=angDiff(toF, naval.pang);
        const abF=Math.abs(Math.abs(relF)-Math.PI/2)<0.6; const dF=Math.hypot(f.x-naval.px,f.y-naval.py);
        if(abF && dF<80){ const dmg=NAVAL_BASE_BROADSIDE*st.broMul+Math.floor(Math.random()*5); f.hp=Math.max(0,f.hp-dmg); f.flash=0.25; triggerShake(4,40); hit=true;
          naval.msg=t("nv_broadside").replace("#",dmg); naval.msgT=1.0; SFX.cancel&&SFX.cancel(); break; } }
      if(!hit){ naval.msg=t("nv_miss"); naval.msgT=0.8; }
      if(naval.forts.every(f=>f.hp<=0)) navalWin();
    } else {
      naval.msg=t("nv_miss"); naval.msgT=0.8;   // not lined up abeam / too far
    }
  }
  function navalWin(){ naval.ended="win"; naval.result="win"; naval.endT=1.6; naval.msg=t("nv_win"); naval.msgT=1.6; SFX.questDone&&SFX.questDone(); }
  function navalLose(){ naval.ended="lose"; naval.result="lose"; naval.endT=1.6; naval.msg=t("nv_lose"); naval.msgT=1.6; SFX.cancel&&SFX.cancel(); }
  function updateNaval(dt){
    if(naval.msgT>0) naval.msgT-=dt;
    if(naval.pflash>0) naval.pflash-=dt; if(naval.eflash>0) naval.eflash-=dt;
    if(naval.pfire>0) naval.pfire-=dt; if(naval.efire>0) naval.efire-=dt;
    if(naval.pcool>0) naval.pcool-=dt; if(naval.ecool>0) naval.ecool-=dt;
    // shots fade
    naval.shots.forEach(s=>s.t-=dt); naval.shots=naval.shots.filter(s=>s.t>0);
    // wind slowly rotates
    naval.windT+=dt; if(naval.windT>4){ naval.windT=0; naval.windAng+=(Math.random()-0.5)*0.8; }
    if(naval.intro>0){ naval.intro-=dt; return; }
    if(naval.ended){ naval.endT-=dt; if(naval.endT<=0){ const cb=naval.onEnd, r=naval.result; naval.active=false;
        // resume where the battle started
        player.tx=naval.saveTx; player.ty=naval.saveTy; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir=naval.saveDir; player.moving=false;
        if(cb) cb(r); } return; }
    // --- player ship control: left/right turn, up = thrust forward, down = brake/reverse ---
    const st=playerShipStats(); const wf=windFactor(naval.pang);
    const TURN=1.9*dt*(0.7+0.3*wf);   // upwind turns are a touch slower (wf small)
    if(keys.left) naval.pang-=TURN;
    if(keys.right) naval.pang+=TURN;
    const BASE=58;
    let targetV=0;
    if(keys.up) targetV=BASE*wf;              // sail forward, wind-scaled
    else if(keys.down) targetV=-BASE*0.4;     // slow reverse
    naval.pvel += (targetV-naval.pvel)*Math.min(1,dt*2.2);
    naval.px += Math.cos(naval.pang)*naval.pvel*dt;
    naval.py += Math.sin(naval.pang)*naval.pvel*dt;
    // keep in arena
    naval.px=Math.max(AR.x+8, Math.min(AR.x+AR.w-8, naval.px));
    naval.py=Math.max(AR.y+8, Math.min(AR.y+AR.h-8, naval.py));
    // fire broadside
    if(consumePress("a")) navalFireBroadside();
    // --- objective: FLEE (survive/escape) ---
    if(naval.mode==="flee"){
      naval.timer-=dt;
      if(naval.px<=AR.x+12){ navalWin(); }          // reached the left edge = escaped
      else if(naval.timer<=0){ navalWin(); }         // survived long enough = shook them off
    }
    // --- ram / board: prow contact with the enemy ---
    const dx=naval.ex-naval.px, dy=naval.ey-naval.py, d=Math.hypot(dx,dy)||1;
    if(naval.ex>-900 && d<14){
      const aim=Math.abs(angDiff(Math.atan2(dy,dx), naval.pang));
      if(naval.mode==="board" && naval.ehp<=Math.round(naval.emax*0.20)+1 && aim<0.9){
        naval.boarded=true; naval.msg=t("nv_board_ok"); naval.msgT=1.2; navalWin(); return;   // captured!
      }
      if(aim<0.7 && naval.pcool<=0.9){
        const dmg=Math.round(NAVAL_RAM_BASE*st.ramPct)+Math.floor(Math.random()*3);
        const floor=(naval.mode==="board")?1:0;
        naval.ehp=Math.max(floor,naval.ehp-dmg); naval.eflash=0.25; triggerShake(3,30); naval.pcool=Math.max(naval.pcool,0.6);
        naval.msg=t("nv_ram").replace("#",dmg); naval.msgT=0.9; SFX.b&&SFX.b();
        naval.ex+=dx/d*8; naval.ey+=dy/d*8; naval.pvel*=0.3;
        if(naval.ehp<=0 && naval.mode!=="board"){ navalWin(); }
      } else { naval.pvel*=0.5; naval.px-=dx/d*2; naval.py-=dy/d*2; }
    }
    // --- escort ally: drifts slowly; enemy also targets it; lose if it sinks ---
    if(naval.mode==="escort" && naval.ally){
      const a=naval.ally; a.t+=dt; a.x += Math.cos(a.t*0.3)*6*dt; a.y += Math.sin(a.t*0.4)*5*dt;
      a.x=Math.max(AR.x+8,Math.min(AR.x+AR.w-8,a.x)); a.y=Math.max(AR.y+8,Math.min(AR.y+AR.h-8,a.y));
      if(a.hp<=0){ navalLose(); return; }
    }
    // --- shore batteries: fire at the player; win handled in broadside ---
    if(naval.mode==="batteries"){
      for(const f of naval.forts){ if(f.hp<=0) continue; if(f.flash>0)f.flash-=dt; f.cool-=dt;
        if(f.cool<=0){ f.cool=1.8+Math.random(); const dF=Math.hypot(f.x-naval.px,f.y-naval.py);
          if(dF<90){ const dmg=10+Math.floor(Math.random()*6); naval.php=Math.max(0,naval.php-dmg); naval.pflash=0.3; triggerShake(4,45); SFX.cancel&&SFX.cancel();
            if(naval.php<=0){ navalLose(); return; } } } }
    }
    // --- enemy AI: circle the player, keep abeam, fire when lined up (skipped in batteries mode) ---
    if(naval.mode!=="batteries"){
    const e=navalEnemy();
    const toP=Math.atan2(naval.py-naval.ey, naval.px-naval.ex);
    // steer to keep the player ~abeam at medium range
    const desired = (d>60) ? toP : (toP + Math.PI/2);   // approach, then circle
    naval.eang += Math.max(-1.6*dt, Math.min(1.6*dt, angDiff(desired, naval.eang)));
    const ewf=windFactor(naval.eang);
    naval.evel += (e.speed*ewf - naval.evel)*Math.min(1,dt*2);
    naval.ex += Math.cos(naval.eang)*naval.evel*dt; naval.ey += Math.sin(naval.eang)*naval.evel*dt;
    naval.ex=Math.max(AR.x+8, Math.min(AR.x+AR.w-8, naval.ex)); naval.ey=Math.max(AR.y+8, Math.min(AR.y+AR.h-8, naval.ey));
    naval.etimer-=dt;
    if(naval.etimer<=0 && naval.ecool<=0){
      const relE=angDiff(Math.atan2(naval.py-naval.ey,naval.px-naval.ex), naval.eang);
      const abeamE=Math.abs(Math.abs(relE)-Math.PI/2)<0.6;
      if(abeamE && d<80){ // enemy broadside hits the player
        const dmg=NAVAL_BASE_BROADSIDE*e.guns*0.8 + Math.floor(Math.random()*5);
        naval.php=Math.max(0,naval.php-dmg); naval.pflash=0.3; naval.efire=0.2; triggerShake(4,45); SFX.cancel&&SFX.cancel();
        naval.etimer=1.6+Math.random()*0.8; naval.ecool=1.2;
        if(naval.php<=0){ navalLose(); }
      } else if(naval.mode==="escort" && naval.ally && Math.random()<0.5){
        // sometimes the enemy pounds the escorted ally instead
        const dA=Math.hypot(naval.ally.x-naval.ex, naval.ally.y-naval.ey);
        if(dA<90){ naval.ally.hp=Math.max(0,naval.ally.hp-(NAVAL_BASE_BROADSIDE*e.guns*0.6)); naval.etimer=1.6+Math.random(); naval.ecool=1.2; }
        else naval.etimer=0.6;
      } else { naval.etimer=0.6; }
    }
    }
  }

  // ================= Crudo Pirate: TURN-BASED BATTLE (Pokémon GBA style) =================
  // Player's move set (name key, power, pp). Simple, expandable.
  // Crudo Pirate: weapons accumulate. You start with FIST + KNIFE; find more through the game.
  // Each entry has an id used by player.weapons ownership. "parley" is always available.
  const PLAYER_MOVES=[
    { id:"fist",    key:"mv_fist",    pow:10, pp:99 },   // Pugno (always owned)
    { id:"knife",   key:"mv_knife",   pow:15, pp:99 },   // Coltello (owned at start)
    { id:"cutlass", key:"mv_cutlass", pow:22, pp:99 },   // Sciabola
    { id:"pistol",  key:"mv_pistol",  pow:30, pp:8  },   // Pistola
    { id:"musket",  key:"mv_musket",  pow:38, pp:5  },   // Fucile (moschetto)
    { id:"axe",     key:"mv_axe",     pow:28, pp:99 },   // Ascia
    { id:"parley",  key:"mv_parley",  pow:0,  pp:5  }    // Parlamenta (sempre disponibile)
  ];
  const WEAPON_ORDER=["cutlass","pistol","musket","axe"];   // acquisition order for progression rewards
  // moves the player can currently use = owned weapons + always fist & parley
  function availableMoves(){ return PLAYER_MOVES.filter(m=> m.id==="fist"||m.id==="parley"||(player.weapons&&player.weapons.indexOf(m.id)>=0)); }
  function unlockWeapon(id){ if(!player.weapons) player.weapons=["knife"]; if(player.weapons.indexOf(id)<0){ player.weapons.push(id); const m=PLAYER_MOVES.find(w=>w.id===id); banner(t("wp_found").replace("%", m?t(m.key):id)); SFX.quest&&SFX.quest(); saveGame(); return true; } return false; }
  function nextLockedWeapon(){ for(const id of WEAPON_ORDER){ if(!player.weapons||player.weapons.indexOf(id)<0) return id; } return null; }
  // Enemy roster: hp, atk power range, name key, sprite kind ("human"|"critter"), look
  const ENEMIES={
    pirate:  { nameKey:"en_pirate",  hp:60,  atk:[8,16],  kind:"human", look:{skin:"#e0b080",hair:"#1a1a1a",shirt:"#5a2a6a",shirtDk:"#3e1c4a",pants:"#2a2028",outfit:"pirate"} },
    soldier: { nameKey:"en_soldier", hp:70,  atk:[10,18], kind:"human", look:{skin:"#e8c090",hair:"#3a2a1a",shirt:"#26407a",shirtDk:"#1a2e5a",pants:"#2a2028",outfit:"guard"} },
    wolf:    { nameKey:"en_wolf",    hp:45,  atk:[7,13],  kind:"critter", critter:"wolf",   col:"#8a8f98" },
    octopus: { nameKey:"en_octopus", hp:80,  atk:[9,17],  kind:"critter", critter:"octopus",col:"#8a3a6a" },
    orca:    { nameKey:"en_orca",    hp:90,  atk:[12,20], kind:"critter", critter:"orca",    col:"#20242c" },
    wisp:    { nameKey:"en_wisp",    hp:40,  atk:[6,14],  kind:"critter", critter:"wisp",    col:"#a060e0" }
  };
  const battle = { active:false, enemyId:null, php:0, pmax:0, ehp:0, emax:0,
    menu:0, sel:0, phase:"menu", msg:"", msgQ:[], anim:0, intro:0, onEnd:null, result:null, flash:0 };
  function startBattle(enemyId, onEnd){
    const e=ENEMIES[enemyId]||ENEMIES.pirate;
    // Crudo Pirate: snapshot where the fight started, so we resume there on any outcome
    battle.saveTx=player.tx; battle.saveTy=player.ty; battle.saveDir=player.dir;
    battle.active=true; battle.enemyId=enemyId; battle.onEnd=onEnd||null;
    battle.pmax=100+crewBonus("maxhp"); battle.php=battle.pmax; battle.emax=e.hp; battle.ehp=e.hp;
    battle.menu=0; battle.sel=0; battle.phase="intro"; battle.intro=0.8;
    battle.msg=t("bt_appears").replace("%",t(e.nameKey)); battle.msgQ=[]; battle.anim=0; battle.result=null; battle.flash=0.4;
    SFX.talk&&SFX.talk();
  }
  function battleEnemy(){ return ENEMIES[battle.enemyId]||ENEMIES.pirate; }
  // Crudo Pirate (Fase 5.3): trigger a battle when the player touches a hostile creature.
  function checkBattleEncounter(){
    if(battle.active||fight.active||insideKey||battleCooldown>0) return;
    for(const a of fauna){
      const h=HOSTILE_FAUNA[a.kind]; if(!h) continue;
      const dtx=Math.round(a.px/TILE)-player.tx, dty=Math.round(a.py/TILE)-player.ty;
      if(Math.abs(dtx)+Math.abs(dty)<=1){
        const foe=a;   // capture the creature so we can remove it on victory
        battle.flash=0.5;
        startBattle(h.enemy, (result)=>{
          battleCooldown=1.2;
          if(result==="win"||result==="parley"){
            const i=fauna.indexOf(foe); if(i>=0) fauna.splice(i,1);   // creature defeated/left
            if(result==="win"){ const g=Math.round(h.gold*(1+crewBonus("loot"))); player.gold+=g; banner(t("bt_reward").replace("#",g));
              const nw=nextLockedWeapon(); if(nw && Math.random()<0.30) unlockWeapon(nw); }   // Crudo Pirate: weapons accumulate through battles
            saveGame();
          } else if(result==="lose"){
            // knocked out: recover a bit, small grace
            player.gold=Math.max(0,player.gold-Math.floor(h.gold/2));
          }
        });
        return;
      }
    }
  }
  function bmsg(m){ battle.msg=m; battle.anim=0; }
  // Crudo Pirate: start a naval battle when the player's boat touches a hostile ship on the sea.
  let navalCooldown=0;
  function checkNavalEncounter(){
    if(naval.active||battle.active||fight.active||insideKey||navalCooldown>0) return;
    for(const s of ships){
      if(!s.hostile) continue;
      const dpx=s.px-player.px, dpy=s.py-player.py;
      if(Math.abs(dpx)<TILE*1.4 && Math.abs(dpy)<TILE*1.4){
        const foe=s;
        startNaval(s.navalKind||"sloop", (result)=>{
          navalCooldown=2.0;
          if(result==="win"){
            const i=ships.indexOf(foe); if(i>=0) ships.splice(i,1);
            const e=NAVAL_ENEMIES[foe.navalKind]||NAVAL_ENEMIES.sloop;
            const g=Math.round(e.gold*(1+crewBonus("loot"))); player.gold+=g; banner(t("bt_reward").replace("#",g));
            saveGame();
          } // lose -> handled below (swim to safety)
          else if(result==="lose"){ player.gold=Math.max(0,player.gold-20); saveGame(); }
        });
        return;
      }
    }
  }
  function playerMoveDamage(mv){ const e=battleEnemy(); const base=mv.pow; if(base===0) return 0; const v=base+crewBonus("dmg")+Math.floor(Math.random()*5)-2; return Math.max(1,v); }
  function enemyDamage(){ const e=battleEnemy(); const [a,b]=e.atk; return a+Math.floor(Math.random()*(b-a+1)); }
  function updateBattle(dt){
    battle.anim+=dt; if(battle.flash>0) battle.flash-=dt;
    if(battle.phase==="intro"){ battle.intro-=dt; if(battle.intro<=0) battle.phase="menu"; return; }
    if(battle.phase==="end"){ if(consumePress("a")||consumePress("b")){ const cb=battle.onEnd, r=battle.result; battle.active=false;
      // Crudo Pirate: resume exactly where the battle began
      if(battle.saveTx!=null){ player.tx=battle.saveTx; player.ty=battle.saveTy; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir=battle.saveDir||player.dir; player.moving=false; }
      if(cb) cb(r); } return; }
    if(battle.phase==="msg"){
      // wait for A to continue after a message, then resolve queued action
      if(consumePress("a")||consumePress("b")){
        if(battle.msgQ.length){ const step=battle.msgQ.shift(); step(); }
        else battle.phase="menu";
      }
      return;
    }
    if(battle.phase==="menu"){
      // top menu: 0=FIGHT (moves), 1=RUN
      if(consumePress("left")||consumePress("right")){ battle.menu=battle.menu?0:1; SFX.talk&&SFX.talk(); }
      if(consumePress("a")){
        if(battle.menu===1){ // RUN
          if(Math.random()<0.6){ bmsg(t("bt_flee_ok")); battle.result="flee"; battle.phase="end"; SFX.cancel&&SFX.cancel(); }
          else { bmsg(t("bt_flee_no")); battle.phase="msg"; battle.msgQ=[()=>enemyTurn()]; }
        } else { battle.phase="moves"; battle.sel=0; SFX.confirm&&SFX.confirm(); }
      }
      return;
    }
    if(battle.phase==="moves"){
      const n=availableMoves().length; const cols=2;
      // 2-column grid: index -> (col=i%2, row=floor(i/2)); D-pad moves in all four directions
      let col=battle.sel%cols, rowi=Math.floor(battle.sel/cols); const rows=Math.ceil(n/cols);
      if(consumePress("left")||consumePress("right")){ // toggle column, clamp to an existing cell
        const nc=col===0?1:0; const ni=rowi*cols+nc; if(ni<n){ battle.sel=ni; SFX.talk&&SFX.talk(); } }
      if(consumePress("up")){ rowi=(rowi-1+rows)%rows; let ni=rowi*cols+col; if(ni>=n) ni=n-1; battle.sel=ni; SFX.talk&&SFX.talk(); }
      if(consumePress("down")){ rowi=(rowi+1)%rows; let ni=rowi*cols+col; if(ni>=n) ni=n-1; battle.sel=ni; SFX.talk&&SFX.talk(); }
      if(consumePress("b")){ battle.phase="menu"; SFX.cancel&&SFX.cancel(); return; }
      if(consumePress("a")){ const mv=availableMoves()[battle.sel]; SFX.b&&SFX.b(); playerTurn(mv); }
      return;
    }
  }
  function playerTurn(mv){
    // parley: chance the enemy leaves
    if(mv.pow===0){ if(Math.random()<0.5){ bmsg(t("bt_parley_ok")); battle.result="parley"; battle.phase="end"; return; }
      bmsg(t("bt_parley_no")); battle.phase="msg"; battle.msgQ=[()=>enemyTurn()]; return; }
    const dmg=playerMoveDamage(mv); battle.ehp=Math.max(0,battle.ehp-dmg); battle.flash=0.25; triggerShake(3,20);
    // Crudo Pirate (Fase 7): Healer in the crew restores some HP each of your turns
    const heal=crewBonus("heal"); if(heal>0 && battle.php<battle.pmax) battle.php=Math.min(battle.pmax, battle.php+heal);
    bmsg(t("bt_you_hit").replace("%",t(mv.key)).replace("#",dmg));
    battle.phase="msg";
    if(battle.ehp<=0){ battle.msgQ=[()=>{ bmsg(t("bt_win").replace("%",t(battleEnemy().nameKey))); battle.result="win"; battle.phase="end"; SFX.questDone&&SFX.questDone(); }]; }
    else { battle.msgQ=[()=>enemyTurn()]; }
  }
  function enemyTurn(){
    const dmg=enemyDamage(); battle.php=Math.max(0,battle.php-dmg); battle.flash=0.25; triggerShake(4,40);
    bmsg(t("bt_en_hit").replace("%",t(battleEnemy().nameKey)).replace("#",dmg));
    battle.phase="msg";
    if(battle.php<=0){ battle.msgQ=[()=>{ bmsg(t("bt_lose")); battle.result="lose"; battle.phase="end"; }]; }
    else { battle.msgQ=[()=>{ battle.phase="menu"; }]; }
  }

      const {fx,fy}=facingTile();
      const n=npcAt(fx,fy);
      if(n){ if(n.dir!==undefined) n.dir=opposite(player.dir);
        const sqm = (typeof sqNpcMission==="function") ? sqNpcMission(n.id) : null;
        const kind = npcQuestKind(n);   // single source of truth: matches the on-screen "!" exactly
        const storyActive = (typeof caseActiveFor==="function" && caseActiveFor(n.id)) || (typeof introActiveFor==="function" && introActiveFor(n.id)) || npcHasQuest(n);
        // Offer the SQ side-quest ONLY if this NPC's yellow marker is actually shown right now
        // (kind==="casual") and it's not a micro/story NPC. Keeps interaction == marker.
        if(sqm && kind==="casual" && !storyActive){ showExamine((sqm.giver&&sqm.giver[lang])||["..."], ()=>{ askYesNo(t("accept_quest_q"), ()=>sqStart(sqm)); }); return; }
        openDialog(n); return; }
      const fc=tileAt(fx,fy);
      // board the ship: standing at the end of the pier, facing the moored ferry
      if(inTown() && !insideKey && Math.abs(fx-ship.tx)<=2 && Math.abs(fy-ship.ty)<=2){ openDockMenu({kind:"openseaFerry"}); SFX.confirm(); return; }
      // Crudo Pirate: moored boats at King's Borough piers + Lighthouse Point pier -> unified dock menu
      if(!insideKey && (areaKey==="industrial"||areaKey==="cape")){
        for(const b of MOORED_BOATS){ if(b.area!==areaKey) continue;
          if(Math.abs(fx-b.tx)<=2 && Math.abs(fy-b.ty)<=2){
            if(b.action==="opensea"){ openDockMenu({kind:"openseaFerry"}); }
            else { openDockMenu({kind:"cape", boat:!!player.boat, boatTx:b.tx, boatTy:Math.min(cur.h-1,b.ty+1), landTx:player.tx, landTy:player.ty}); }
            SFX.confirm&&SFX.confirm(); return;
          }
        }
      }
      // island signpost: read a warning about the cult
      if(areaKey==="island" && !insideKey && fc==="P"){ showExamine(t("sign_island")); SFX.confirm&&SFX.confirm(); return; }
      if(areaKey==="cape" && !insideKey && fc==="P"){ showExamine(t("sign_cape")); SFX.confirm&&SFX.confirm(); return; }
      // island temple: enter through the door
      if(areaKey==="island" && !insideKey && !player.boat && fc==="D"){ enterInterior("temple", player.tx, player.ty); return; }
      // island / cape docks: unified menu (see the moored boat, press A to board/disembark)
      if((areaKey==="island"||areaKey==="cape") && !insideKey){
        if(player.boat && fc==="w"){ openDockMenu({kind:areaKey, boat:true, landTx:fx, landTy:fy, landDir:player.dir}); SFX.confirm&&SFX.confirm(); return; }
        if(!player.boat && tileAt(player.tx,player.ty)==="w" && fc==="~"){ openDockMenu({kind:areaKey, boat:false, boatTx:fx, boatTy:fy}); SFX.confirm&&SFX.confirm(); return; }
      }
      if(!insideKey && inTown() && DOORS[fc]){ enterInterior(DOORS[fc].interior, DOORS[fc].outX, DOORS[fc].outY); return; }
      if(!insideKey && !inTown() && (/[1-9]/.test(fc)) && AREA_INTERIOR[areaKey]){
        const ai=AREA_INTERIOR[areaKey];
        const interior = (typeof ai==="string") ? ai : ai[fc];
        if(interior){ enterInterior(interior, player.tx, player.ty); return; }
      }
      if(insideKey && fc==="e"){ exitInterior(); return; }
      if(!insideKey && !cat.found && questState>=1 && fx===cat.tx && fy===cat.ty){ cat.found=true; questState=2; SFX.meow(); SFX.pickup(); banner(t("found_cat")); saveGame(); return; }
      if(!insideKey && !shell.found && shellQuest>=1 && fx===shell.tx && fy===shell.ty){ shell.found=true; shellQuest=2; SFX.pickup(); banner(t("found_shell")); saveGame(); return; }
      if(!insideKey && !ball.taken && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && fx===ball.tx && fy===ball.ty){ ball.taken=true; SFX.pickup(); QUESTS.kids.step=2; banner(t("ball_found")); saveGame(); return; }
      if(!insideKey && !keyring.taken && QUESTS.oldfriend.status==="active" && fx===keyring.tx && fy===keyring.ty){ keyring.taken=true; setFlag("keyring"); SFX.pickup(); banner(t("keyring_found")); saveGame(); return; }
      if(!insideKey && QUESTS.photos.status==="active"){ for(const ph of photos){ if(!ph.taken && fx===ph.tx && fy===ph.ty){ ph.taken=true; SFX.pickup(); banner(t("photo_found")); if(photosFound()>=3){ qComplete("photos"); banner(t("photos_msg")); } saveGame(); return; } } }
      if(!insideKey && typeof tryScourSpot==="function" && scour.active && tryScourSpot(fx,fy)){ return; }
      if(!insideKey && typeof tryPickupClue==="function" && tryPickupClue(fx,fy)){ return; }
    }

    if(!player.moving){
      let ntx=player.tx,nty=player.ty,nd=player.dir,want=false;
      if(keys.up){nty--;nd="up";want=true;} else if(keys.down){nty++;nd="down";want=true;}
      else if(keys.left){ntx--;nd="left";want=true;} else if(keys.right){ntx++;nd="right";want=true;}
      if(want){ player.dir=nd;
        // edge crossing to a neighbor area (screen transition)
        if(!insideKey && (ntx<0||ntx>=cur.w||nty<0||nty>=cur.h)){
          let dir=null; if(nty<0) dir="N"; else if(nty>=cur.h) dir="S"; else if(ntx<0) dir="W"; else if(ntx>=cur.w) dir="E";
          if(areaKey==="opensea"){
            if(dir==="N"){ leaveOpenSea(); return; }        // north edge returns to the pier
            if(dir==="E"){ enterIslandWaters("opensea"); return; }   // sail east to reach the cult island
            if(dir==="W"){ enterCapeWaters(); return; }     // sail west to reach the cape (SW)
            return;   // other edges = open water wall
          }
          if(areaKey==="island"){
            if(dir==="W" && player.boat){ islandToOpenSea(); return; }      // WEST edge -> Open Sea
            if(dir==="N" && player.boat){ islandToIndustrial(); return; }   // NORTH edge -> raft pier (Industry District)
            return;   // other edges (E/S) = open water wall
          }
          if(areaKey==="cape"){
            if(dir==="E" && player.boat){ capeToOpenSea(); return; }   // sail east back to the Open Sea
            if(player.boat) return;   // in the boat, all other edges are open-water walls (holiday is on foot only)
            // on foot: NORTH edge falls through to neighborArea -> holiday
          }
          const nb=neighborArea(dir);
          if(nb && ISOLATED_AREAS.has(nb)) return;   // island/open sea: reachable only by ship
          if(nb){
            let ex=player.tx, ey=player.ty;
            if(dir==="N") ey=cur.h-1; else if(dir==="S") ey=0; else if(dir==="W") ex=cur.w-1; else if(dir==="E") ex=0;
            // clamp entry into walkable range near the edge
            switchArea(nb, ex, ey);
          }
          return; // don't fall through to tryMove
        }
        if(tryMove(ntx,nty)) { player.moving=true; }
      }
    } else {
      const footSpeed = keys.a ? SNEAK_SPEED : (keys.b ? RUN_SPEED : MOVE_SPEED);   // hold A=sneak, B=run
      const boatSp=BOAT_SPEED*((BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop).speedMul + crewBonus("speed"));
      const tX=player.tx*TILE,tY=player.ty*TILE,st=(player.boat?boatSp:(player.swimming?MOVE_SPEED*0.62:(player.scooter?SCOOTER_SPEED:footSpeed)))*dt;
      if(player.px<tX)player.px=Math.min(tX,player.px+st); if(player.px>tX)player.px=Math.max(tX,player.px-st);
      if(player.py<tY)player.py=Math.min(tY,player.py+st); if(player.py>tY)player.py=Math.max(tY,player.py-st);
      if(player.px===tX&&player.py===tY){ player.moving=false; if(insideKey && tileAt(player.tx,player.ty)==="e"){ exitInterior(); return; } if(!insideKey && !player.swimming) saveGame(); }
    }
    updateCamera();
  }

  // A collectible item sitting on a tile blocks movement (you bump into it and pick it up with A),
  // instead of walking over it. Covers story clues + the original micro-quest items.
  function isCollectibleBlocking(tx,ty){
    if(insideKey) return false;
    // story clues currently active in this area (tail beats have no physical pickup -> excluded)
    if(typeof currentClues==="function"){
      for(const {c} of currentClues()){ if(c.tx===tx && c.ty===ty) return true; }
    }
    // micro-quest items
    if(!cat.found && questState>=1 && tx===cat.tx && ty===cat.ty) return true;
    if(!shell.found && shellQuest>=1 && tx===shell.tx && ty===shell.ty) return true;
    if(typeof ball!=="undefined" && !ball.taken && QUESTS.kids && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && tx===ball.tx && ty===ball.ty) return true;
    if(typeof keyring!=="undefined" && !keyring.taken && QUESTS.oldfriend && QUESTS.oldfriend.status==="active" && tx===keyring.tx && ty===keyring.ty) return true;
    if(typeof photos!=="undefined" && QUESTS.photos && QUESTS.photos.status==="active"){
      for(const ph of photos){ if(!ph.taken && tx===ph.tx && ty===ph.ty) return true; }
    }
    return false;
  }

  // Handle a step attempt; returns true if the move starts. Manages swimming + buoys + messages.
  function tryMove(ntx,nty){
    const target=tileAt(ntx,nty);
    if(npcAt(ntx,nty) || (!insideKey && isCollectibleBlocking(ntx,nty))) return false;   // bump into pickups, don't walk over them
    // Crudo Pirate: moored boats at piers act like a WALL when you're on foot/swimming (don't swim past them)
    if(!insideKey && !player.boat && typeof isMooredBlock==="function" && isMooredBlock(ntx,nty)) return false;

    // ---- OPEN SEA: free boat navigation over water ----
    if(areaKey==="opensea" && !insideKey){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // no land in the open sea
    }
    // ---- ISLAND: in the boat you move over water only; on foot the dock/land is walkable ----
    if(areaKey==="island" && !insideKey && player.boat){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // boat can't ride onto land/dock; use A at the dock to land
    }
    // ---- CAPE: same rule as the island for the boat over its eastern/southern waters ----
    if(areaKey==="cape" && !insideKey && player.boat){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // dock with A to land
    }
    // ---- SEA / SWIMMING (town & holiday use '~', industrial uses 'q'; cape allows free swimming) ----
    const seaChar = (areaKey==="industrial") ? "q" : "~";
    const isSeaArea = (areaKey==="town"||areaKey==="holiday"||areaKey==="industrial"||areaKey==="cape");
    // the moored ferry blocks the water south of the east pier: bump into it, don't dive past it
    if(isSeaArea && !insideKey && isShipBlock(ntx,nty)){ return false; }
    if(isSeaArea && !insideKey && target===seaChar){
      if(season==="winter" && areaKey!=="cape"){ banner(t("sea_winter")); return false; }   // no swimming in winter (except cape)
      // beach areas: block going past the old buoy line to the south; cape is open sea (no limit)
      if(areaKey!=="cape" && nty>SWIM_BOTTOM && nty>=player.ty){ banner(t("buoy_msg")); return false; }
      // enter water: contextual message on first entry
      if(!player.swimming){ player.swimming=true; if(player.scooter){ player.scooter=false; SFX.scooterStop(); } banner(t(areaKey==="industrial"?"sea_polluted":("sea_"+season))); }
      player.tx=ntx; player.ty=nty; SFX.step(); return true;
    }
    // moving onto land
    if(isSolid(ntx,nty)) return false;
    if(player.swimming){ player.swimming=false; }   // climb out of the water
    player.tx=ntx; player.ty=nty; SFX.step(); return true;
  }

  function updateAnimals(dt){
    for(const a of animals){
      const wd=a.wander; const target=wd.pts[(wd.i+1)%wd.pts.length];
      const tX=target[0]*TILE, tY=target[1]*TILE, sp=wd.speed*dt;
      let dx=tX-a.px, dy=tY-a.py;
      if(Math.abs(dx)<=sp && Math.abs(dy)<=sp){ a.px=tX; a.py=tY; wd.i=(wd.i+1)%wd.pts.length; }
      else {
        let nx=Math.round(a.px/TILE), ny=Math.round(a.py/TILE);
        if(Math.abs(dx)>Math.abs(dy)){ nx+=Math.sign(dx); a.dir=dx>0?"right":"left"; }
        else { ny+=Math.sign(dy); a.dir=dy>0?"down":"up"; }
        if(isSolid(nx,ny)){ a.px=Math.round(a.px/TILE)*TILE; a.py=Math.round(a.py/TILE)*TILE; wd.i=(wd.i+1)%wd.pts.length; }
        else if(Math.abs(dx)>Math.abs(dy)) a.px+=Math.sign(dx)*sp;
        else a.py+=Math.sign(dy)*sp;
      }
      a.animT+=dt;
    }
  }

  function routineDest(n){
    const h=clock*24;
    if(n.routine){ for(const seg of n.routine){ if(h>=seg.h[0] && h<seg.h[1]) return seg.go; } }
    return n.home || [Math.round(n.px/TILE),Math.round(n.py/TILE)];
  }
  function npcTileFree(n,tx,ty){
    if(isSolid(tx,ty)) return false;
    // NPCs may pass through each other (soft) to avoid deadlocks; only avoid standing on the player.
    if(Math.round(player.px/TILE)===tx && Math.round(player.py/TILE)===ty) return false;
    return true;
  }
  // BFS path from (sx,sy) to (dx,dy) over walkable tiles (ignores dynamic NPC blocking for the plan;
  // dynamic avoidance happens per-step). Returns array of [tx,ty] steps or null.
  function bfsPath(sx,sy,dx,dy){
    if(sx===dx&&sy===dy) return [];
    const key=(x,y)=>x+","+y;
    const prev={}; const seen=new Set([key(sx,sy)]); const q=[[sx,sy]];
    let head=0, found=false;
    while(head<q.length){
      const [x,y]=q[head++];
      for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+ox, ny=y+oy, k=key(nx,ny);
        if(seen.has(k)) continue;
        if(isSolid(nx,ny)) continue;
        seen.add(k); prev[k]=[x,y];
        if(nx===dx&&ny===dy){ found=true; q.length=0; break; }
        q.push([nx,ny]);
      }
      if(found) break;
    }
    if(!found) return null;
    const path=[]; let cur=[dx,dy];
    while(!(cur[0]===sx&&cur[1]===sy)){ path.push(cur); const p=prev[key(cur[0],cur[1])]; if(!p) return null; cur=p; }
    path.reverse(); return path;
  }
  function updateNpcs(dt){
    for(const n of currentNpcs()){
      if(n.fishing){ n.animT=(n.animT||0)+dt; continue; }
      // freeze an NPC while it's the one you're talking to (or being asked/choosing about it)
      if((dialog.active && dialog.npc===n) || (prompt2.active && dialog.npc===n)){
        n.moving=false; n.tgt=null; n.path=null;
        n.px=Math.round(n.px/TILE)*TILE; n.py=Math.round(n.py/TILE)*TILE;   // snap to tile, stand still
        if(typeof player!=="undefined"){ n.dir=opposite(player.dir); }       // face the player
        continue;
      }
      if(!n.routine && !n.home) continue;
      const sp=(n.speed||22)*dt;
      const cx=Math.round(n.px/TILE), cy=Math.round(n.py/TILE);
      const dest=routineDest(n);
      const atTile=(Math.abs(n.px-cx*TILE)<0.6 && Math.abs(n.py-cy*TILE)<0.6);

      // If we still have a pixel target we haven't reached, keep gliding toward it.
      if(n.tgt && !(Math.abs(n.px-n.tgt[0]*TILE)<0.6 && Math.abs(n.py-n.tgt[1]*TILE)<0.6)){
        const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
        if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
        if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
        n.moving=true; n.animT=(n.animT||0)+dt;
        continue;   // don't re-decide mid-tile -> no jitter
      }

      // Aligned on a tile: snap and decide the next step.
      n.px=cx*TILE; n.py=cy*TILE; n.tgt=null;
      n.replan=(n.replan||0)-dt;
      if(cx===dest[0] && cy===dest[1]){ n.moving=false; n.path=null; continue; }   // arrived: idle (frozen)
      if(!n.path || n.path.length===0 || n.destKey!==dest[0]+","+dest[1] || n.replan<=0){
        n.path=bfsPath(cx,cy,dest[0],dest[1]); n.destKey=dest[0]+","+dest[1]; n.replan=2.0;
      }
      if(n.path && n.path.length){
        const [nx,ny]=n.path[0];
        if(npcTileFree(n,nx,ny)){ n.tgt=[nx,ny]; n.path.shift(); n.moving=true;
          n.dir=(nx>cx)?"right":(nx<cx)?"left":(ny>cy?"down":"up");
          const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
          if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
          if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
          n.animT=(n.animT||0)+dt;
        } else { n.moving=false; n.replan=0.5; }   // blocked (usually the player): wait, no jitter
      } else { n.moving=false; }
    }
  }

  function updateCamera(){
    const worldW=cur.w*TILE, worldH=cur.h*TILE;
    cam.x=Math.round(player.px+TILE/2-W/2); cam.y=Math.round(player.py+TILE/2-H/2);
    if(worldW<=W) cam.x=Math.round((worldW-W)/2); else cam.x=Math.max(0,Math.min(worldW-W,cam.x));
    if(worldH<=H) cam.y=Math.round((worldH-H)/2); else cam.y=Math.max(0,Math.min(worldH-H,cam.y));
  }

  function drawPrompt(){

  function drawBanner(msg, color){
    ctx.font="8px monospace";
    const words=String(msg).split(" "); const maxW=168; let lines=[], line="";
    words.forEach(w=>{ const test=line?line+" "+w:w; if(ctx.measureText(test).width>maxW){ lines.push(line); line=w; } else line=test; });
    if(line) lines.push(line);
    const bh=10+lines.length*10; const by=36;
    panelBox(W/2-88,by,176,bh);
    lines.forEach((l,i)=> textCenter(l, W/2, by+6+i*10, color));
  }

  function drawTitle(){
    // ---- NOIR TITLE SCREEN: night harbour, fog, a lone detective under a lamp ----
    // night sky gradient
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a1020"); g.addColorStop(0.55,"#141b2e"); g.addColorStop(0.72,"#0e1524"); g.addColorStop(1,"#060a12");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ---- WORLD RENDER ----
  function drawWorld(){
    const p=pal();
    ctx.fillStyle=p.grass; ctx.fillRect(0,0,W,H);
    const t0x=Math.floor(cam.x/TILE)-2, t0y=Math.floor(cam.y/TILE)-3;
    const t1x=Math.ceil((cam.x+W)/TILE)+2, t1y=Math.ceil((cam.y+H)/TILE)+2;
    // ground + shadow passes (always under everything)
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawGround(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawTileShadow(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y);

    // Collect movable entities with their tile-row for depth sorting.
    const ents=[];
    const push=(ty,fn)=> ents.push({ty,fn});
    if(inTown()){
      if(questState>=1 && !cat.found) push(cat.ty, ()=>drawCat(cat.tx*TILE-cam.x, cat.ty*TILE-cam.y, cat.animT));
      if(shellQuest>=1 && !shell.found) push(shell.ty, ()=>drawShell(shell.tx*TILE-cam.x, shell.ty*TILE-cam.y, shell.animT));
      if(QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && !ball.taken) push(ball.ty, ()=>drawBall(ball.tx*TILE-cam.x, ball.ty*TILE-cam.y));
      if(QUESTS.oldfriend.status==="active" && !keyring.taken) push(keyring.ty, ()=>drawKeyring(keyring.tx*TILE-cam.x, keyring.ty*TILE-cam.y));
      photos.forEach(ph=>{ if(!ph.taken && QUESTS.photos.status==="active") push(ph.ty, ()=>drawPhoto(ph.tx*TILE-cam.x, ph.ty*TILE-cam.y)); });
      animals.forEach(a=> push(Math.round(a.py/TILE), ()=>drawAnimal(a, a.px-cam.x, a.py-cam.y)));
    }
    // ambient fauna (all areas): ground critters depth-sorted; flyers/jumpers drawn on top later
    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="wander") push(Math.round(a.py/TILE), ()=>drawFaunaCritter(a, a.px-cam.x, a.py-cam.y)); });
    if(typeof currentClues==="function"){ currentClues().forEach(({c})=> push(c.ty, ()=>drawClue(c.tx*TILE-cam.x, c.ty*TILE-cam.y))); }
    if(typeof drawScourSpots==="function") drawScourSpots();
    if(tail.active && tail.target){ push(Math.round(tail.target.py/TILE), ()=>drawTail()); }
    if(chase.active && chase.target){ push(Math.round(chase.target.py/TILE), ()=>drawChase()); }
    currentNpcs().forEach(n=> push(Math.round(n.py/TILE), ()=>drawNpc(n, n.px-cam.x, n.py-cam.y)));
    if(areaKey==="mountain" && season==="winter") skiers.forEach(s=> push(Math.round(s.y/TILE), ()=>drawSkier(s)));
    push(Math.round(player.py/TILE), ()=>drawPlayer(player.px-cam.x, player.py-cam.y, player.dir, player.animT));
    // Bucket entities by row for interlacing with object rows.
    const byRow={}; ents.forEach(e=>{ (byRow[e.ty]=byRow[e.ty]||[]).push(e.fn); });

    // Interlaced pass: for each row (top->bottom) draw that row's object tiles, then the entities standing on that row.
    for(let ty=t0y;ty<=t1y;ty++){
      for(let tx=t0x;tx<=t1x;tx++) drawObject(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
      if(byRow[ty]) byRow[ty].forEach(fn=>fn());
    }

    if(inTown()){
      decor.forEach(d=> drawDecor(d, d.tx*TILE-cam.x, d.ty*TILE-cam.y));
      streetLamps.forEach(L=> drawLamp(L[0]*TILE-cam.x, L[1]*TILE-cam.y));
      drawShip(ship.tx*TILE-cam.x, ship.ty*TILE-cam.y);
    }
    if(areaKey==="industrial"||areaKey==="cape"){
      MOORED_BOATS.forEach(b=>{ if(b.area!==areaKey) return;
        if(b.kind==="galleon") drawShip(b.tx*TILE-cam.x, b.ty*TILE-cam.y);
        else drawAmbientShip({kind:b.kind,dir:"down"}, b.tx*TILE-cam.x, b.ty*TILE-cam.y);
      });
    }
    if(!insideKey) ships.forEach(s=>drawAmbientShip(s, s.px-cam.x, s.py-cam.y));   // Crudo Pirate: ambient boats on the water
    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="fly"||a.mode==="jump") drawFaunaCritter(a, a.px-cam.x, a.py-cam.y); });
    if(areaKey==="cape"){ drawLighthouse(2*TILE-cam.x, 30*TILE-cam.y); }   // lighthouse on the cape's south tip, by the rocks
    if(areaKey==="holiday"){
      drawPortFolk(holidayPortFolk);
      holidaySwimmers.forEach(s=> drawSwimmer(s.x-cam.x, s.y-cam.y, s.animT, s.dir));
      if(false){
        holidayBeachProps.forEach(bp=> drawBeachProp(bp, bp.tx*TILE-cam.x, bp.ty*TILE-cam.y));
        beachGames.forEach(g=>{
          // two kids facing each other + the ball
          drawBeachKid(g.kids[0][0]*TILE-cam.x, g.kids[0][1]*TILE-cam.y, 1, g.kind);
          drawBeachKid(g.kids[1][0]*TILE-cam.x, g.kids[1][1]*TILE-cam.y, -1, g.kind);
          drawBeachBall(g.ball.x-cam.x, g.ball.y-cam.y);
        });
      }
      // (the lighthouse now stands on the south tip of the Cape, not here)
    }
    currentBuoys().forEach(b=>{
      if(b.lamp){ const nf=nightFactor(); if(nf>0.25){ const bx=b.tx*TILE-cam.x, by=b.ty*TILE-cam.y;
        ctx.fillStyle="rgba(255,224,150,"+(0.16*nf).toFixed(3)+")"; ctx.fillRect(bx-6,by-6,TILE+12,TILE+12);
        ctx.fillStyle="rgba(255,240,190,"+(0.9*nf).toFixed(3)+")"; ctx.fillRect(bx+6,by+2,4,3); } }
      drawBuoy(b.tx*TILE-cam.x, b.ty*TILE-cam.y, b.animT);
    });
    if(inTown()){
      drawPortFolk(portFolk);
      swimmers.forEach(s=> drawSwimmer(s.x-cam.x, s.y-cam.y, s.animT, s.dir));
    }
    drawInteractHint();
  }
  function drawInteractHint(){
    if(dialog.active) return;
    const {fx,fy}=facingTile(); const n=npcAt(fx,fy); const fc=tileAt(fx,fy);
    const onCat=(!insideKey && questState>=1 && !cat.found && fx===cat.tx && fy===cat.ty);
    const onShell=(!insideKey && shellQuest>=1 && !shell.found && fx===shell.tx && fy===shell.ty);
    const onBall=(!insideKey && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && !ball.taken && fx===ball.tx && fy===ball.ty);
    const onKey=(!insideKey && QUESTS.oldfriend.status==="active" && !keyring.taken && fx===keyring.tx && fy===keyring.ty);
    const onPhoto=(!insideKey && QUESTS.photos.status==="active" && photos.some(ph=>!ph.taken && fx===ph.tx && fy===ph.ty));
    const onShip=(!insideKey && inTown() && Math.abs(fx-ship.tx)<=2 && Math.abs(fy-ship.ty)<=2);
    const onDoor=(!insideKey && ((inTown() && !!DOORS[fc]) || (!inTown() && /[1-9]/.test(fc) && AREA_INTERIOR[areaKey]))) || (insideKey && fc==="e");
    if(n||onCat||onShell||onBall||onKey||onPhoto||onShip||onDoor){ const bx=player.px-cam.x, by=player.py-cam.y; textOutlined("A",bx+6,by-8,"#fff","#000"); }
  }

  // --- Crudo Pirate: which areas render roads (=) as wood planks vs cobblestones ---
  const WOOD_ROAD_AREAS = new Set(["town","holiday","forestNW"]);   // Porto Franco, Baia dei Pirati, Valle dei Reietti
  const STONE_ROAD_AREAS = new Set(["industrial"]);                 // Borgo del Re (King's Borough)
  // Crudo Pirate (punto 3): areas whose houses use timber/shingle pirate-era buildings.
  const PIRATE_BUILD_AREAS = new Set(["town","holiday","forestNW","industrial"]);
  // Crudo Pirate: reusable cobblestone texture (screenshot 1). Small rounded stones + dark mortar.
  function drawCobbles(x,y,tx,ty){
    const winter=(season==="winter");
    ctx.fillStyle=winter?"#8f97a1":"#70747c"; ctx.fillRect(x,y,TILE,TILE);       // dark mortar bed
    const stone=winter?"#c6ccd2":"#a6aab2", stoneDk=winter?"#a4acb6":"#8a8e96";
    for(let r=0;r<3;r++) for(let cc=0;cc<3;cc++){
      const jx=((tx*7+ty*3+r*5+cc)%2), jy=((tx*3+ty*7+r+cc*5)%2);
      const bx=x+1+cc*5+jx, by=y+1+r*5+jy;
      ctx.fillStyle=((r+cc+tx+ty)%2)?stoneDk:stone; ctx.fillRect(bx,by,4,4);
      ctx.fillStyle="#ffffff1a"; ctx.fillRect(bx,by,4,1); ctx.fillRect(bx,by,1,3);
      ctx.fillStyle="#00000022"; ctx.fillRect(bx,by+3,4,1);
    }
  }
  function drawGround(c,x,y,tx,ty,p){
    // base
    if(c==="~"||c==="w"||c==="o"){ // sea
      ctx.fillStyle=p.water; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=p.waterDk; const w=(Math.floor(performance.now()/350)%2)*2;
      ctx.fillRect(x+2+w,y+5,6,1); ctx.fillRect(x+8-w,y+11,5,1);
      ctx.fillStyle="#ffffff28"; ctx.fillRect(x+3,y+3,3,1);
      return;
    }
    if(c==="a"){ // Crudo Pirate: shipwreck run aground on coastal rocks
      // water base with foam
      ctx.fillStyle=p.water; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#ffffff28"; ctx.fillRect(x+2,y+12,TILE-4,1);
      // dark rock under the hull
      ctx.fillStyle="#5a5e66"; ctx.fillRect(x+1,y+10,TILE-2,4);
      // tilted wooden hull (planks)
      ctx.fillStyle="#6a4a28"; ctx.fillRect(x+1,y+5,TILE-2,7);
      ctx.fillStyle="#4a3018"; ctx.fillRect(x+1,y+8,TILE-2,1); ctx.fillRect(x+1,y+10,TILE-2,1);
      ctx.fillStyle="#7c5a30"; ctx.fillRect(x+1,y+5,TILE-2,1);
      // broken mast leaning + tattered sail
      ctx.fillStyle="#3a2a18"; ctx.fillRect(x+5,y-4,1,10); ctx.fillRect(x+6,y-2,1,8);
      ctx.fillStyle="#c8bfa0"; ctx.fillRect(x+7,y-2,3,4);
      ctx.fillStyle="#a89a78"; ctx.fillRect(x+7,y,3,1);
      return; }
    if(c==="g"){ // rocky cliff (in the sea): water base + grey rock with foam
      ctx.fillStyle=p.water; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#6a6e76"; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
      ctx.fillStyle="#565a62"; ctx.fillRect(x+2,y+9,TILE-4,4);
      ctx.fillStyle="#8a8e96"; ctx.fillRect(x+3,y+2,5,3); ctx.fillRect(x+9,y+4,4,3);

      ctx.fillStyle="#00000018"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x+8,y,1,TILE);
      return;
    }
    if(c==="x"){ // plaza paving (light stone tiles)

    if(c==="!"){ // Crudo Pirate: wooden dock railing over water (solid; stops you falling off the pier)

    if(c==="j"){ // Crudo Pirate: ploughed crop field (King's Countryside) - walkable

    if(c==="y"){ drawCobbles(x,y,tx,ty); return; }   // Crudo Pirate: cobblestone street (Porto Franco / anywhere)

      ctx.fillStyle="#00000022"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x,y,1,TILE); return; }
    if(c==="g"){ ctx.fillStyle="#4c8a3a"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#5a9a44"; ctx.fillRect(x+3,y+3,3,2); ctx.fillRect(x+9,y+8,3,2);
      if(season==="autumn"){ctx.fillStyle="#9a8a3a";ctx.fillRect(x,y,TILE,TILE);} if(season==="winter"){ctx.fillStyle="#cad2da";ctx.fillRect(x,y,TILE,TILE);}

      if(season==="autumn"){ctx.fillStyle=(tx%2===0)?"#8a8a34":"#9a9a3c";ctx.fillRect(x,y,TILE,TILE);}
      if(season==="winter"){ctx.fillStyle="#d4dce4";ctx.fillRect(x,y,TILE,TILE);}

  // ---- tile sprites ----
  function drawTree(x,y,p){
    // trunk
    ctx.fillStyle=p.trunk; ctx.fillRect(x+6,y+11,4,5); ctx.fillStyle="#3a2a18"; ctx.fillRect(x+9,y+11,1,5);
    ctx.fillStyle=tint(p.trunk,20); ctx.fillRect(x+6,y+11,1,5);

    const top=y-6;
    ctx.fillStyle=p.treeDk;
    ctx.fillRect(x+3,top+2,10,12); ctx.fillRect(x+1,top+5,14,7); ctx.fillRect(x+5,top,6,3); ctx.fillRect(x+2,top+3,12,2);
    ctx.fillStyle=p.tree;
    ctx.fillRect(x+3,top+3,9,9); ctx.fillRect(x+4,top+1,7,3); ctx.fillRect(x+2,top+6,11,4);
    // volume: bright upper-left + shaded lower-right
    ctx.fillStyle=tint(p.tree,30); ctx.fillRect(x+3,top+2,5,4); ctx.fillRect(x+4,top+1,3,2);
    ctx.fillStyle=tint(p.treeDk,-14); ctx.fillRect(x+9,top+8,5,5);
    // leaf clumps by season
    if(season==="autumn"){ ctx.fillStyle="#e0a030"; ctx.fillRect(x+5,top+3,2,2); ctx.fillStyle="#f0c040"; ctx.fillRect(x+9,top+6,2,2); }
    else if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x+3,top+1,6,2); ctx.fillRect(x+9,top+3,3,2); }
    else { ctx.fillStyle=tint(p.tree,44); ctx.fillRect(x+5,top+3,2,2); }
  }

  function drawHouseRoof(x,y,p){
    const tx=Math.round((x+cam.x)/TILE), ty=Math.round((y+cam.y)/TILE); const v=vary(tx,ty)*14;
    // Crudo Pirate: wooden/shingle roofs (1650-1730) in the pirate ports & King's Borough
    if(PIRATE_BUILD_AREAS.has(areaKey)){

      // Crudo Pirate: King's Borough slate, Outcasts' shacks poor wood, Porto Franco red;
      // Borgo dei Pirati (holiday) = lively, COLOURFUL warm roofs (varied per building) from Porto Franco's palette
      let baseRoof;
      if(areaKey==="industrial") baseRoof="#7a5a4a";
      else if(areaKey==="forestNW") baseRoof="#8a7458";
      else if(areaKey==="holiday"){ const warm=["#a5462c","#c0692c","#b8863a","#9a5a34","#c8503a"]; baseRoof=warm[((tx*3+ty*5)>>>0)%warm.length]; }

      ctx.fillStyle="rgba(255,255,255,0.08)"; for(let i=3;i<TILE;i+=6) ctx.fillRect(x+i,top+1,1,15);
      ctx.fillStyle=tint(woodR,-36); ctx.fillRect(x-2,y+13,TILE+4,3);        // eave
      ctx.fillStyle="rgba(0,0,0,0.34)"; ctx.fillRect(x-1,y+16,TILE+2,1);     // strong ground shadow
      ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(x-1,top,1,16); ctx.fillRect(x+TILE,top,1,16);   // side outline

  function drawHouseWall(x,y,p,window){
    const tx=Math.round((x+cam.x)/TILE), ty=Math.round((y+cam.y)/TILE); const v=vary(tx,ty)*12;
    // Crudo Pirate: timber-plank facades (1650-1730) in the pirate ports & King's Borough
    if(PIRATE_BUILD_AREAS.has(areaKey)){
      const above0=tileAt(tx,ty-1); const bAbove=/[RCHWDABVSGJ1-9]/.test(above0);
      const top=bAbove?y:y-4;
      const wood=tint((areaKey==="industrial")?"#8a7a5a":"#9a6f3e", v), woodDk=tint((areaKey==="industrial")?"#5e4e34":"#5e3c1e",v);
      if(!bAbove){ ctx.fillStyle=woodDk; ctx.fillRect(x,top,TILE,3); }
      ctx.fillStyle=tint(wood,14); ctx.fillRect(x,top+3,TILE,(y+16)-(top+3));
      // horizontal plank lines
      ctx.fillStyle="rgba(0,0,0,0.18)"; for(let j=top+5;j<y+15;j+=4) ctx.fillRect(x,j,TILE,1);
      // corner posts (timber frame)
      ctx.fillStyle=woodDk; ctx.fillRect(x,top+3,1,(y+15)-(top+3)); ctx.fillRect(x+TILE-1,top+3,1,(y+15)-(top+3));
      ctx.fillStyle="rgba(0,0,0,0.24)"; ctx.fillRect(x,y+14,TILE,2);   // ground contact
      if(window){
        const wy=top+6;
        ctx.fillStyle="#3a2414"; ctx.fillRect(x+3,wy,10,8);            // dark wooden frame
        ctx.fillStyle="#5a3a1e"; ctx.fillRect(x+3,wy,10,1);
        ctx.fillStyle=(clock<0.25||clock>0.8)?"#ffd24a":"#3a5a70"; ctx.fillRect(x+4,wy+1,8,6);  // warm glow at night
        ctx.fillStyle="#2a1c10"; ctx.fillRect(x+8,wy+1,1,6); ctx.fillRect(x+4,wy+3,8,1);         // cross muntins
      }
      return;
    }
    const wall=tint(p.wall,v), wallDk=tint(p.wallDk,v);
    // Only rise above the tile if there's open space above (not a roof/wall of the same building).
    const above=tileAt(tx,ty-1);

      case "t": ctx.fillStyle="#7a5230"; ctx.fillRect(x+2,y+5,12,7); ctx.fillStyle="#5a3a1e"; ctx.fillRect(x+2,y+11,2,4); ctx.fillRect(x+12,y+11,2,4); break;
      case "c": ctx.fillStyle="#6a4a2a"; ctx.fillRect(x+5,y+6,6,4); ctx.fillRect(x+5,y+3,6,3); ctx.fillRect(x+5,y+10,2,4); ctx.fillRect(x+9,y+10,2,4); break;
      case "s": ctx.fillStyle="#5a3f28"; ctx.fillRect(x+1,y+1,14,14); ctx.fillStyle="#7a5838"; ctx.fillRect(x+2,y+3,12,2); ctx.fillRect(x+2,y+8,12,2); ctx.fillStyle="#c05040"; ctx.fillRect(x+3,y+5,2,3); ctx.fillStyle="#4080c0"; ctx.fillRect(x+6,y+5,2,3); ctx.fillStyle="#40a060"; ctx.fillRect(x+9,y+10,2,3); break;
      case "p": ctx.fillStyle="#5a3a1e"; ctx.fillRect(x+5,y+11,6,4); ctx.fillStyle="#3f7a2c"; ctx.fillRect(x+4,y+3,8,8); ctx.fillStyle="#6ab85a"; ctx.fillRect(x+6,y+4,3,3); break;

  // ---- SPRITES ----
  function outlineRect(x,y,w,h){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x-1,y-1,w+2,h+2); }
  // soft ground shadow (fake 3D grounding)
  function shadow(x,y,w,h){ ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x,y,w,h); ctx.fillStyle="rgba(0,0,0,0.12)"; ctx.fillRect(x-1,y,w+2,h); }
  // deterministic per-tile variation (-1,0,1) so identical buildings differ a little
  function vary(tx,ty){ const h=(tx*73856093 ^ ty*19349663)>>>0; return (h%3)-1; }
  function tint(hex,amt){ // amt in [-40..40] lightens/darkens
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  // Long directional shadow (light from NW -> shadow to SE) cast by "tall" tiles.
  const TALL_TILES=new Set(["T","b","H","W","R","C","D","A","B","V","S","G","J","L","P","Q","K"]);
  function isTall(c){ return TALL_TILES.has(c) || /[1-9]/.test(c); }
  function drawTileShadow(c,x,y){
    if(insideKey) return;
    if(!isTall(c)) return;
    // shadow projects down-right; length depends on "height" of the element
    const tall = (c==="T"||c==="R"||c==="C"||c==="A"||c==="J"||c==="K"||c==="S"); // roofs/tree crowns = taller
    const dx = tall?7:4, dy = tall?6:3;
    ctx.fillStyle="rgba(20,24,40,0.22)";
    // a slanted quad approximated by two offset rects
    ctx.fillRect(x+3+dx, y+6+dy, TILE-4, TILE-6);
    ctx.fillStyle="rgba(20,24,40,0.14)";
    ctx.fillRect(x+1+dx, y+8+dy, TILE-2, TILE-8);
  }

  // Shared human sprite: head + hair + torso + arms + legs, with an expressive walk cycle.
  function drawHuman(x,y,dir,walking,frame,o){
    x=Math.round(x); y=Math.round(y);
    const kind0=o.kind||"ym";
    // ---- CHILDREN (smaller sprite) ----
    if(kind0==="boy" || kind0==="girl"){
      const girlc=(kind0==="girl");
      const skinc=o.skin||"#f0c890";
      const hairc = girlc ? (o.hair||"#6a4a2a") : "#1a1a1a";   // boy: black; girl: castano
      const shirtc=o.shirt||"#e0483a", shirtDk=o.shirtDk||"#c0382c", bottom=o.pants||"#2a3a6a";
      const s=walking?(frame?1:-1):0;
      // ground shadow (smaller)
      ctx.fillStyle="rgba(0,0,0,0.26)"; ctx.fillRect(x+5,y+15,6,2);
      // legs / short skirt (child height: everything shifted down ~4px, shorter)
      if(girlc){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x+5,y+11,6,4); ctx.fillStyle=bottom; ctx.fillRect(x+5,y+11,6,3); ctx.fillRect(x+4,y+13,8,1);
        ctx.fillStyle=skinc; ctx.fillRect(x+5,y+14,2,1); ctx.fillRect(x+9,y+14,2,1); }
      else { ctx.fillStyle=bottom; if(s>=0){ ctx.fillRect(x+5,y+11,2,3); ctx.fillRect(x+9,y+11,2,2);} else { ctx.fillRect(x+5,y+11,2,2); ctx.fillRect(x+9,y+11,2,3);} // shorts (short)
        ctx.fillStyle=skinc; ctx.fillRect(x+5,y+13,2,1); ctx.fillRect(x+9,y+13,2,1);  // bare legs (shorts)
        ctx.fillStyle="#2a2028"; ctx.fillRect(x+5,y+14,2,1); ctx.fillRect(x+9,y+14,2,1); }
      // torso (small)
      outlineRect(x+5,y+6,6,5);
      ctx.fillStyle=shirtc; ctx.fillRect(x+5,y+6,6,5); ctx.fillStyle=tint(shirtc,20); ctx.fillRect(x+5,y+6,6,1); ctx.fillStyle=shirtDk; ctx.fillRect(x+5,y+9,6,1);
      // arms
      ctx.fillStyle=skinc; const a=walking?(frame?1:-1):0;
      if(dir==="left"||dir==="right"){ ctx.fillRect(x+(dir==="left"?4:10),y+7+a,2,3); }
      else { ctx.fillRect(x+4,y+7+a,1,4); ctx.fillRect(x+11,y+7-a,1,4); }
      // head (big-ish for a kid)
      outlineRect(x+5,y+1,6,5);
      ctx.fillStyle=skinc; ctx.fillRect(x+5,y+1,6,5); ctx.fillStyle=tint(skinc,18); ctx.fillRect(x+5,y+1,3,1);
      ctx.fillStyle=hairc; ctx.fillRect(x+5,y+1,6,2);
      if(girlc){ ctx.fillRect(x+4,y+1,1,5); ctx.fillRect(x+11,y+1,1,5); } else { ctx.fillRect(x+5,y+1,1,2); ctx.fillRect(x+10,y+1,1,2); }
      if(dir==="up"){ ctx.fillStyle=hairc; ctx.fillRect(x+5,y+1,6,3); }
      else if(dir==="down"){
        ctx.fillStyle="#0a0a12"; ctx.fillRect(x+6,y+4,1,1); ctx.fillRect(x+9,y+4,1,1);
        ctx.fillStyle="#a85050"; ctx.fillRect(x+7,y+5,2,1);   // little mouth
      } else if(dir==="left"){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x+6,y+4,1,1); ctx.fillStyle="#a85050"; ctx.fillRect(x+5,y+5,2,1); }
      else if(dir==="right"){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x+9,y+4,1,1); ctx.fillStyle="#a85050"; ctx.fillRect(x+9,y+5,2,1); }
      if(o.outfit==="coat"){ // small kid coat with sleeves
        ctx.fillStyle="#5a4a6a"; ctx.fillRect(x+5,y+6,6,6); ctx.fillStyle="#4a3a58"; ctx.fillRect(x+5,y+10,6,2);
        ctx.fillStyle="#5a4a6a"; if(dir==="left"||dir==="right"){ ctx.fillRect(x+(dir==="left"?4:10),y+7,2,4); } else { ctx.fillRect(x+4,y+7,1,4); ctx.fillRect(x+11,y+7,1,4); }
        ctx.fillStyle="#caa"; ctx.fillRect(x+6,y+6,4,1); }
      return;
    }
    // elliptical ground shadow
    ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(x+4,y+16,8,2); ctx.fillStyle="rgba(0,0,0,0.16)"; ctx.fillRect(x+3,y+16,10,1); ctx.fillRect(x+5,y+17,6,1);
    const kind=kind0;                                 // ym/yw/om/ow
    const female=(kind==="yw"||kind==="ow");
    const old=(kind==="om"||kind==="ow");
    const skin=o.skin||"#f0c890";
    let hair=o.hair||"#3a2a1a"; if(old) hair="#e8e8ec";   // elders: white hair
    const shirt=o.shirt||"#e0483a", shirtDk=o.shirtDk||"#c0382c", pants=o.pants||"#2a3a6a";
    const s = walking ? (frame?1:-1) : 0;
    if(female){
      // A-LINE SKIRT: narrow at the waist, flared at the hem (feminine silhouette)
      const sway = walking ? (frame?1:0) : 0;   // subtle hem sway while walking
      ctx.fillStyle="#0a0a12"; ctx.fillRect(x+2-sway,y+15,12+sway,2);          // hem outline
      ctx.fillStyle=pants;
      ctx.fillRect(x+6,y+10,4,2);                 // waist (narrow)
      ctx.fillRect(x+5,y+12,6,2);                 // upper skirt
      ctx.fillRect(x+3-sway,y+14,10+sway*2,2);    // flared hem
      ctx.fillStyle=tint(pants,18); ctx.fillRect(x+6,y+10,2,4);   // lit fold
      ctx.fillStyle=tint(pants,-18); ctx.fillRect(x+3-sway,y+15,10+sway*2,1);
      // slim legs peeking below the hem
      ctx.fillStyle=skin;
      if(s>=0){ ctx.fillRect(x+5,y+16,1,1); ctx.fillRect(x+10,y+16,1,1); } else { ctx.fillRect(x+6,y+16,1,1); ctx.fillRect(x+9,y+16,1,1); }
    } else {
      // trousers + stride
      ctx.fillStyle=pants;
      if(s===0){ ctx.fillRect(x+5,y+13,2,4); ctx.fillRect(x+9,y+13,2,4); }
      else if(s>0){ ctx.fillRect(x+4,y+13,2,4); ctx.fillRect(x+10,y+12,2,3); }
      else { ctx.fillRect(x+5,y+12,2,3); ctx.fillRect(x+9,y+13,2,4); }
      ctx.fillStyle="#2a2028";
      if(s===0){ ctx.fillRect(x+5,y+16,2,1); ctx.fillRect(x+9,y+16,2,1); }
      else if(s>0){ ctx.fillRect(x+3,y+16,2,1); ctx.fillRect(x+10,y+14,2,1); }
      else { ctx.fillRect(x+5,y+14,2,1); ctx.fillRect(x+10,y+16,2,1); }
    }
    // torso
    if(female){
      // hourglass: wider bust line, narrower waist
      outlineRect(x+5,y+7,6,6);
      ctx.fillStyle=shirt; ctx.fillRect(x+5,y+7,6,3);           // upper (bust) full width
      ctx.fillStyle=shirt; ctx.fillRect(x+6,y+10,4,3);          // waist narrower
      ctx.fillStyle=tint(shirt,22); ctx.fillRect(x+5,y+7,6,1);  // lit shoulders
      ctx.fillStyle=tint(shirt,-14); ctx.fillRect(x+5,y+9,2,1); ctx.fillRect(x+9,y+9,2,1); // bust shading
      ctx.fillStyle=shirtDk; ctx.fillRect(x+6,y+12,4,1);
    } else {
      outlineRect(x+5,y+7,6,6);
      ctx.fillStyle=shirt; ctx.fillRect(x+5,y+7,6,6);
      ctx.fillStyle=tint(shirt,20); ctx.fillRect(x+5,y+7,6,1);   // lit shoulders
      ctx.fillStyle=shirtDk; ctx.fillRect(x+5,y+11,6,2);
    }
    // arms: swing opposite to legs
    ctx.fillStyle=skin;
    if(dir==="left"||dir==="right"){
      const sw = walking ? (frame?2:-1) : 0;
      ctx.fillRect(x+(dir==="left"?3:11), y+8+sw, 2, 4);
    } else {
      const a = walking ? (frame?2:-2) : 0;
      ctx.fillRect(x+3, y+8+a, 2, 5); ctx.fillRect(x+11, y+8-a, 2, 5);
    }
    // head
    outlineRect(x+5,y+1,6,6);
    ctx.fillStyle=skin; ctx.fillRect(x+5,y+1,6,6);
    ctx.fillStyle=tint(skin,18); ctx.fillRect(x+5,y+1,3,2);   // lit cheek
    // hair (length by category)
    ctx.fillStyle=hair;
    if(female){
      // fuller top + hair framing the face, flowing down past the shoulders
      ctx.fillRect(x+4,y+0,8,3);                 // voluminous top
      ctx.fillRect(x+4,y+1,1,9); ctx.fillRect(x+11,y+1,1,9);  // long sides down to the torso
      ctx.fillRect(x+3,y+8,2,2); ctx.fillRect(x+11,y+8,2,2);  // waves widening at the ends
      ctx.fillRect(x+4,y+3,1,1); ctx.fillRect(x+11,y+3,1,1);  // side bangs framing the face
      if(kind==="ow"){ ctx.fillStyle=tint(hair,-8); ctx.fillRect(x+4,y+9,2,1); ctx.fillRect(x+10,y+9,2,1); } // a touch fuller
    } else { // short hair
      ctx.fillRect(x+5,y+1,6,2);
      ctx.fillRect(x+5,y+1,1,3); ctx.fillRect(x+10,y+1,1,3);
    }
    // old man: white beard on the lower face
    if(kind==="om" && dir!=="up"){ ctx.fillStyle="#e8e8ec"; ctx.fillRect(x+5,y+5,6,2); ctx.fillRect(x+6,y+6,4,1); }
    // face by direction: readable eyes (dark) + small mouth
    if(dir==="up"){ ctx.fillStyle=hair; ctx.fillRect(x+5,y+1,6,4); }
    else if(dir==="down"){
      ctx.fillStyle="#0a0a12"; ctx.fillRect(x+6,y+4,1,1); ctx.fillRect(x+9,y+4,1,1);     // two eyes
      if(kind!=="om"){ ctx.fillStyle="#a85050"; ctx.fillRect(x+7,y+6,2,1); }             // mouth
    } else if(dir==="left"){
      ctx.fillStyle="#0a0a12"; ctx.fillRect(x+6,y+4,1,1);

    } else if(dir==="right"){
      ctx.fillStyle="#0a0a12"; ctx.fillRect(x+9,y+4,1,1);
      if(kind!=="om"){ ctx.fillStyle="#a85050"; ctx.fillRect(x+9,y+6,2,1); }
    }
    if(o.outfit) drawOutfit(x,y,dir,walking,frame,o.outfit,o);
  }

  // Motor boat the player pilots in the open sea; white hull, bigger; bow light glows at night.
  function drawBoatV(x,y,dir,moving){
