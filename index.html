  // ---- HUD ----
  function firstActiveQuest(){
    // priority: active main quests in order, then active side quests
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active" && q.type==="main") return q; }
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active") return q; }
    return null;
  }
  // Crudo Merchant: punto-mondo (px,py) verso cui la FRECCIA-GUIDA punta. null se nessun bersaglio.
  // Ordine di priorita': bersaglio tutorial -> pickup missione (area corrente) -> NPC da consegnare
  // -> altrimenti il BORDO dell'area verso l'area di destinazione (via AREA_GRID).
  function areaEdgePoint(destKey){
    // direzione dall'area corrente verso destKey nella griglia -> punto sul bordo mappa corrente
    const gp=(typeof gridPosOf==="function")?gridPosOf(areaKey):[1,1];
    const dp=(typeof gridPosOf==="function")?gridPosOf(destKey):[1,1];
    let ex=(cur.w/2)*TILE, ey=(cur.h/2)*TILE;
    if(dp[0]<gp[0]) ex=1*TILE; else if(dp[0]>gp[0]) ex=(cur.w-2)*TILE;
    if(dp[1]<gp[1]) ey=1*TILE; else if(dp[1]>gp[1]) ey=(cur.h-2)*TILE;
    // aree isolate (opensea/island) o sud = mare -> punta a sud (verso la nave/mare)
    if(destKey==="opensea"||destKey==="island") ey=(cur.h-2)*TILE;
    return {px:ex, py:ey};
  }
  function npcWorldById(id){ const list=currentNpcs(); const n=list.find(x=>x&&x.id===id); return n?{px:n.px,py:n.py}:null; }
  function questTargetPoint(){
    if(insideKey) return null;
    // 0) QUEST INTRO (avvio storia): freccia verso Hawkins (available) o Moll (active).
    if(typeof QUESTS!=="undefined" && QUESTS.intro && QUESTS.intro.status!=="done"){
      const q=QUESTS.intro;
      const tgtId = (q.status==="active") ? (typeof INTRO!=="undefined"?INTRO.endNpc:"moll")
                                          : (typeof INTRO!=="undefined"?INTRO.startNpc:"hawkins");
      const w=npcWorldById(tgtId); if(w) return w;
      const P=window.STORY_POS && window.STORY_POS.npc && window.STORY_POS.npc[tgtId];
      if(P){ if(P[0]===areaKey) return {px:P[1]*TILE, py:P[2]*TILE}; return areaEdgePoint(P[0]); }
    }
    // 1) TUTORIAL
    if(typeof tutActive==="function" && tutActive()){
      const tg=(typeof tutTargetNpc==="function")?tutTargetNpc():null;
      if(tg){
        const w=npcWorldById(tg); if(w) return w;
        // fallback: posizione da STORY_POS (l'NPC potrebbe non essere in currentNpcs)
        const P=window.STORY_POS && window.STORY_POS.npc && window.STORY_POS.npc[tg];
        if(P){ if(P[0]===areaKey) return {px:P[1]*TILE, py:P[2]*TILE}; return areaEdgePoint(P[0]); }
      }
      const s=(typeof tutCur==="function")?tutCur():null;
      if(s==="sail") return { px:(cur.w/2)*TILE, py:(cur.h-2)*TILE };   // salpa: verso sud
      // durante i passi-edificio, punta all'insegna corrispondente
      const map={ shipyard:"shipyard", buy:"merchant", tavern:"tavern" };
      const act=map[s]; if(act && AREA_SIGNS[areaKey]){ const sg=AREA_SIGNS[areaKey].find(z=>z.act===act); if(sg) return {px:sg.tx*TILE, py:sg.ty*TILE}; }
      return null;
    }
    // 1b) IMPRESE DEL CAPITANO (serie 2): guida verso il luogo dove si compie l'impresa in sospeso,
    // ma solo se non c'e' una missione di storia attiva (che ha priorita', gestita piu' sotto).
    if(typeof tut2Active==="function" && tut2Active() && !firstActiveQuest()){
      const s=(typeof tut2Cur==="function")?tut2Cur():null;
      if(s){
        // impresa -> tipo di luogo: insegna (merchant/tavern/shipyard), NPC (crier) o il mare (naval)
        const SIGN_FOR={ sell:"merchant", prices:"merchant", route:"merchant", invest:"merchant", contract:"merchant", recruit:"tavern", upgrade:"shipyard" };
        if(s==="naval"){
          // verso il mare: se sei gia' in Mare Aperto niente freccia; altrimenti punta a sud (verso il mare)
          if(areaKey==="opensea") return null;
          return { px:(cur.w/2)*TILE, py:(cur.h-2)*TILE };
        }
        if(s==="bounty"){
          const w=npcWorldById("crier"); if(w) return w;
          if(areaKey!=="town") return areaEdgePoint("town");   // il Banditore e' a Porto Franco
          return null;
        }
        const act=SIGN_FOR[s];
        if(act){
          if(AREA_SIGNS[areaKey]){ const sg=AREA_SIGNS[areaKey].find(z=>z.act===act); if(sg) return {px:sg.tx*TILE, py:sg.ty*TILE}; }
          // insegna non presente qui -> guida verso Porto Franco (hub con tutte le funzioni)
          if(areaKey!=="town") return areaEdgePoint("town");
        }
        return null;
      }
    }
    // 2) MISSIONE case attiva
    const q=firstActiveQuest();
    if(q && q.type==="case" && window.CASE_REF){
      const cq=window.CASE_REF.byId[q.id]; const clue=window.CASE_REF.clues[q.id];
      const ready=(typeof caseClueReady==="function")?caseClueReady(q.id):true;
      if(!ready && cq && cq.pickup && clue && !clue.taken){
        if(clue.area===areaKey){ return {px:clue.tx*TILE, py:clue.ty*TILE}; }   // pickup qui
        return areaEdgePoint(clue.area);                                        // pickup altrove
      }
      if(ready){ // consegna: vai dal completeNpc
        const w=npcWorldById(q.completeNpc); if(w) return w;
        const P=window.STORY_POS && window.STORY_POS.npc && window.STORY_POS.npc[q.completeNpc];
        if(P){ if(P[0]===areaKey) return {px:P[1]*TILE, py:P[2]*TILE}; return areaEdgePoint(P[0]); }
      }
    }
    return null;
  }
  function activeQuestText(){
    // Crudo Merchant: durante gli ORDINI (tutorial), il box in alto a destra mostra l'ordine corrente.
    if(typeof tutActive==="function" && tutActive()){ const s=tutCur(); const m=t("tut_"+s); if(m && m!=="tut_"+s) return m; }
    // Seconda serie: IMPRESE DEL CAPITANO (checklist non lineare). Mostra l'impresa in sospeso solo se
    // non c'e' una missione di storia attiva da guidare (la storia ha priorita' nell'HUD).
    if(typeof tut2Active==="function" && tut2Active() && !firstActiveQuest()){
      const s=tut2Cur(); if(s){ const m=t("tut2_"+s); if(m && m!=="tut2_"+s) return t("tut2_progress").replace("#",tut2Count())+" - "+m; }
    }
    const q=firstActiveQuest();
    if(q){
      // ---- RED CASE QUEST: show the NEXT step based on progress, never a stale one ----
      if(q.type==="case" && typeof CASE_QUESTS!=="undefined" && CASE_QUESTS.has(q.id) && window.CASE_REF){
        const cq=window.CASE_REF.byId[q.id];
        const clue=window.CASE_REF.clues[q.id];
        const ready = (typeof caseClueReady==="function") ? caseClueReady(q.id) : true;
        // 1) clue/beat still to do -> guide to FIND it (step s1) + area + location hint
        if(!ready && cq && cq.pickup && clue && !clue.taken){
          const parts=[ t(q.steps[1]) || t(q.steps[q.step]) ];   // "find the ..." step
          const destArea=cq.pickup.area;
          if(destArea && destArea!==areaKey && !insideKey){ parts.push("\u25B6 "+(t("area_"+destArea)||destArea)); }
          const hint=t("cs_"+q.id+"_hint"); if(hint && hint!=="cs_"+q.id+"_hint") parts.push("("+hint+")");
          return parts.join("  ");
        }
        // 2) clue collected (or beat done) but quest not completed yet -> go report it
        if(ready){ return t("hud_report_clue"); }
        // fallback: current step
        return t(q.steps[q.step]);
      }
      // non-case active quest: show its current step
      return t(q.steps[q.step]);
    }
    // No quest currently ACTIVE. If the central story isn't finished and a red case is waiting to be
    // started (available), guide the player to look for the red "!" instead of showing a stale step.
    if(typeof CASE_QUESTS!=="undefined" && window.CASE_REF){
      const anyCaseAvailable = CASE.order.some(id=> QUESTS[id] && QUESTS[id].status==="available");
      const storyDone = (typeof caseAllDone==="function" && caseAllDone());
      if(anyCaseAvailable && !storyDone) return t("hud_find_red");
    }
    // any available (not yet started) main quest?
    for(const k of QORDER){ const qq=QUESTS[k]; if(qq.status==="available"&&qq.type==="main") return t(qq.nameK); }
    return t("q_none");
  }

  // Small compass / wind rose (N up). Purely atmospheric orientation aid.
  function drawCompass(cx,cy){
    const r=8;
    // dark disc + rim
    ctx.fillStyle="rgba(10,12,20,0.72)"; ctx.beginPath(); ctx.arc(cx,cy,r+1,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#c8b070"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    // 4-point star (rose): N-S red/white vertical, E-W grey horizontal
    ctx.fillStyle="#c85040"; ctx.beginPath(); ctx.moveTo(cx,cy-r+1); ctx.lineTo(cx-2,cy); ctx.lineTo(cx+2,cy); ctx.closePath(); ctx.fill();   // N (red)
    ctx.fillStyle="#e8ecf2"; ctx.beginPath(); ctx.moveTo(cx,cy+r-1); ctx.lineTo(cx-2,cy); ctx.lineTo(cx+2,cy); ctx.closePath(); ctx.fill();   // S (white)
    ctx.fillStyle="#9aa0aa"; ctx.beginPath(); ctx.moveTo(cx-r+1,cy); ctx.lineTo(cx,cy-2); ctx.lineTo(cx,cy+2); ctx.closePath(); ctx.fill();   // W
    ctx.beginPath(); ctx.moveTo(cx+r-1,cy); ctx.lineTo(cx,cy-2); ctx.lineTo(cx,cy+2); ctx.closePath(); ctx.fill();                           // E
    ctx.fillStyle="#1a1a26"; ctx.fillRect(cx-1,cy-1,2,2);   // hub
    // N label
    ctx.font="6px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#f0d840"; ctx.fillText("N",cx,cy-r-3); ctx.textAlign="left"; ctx.textBaseline="top";
  }
  // Contextual hint on the cult island: prompt to dock (in boat, facing the pier) or to re-board.
  // Crudo Merchant: UNIFIED "press A to land" hint — shown in ANY sea area whenever the boat is
  // TOUCHING a landing spot (pier 'w', raft deck 'd', beach/shore, or any walkable land tile).
  // Also shows "set sail" when on foot/swimming next to water. Covers piers, beaches, islands, rafts.
  function boatLandable(tx,ty){
    if(tx<0||ty<0||tx>=cur.w||ty>=cur.h) return false;
    const c=tileAt(tx,ty);
    if(c==="w"||c==="d") return true;                  // pier / raft deck
    const isWater = (c==="~"||(areaKey==="industrial"&&c==="q"));
    if(isWater) return false;
    if(typeof isMooredBlock==="function" && isMooredBlock(tx,ty)) return false;
    return !isSolid(tx,ty);                             // any walkable shore/land tile
  }
  function drawBoatLandHint(){
    if(dialog.active||confront.active||fight.active||battle.active||choice.active||prompt2.active) return;
    const {fx,fy}=facingTile();
    let msg=null;
    if(player.boat){
      const touching = boatLandable(fx,fy) || [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>boatLandable(player.tx+dx,player.ty+dy));
      if(touching) msg=t("hint_dock");
    } else {
      // on foot/swimming next to water -> can set sail
      const seaN=(tx,ty)=>{ const c=tileAt(tx,ty); return c==="~"||(areaKey==="industrial"&&c==="q"); };
      const nearSea = seaN(fx,fy) || [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>seaN(player.tx+dx,player.ty+dy));
      // also: standing near a MOORED boat (e.g. the cape pier) -> you can board/set sail with A
      let nearMoored=false;
      if(typeof MOORED_BOATS!=="undefined"){ for(const b of MOORED_BOATS){ if(b.area===areaKey && Math.abs(player.tx-b.tx)<=2 && Math.abs(player.ty-b.ty)<=2){ nearMoored=true; break; } } }
      if((nearSea||nearMoored) && !player.scooter) msg=t("hint_setsail");
    }
    if(!msg) return;
    panelBox(6,H-16,W-12,13); textCenter(msg, W/2, H-12, pal().accent);
  }

  function drawDialog(){ const bx=6,by=H-46,bw=W-12,bh=40; panelBox(bx,by,bw,bh);
    // portrait for story (red-quest) NPCs, shown at the left; text shifts right
    const showPortrait = dialog.npc && dialog.npc.id && (typeof isStoryNpc==="function") && isStoryNpc(dialog.npc) && (typeof introActiveFor!=="function" || true);
    const tx0 = showPortrait ? bx+30 : bx+6;   // text left margin
    if(showPortrait) drawPortrait(bx+5, by+8, dialog.npc);
    if(dialog.npc) text(t(dialog.npc.nameKey), tx0, by+3, pal().accent);
    const full=dialog.lines[dialog.idx]||"";
    const shown=full.substring(0,Math.floor(dialog.reveal));
    ctx.font="8px monospace"; const maxW=(bx+bw-8)-tx0;   // safe inner width (accounts for portrait)
    // word-wrap; if a single word is still too wide, break it by characters
    function fitWords(str){
      const out=[]; let line="";
      const push=()=>{ if(line){ out.push(line); line=""; } };
      str.split(" ").forEach(w=>{
        // break overly long words
        while(ctx.measureText(w).width>maxW){ let cut=w.length; while(cut>1 && ctx.measureText(w.slice(0,cut)).width>maxW) cut--;
          const part=w.slice(0,cut); if(line){ push(); } out.push(part); w=w.slice(cut); }
        const test=line?line+" "+w:w;
        if(ctx.measureText(test).width>maxW){ push(); line=w; } else line=test;
      });
      if(line) out.push(line);
      return out;
    }
    const lines=fitWords(shown);
    const maxRows=3; let ly=by+15;
    lines.slice(0,maxRows).forEach(l=>{ text(l,tx0,ly,"#f0f0e0"); ly+=10; });
    if(dialog.reveal>=full.length && Math.floor(performance.now()/400)%2===0) text((dialog.idx<dialog.lines.length-1)?"\u25BC":"\u25A0",bx+bw-14,by+bh-12,pal().accent); }

  function shipValues(){
    const ty=BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop;

    const pct=crewPct();

                 + NAVAL_RAM_BASE*PROW_TIERS[Math.min(4,s.prow)].dmg) * pct);               // Potere d'attacco
    const spd = Math.round(ty.speedMul*100*pct);                                            // Velocità
    const agi = Math.round(ty.agiMul*100*pct);                                              // Agilità

    return {def,atk,spd,agi,cap};

  function drawNightLights(nf){
    const t0x=Math.floor(cam.x/TILE)-2, t0y=Math.floor(cam.y/TILE)-3;
    const t1x=Math.ceil((cam.x+W)/TILE)+2, t1y=Math.ceil((cam.y+H)/TILE)+2;
    const a=Math.min(1,nf);
    // Crudo Merchant: NO artificial lights (lamps/windows) shown while at sea — in a boat or swimming,
    // or in any pure sea area. Keeps the seas dark and natural at night.
    const SEA_AREAS_NL = (areaKey==="opensea"||areaKey==="island"||areaKey==="mountain"||areaKey==="forestNW");
    if(player.boat || player.swimming || SEA_AREAS_NL) return;
    const noLamps=(areaKey==="mountain"||areaKey==="forestNE"||areaKey==="forestNW"||areaKey==="cape");   // Crudo Merchant: no lamp/window glow in North Sea, Natives' Archipelago, cursed NE woods & Lighthouse Cape
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++){
      const c=tileAt(tx,ty); const x=tx*TILE-cam.x, y=ty*TILE-cam.y;
      if(noLamps) continue;
      if(c==="L"){ // lamppost: soft warm pool of light
        ctx.fillStyle="rgba(255,214,120,"+(0.14*a)+")"; ctx.fillRect(x-8,y-4,TILE+16,TILE+20);
        ctx.fillStyle="rgba(255,224,150,"+(0.22*a)+")"; ctx.fillRect(x-3,y+0,TILE+6,TILE+10);
        ctx.fillStyle="rgba(255,240,190,"+(0.9*a)+")"; ctx.fillRect(x+6,y+2,4,3);   // bright bulb
      } else if(c==="W"||c==="V"){ // lit window
        ctx.fillStyle="rgba(255,210,110,"+(0.85*a)+")"; ctx.fillRect(x+5,y+5,6,6);
        ctx.fillStyle="rgba(255,225,150,"+(0.20*a)+")"; ctx.fillRect(x+2,y+2,12,12);
      }
    }
    // a couple of stars / moon glow at deep night could go here (kept subtle)
    // street-corner lamp glows (only in the town, where the lamp posts actually stand)

  // ================= CENTRAL STORY LOADER (data-driven, from window.STORY_DATA) =================
  // Builds the pirate story: quests (red markers), clue pickups, new NPCs and i18n strings
  // from the JSON produced offline. Casual quests stay untouched and separate.
  const CASE = { data:null, quests:[], byId:{}, order:[], clues:{}, closedUntil:{}, deduced:{}, reconstructed:{}, morals:{}, fought:{}, chaseCaught:{}, naval:{}, started:false, introDone:false };
  window.CASE_REF = CASE;
  (function loadStory(){
    const S = window.STORY_DATA, P = window.STORY_POS;
    if(!S || !S.quests){ return; }
    // --- inject the special "foot chase -> scooter reward" beat between case3 and case4 ---
    CASE.data = S;
    // 1) inject i18n strings for case quests + dialogues (keys namespaced with "cs_")
    function put(key, val){ if(val && val.it!==undefined) STR.it[key]=val.it; if(val && val.en!==undefined) STR.en[key]=val.en; }
    S.quests.forEach(q=>{
      put("cs_"+q.id+"_t", q.title);
      (q.steps||[]).forEach((st,i)=> put("cs_"+q.id+"_s"+i, st));
      put("cs_"+q.id+"_startb", q.start_banner);
      put("cs_"+q.id+"_doneb", q.done_banner);
      if(q.pickup && q.pickup.what) put("cs_"+q.id+"_clue", q.pickup.what);
      if(q.pickup && q.pickup.hint) put("cs_"+q.id+"_hint", q.pickup.hint);
    });
    // dialogues: key = cs_dlg_<npc>_<questId>_<state>
    S.dialogues.forEach(dl=>{ put("cs_dlg_"+dl.npc_id+"_"+dl.quest_id+"_"+dl.state, dl.lines); });
    // names for new npcs
    (S.new_npcs||[]).forEach(n=>{ if(n.name) put("cs_name_"+n.id, n.name); });

    // 2) build case quests into the engine (chained by order), mark them as CASE
    const sorted = S.quests.slice().sort((a,b)=>(a.order||0)-(b.order||0));
    sorted.forEach((q,idx)=>{
      const prev = idx>0 ? sorted[idx-1].id : null;
      QUESTS[q.id] = { id:q.id, chap:1, type:"case", nameK:"cs_"+q.id+"_t",
        steps:[ "cs_"+q.id+"_s0", "cs_"+q.id+"_s1" ], status:"locked", step:0, needs:prev,
        season:q.season, startNpc:q.start_npc, completeNpc:q.complete_npc,
        hasPickup: !!q.pickup, chase: !!q.chase };
      QORDER.push(q.id);
      CASE_QUESTS.add(q.id);
      CASE.order.push(q.id);
      CASE.byId[q.id] = q;
      // clue pickup state
      const pos = P && P.pickups && P.pickups[q.id];
      if(q.pickup && pos){ CASE.clues[q.id] = { area:pos[0], tx:pos[1], ty:pos[2], taken:false, animT:0 }; }
    });

    // 3) create the 3 new NPCs and place them
    const NPC_KIND = (look)=> look.age==="child" ? (look.sex==="f"?"girl":"boy") : (look.sex==="f"? (look.age==="old"?"ow":"yw") : (look.age==="old"?"om":"ym"));
    (S.new_npcs||[]).forEach(n=>{
      const pos = P && P.npc && P.npc[n.id];
      if(!pos) return;
      const [area,tx,ty]=pos;
      const lk = n.look || {};
      // distinctive default colors per story NPC (used when the look has no explicit shirt/hair),
      // so each dialogue portrait looks unique.
      const NPC_LOOK = {
        vedova:{shirt:"#3a3a44",shirtDk:"#24242c",hair:"#c8c8cc"},   // grey shawl, black dress, grey hair
        guardia:{shirt:"#2c5aa0",shirtDk:"#1e3e70",hair:"#3a2a1a"},  // blue work suit
        eremita:{shirt:"#6a4a2a",shirtDk:"#4a3018",hair:"#e2e2e6"},  // brown coat, white beard/hair
        custode:{shirt:"#3a3050",shirtDk:"#241e38",hair:"#2a2038"},  // dark hooded tunic
      };
      const dl = NPC_LOOK[n.id] || {};
      const npc = { id:n.id, tx:tx, ty:ty, dir:"down",
        color: lk.shirt || dl.shirt || "#7a8290", colorDk: lk.shirtDk || dl.shirtDk || "#4a5058", kind:NPC_KIND(lk), hairCol: lk.hair || dl.hair || "#3a2a1a",
        pants: lk.pants || "#3a3a44", outfitBase: lk.outfit || undefined, nameKey:"cs_name_"+n.id, caseNpc:true,
        lines:()=>{ const cl=caseLines(n.id); return cl || t("passerby_l"); }, onTalk:()=>caseOnTalk(n.id) };
      npc.px=npc.tx*TILE; npc.py=npc.ty*TILE;
      if(area==="town") npcs.push(npc);
      else { (AREA_NPCS[area]=AREA_NPCS[area]||[]).push(npc); }
    });
    // 3b) SAFETY NET: some NPCs are referenced by the story (quest start/complete or the INTRO) and have
    // a position in STORY_POS, but are NOT listed in new_npcs (e.g. Moll, the intro's end NPC). Without
    // this they would never be spawned and the quest that sends you to them would be uncompletable.
    (function ensureReferencedNpcs(){
      const need = new Set();
      sorted.forEach(q=>{ if(q.start_npc) need.add(q.start_npc); if(q.complete_npc) need.add(q.complete_npc); });
      // INTRO npcs (const INTRO is declared later in the file; use literals to avoid the temporal dead zone)
      need.add("hawkins"); need.add("moll");
      const exists = (id)=> npcs.some(n=>n&&n.id===id) || Object.keys(AREA_NPCS).some(k=>(AREA_NPCS[k]||[]).some(n=>n&&n.id===id));
      need.forEach(id=>{
        if(!id || exists(id)) return;
        const pos = P && P.npc && P.npc[id];
        if(!pos) return;
        const [area,tx,ty]=pos;
        // ensure a display name exists (fallback: capitalized id) so the dialog header isn't a raw key
        if(t("cs_name_"+id)==="cs_name_"+id){ STR.it["cs_name_"+id]=id.charAt(0).toUpperCase()+id.slice(1); STR.en["cs_name_"+id]=STR.it["cs_name_"+id]; }
        const npc = { id:id, tx:tx, ty:ty, dir:"down",
          color:"#7a3a5a", colorDk:"#54283e", kind:"yw", hairCol:"#3a2a1a", pants:"#54283e",
          nameKey:"cs_name_"+id, caseNpc:true,
          lines:()=>{ const cl=caseLines(id); return cl || t("passerby_l"); }, onTalk:()=>caseOnTalk(id) };
        npc.px=npc.tx*TILE; npc.py=npc.ty*TILE;
        if(area==="town") npcs.push(npc);
        else { (AREA_NPCS[area]=AREA_NPCS[area]||[]).push(npc); }
      });
    })();
    if(typeof snapNpcsOffWater==="function") snapNpcsOffWater();   // Crudo Merchant (point 4): keep story npcs off water/cliff too

    // 4) attach a case hook to EXISTING npcs involved in the story (without breaking casual lines)
    const involved = new Set();
    sorted.forEach(q=>{ involved.add(q.start_npc); involved.add(q.complete_npc); });
    function hook(list){ list.forEach(npc=>{ if(!involved.has(npc.id) || npc.caseNpc) return;
      const casualLines = npc.lines, casualTalk = npc.onTalk;
      npc.lines = ()=>{ const cl=caseLines(npc.id); return cl || (casualLines?casualLines():[""]); };
      npc.onTalk = (nn)=>{ if(introActiveFor(npc.id) || caseActiveFor(npc.id)){ caseOnTalk(npc.id); } else if(casualTalk){ casualTalk(nn); } };
    }); }
    hook(npcs); Object.values(AREA_NPCS).forEach(hook);
  })();

  // Which case quest (if any) this npc can act on right now (start available or ready-to-complete).
  function caseClosed(id){ const u=CASE.closedUntil[id]; return (u!=null && dayCount < u); }
  function caseActiveFor(npcId){
    for(const id of CASE.order){ const q=QUESTS[id]; if(!q) continue;
      if(q.startNpc===npcId && (q.status==="available")) return {id, mode:"start"};
      if(q.completeNpc===npcId && q.status==="active" && caseClueReady(id)){
        return { id, mode: caseClosed(id) ? "closed" : "complete" };
      }
      if(q.startNpc===npcId && q.status==="active" && !caseClueReady(id)) return {id, mode:"active"};
    }
    return null;
  }
  function caseClueReady(id){ const q=QUESTS[id]; if(!q) return true;
    if(q.chase){ return !!(CASE.chaseCaught && CASE.chaseCaught[id]); }   // chase must be caught first
    if(!q.hasPickup) return true; const c=CASE.clues[id]; return c? c.taken : true; }
  // A red "!" is shown to start or to complete; a "closed until tomorrow" witness shows no marker.
  function caseNpcHasQuest(npc){ const a=caseActiveFor(npc.id); return !!a && (a.mode==="start"||a.mode==="complete"); }
  function caseLines(npcId){
    const il=introLines(npcId); if(il) return il;
    const a=caseActiveFor(npcId); if(!a) return null;
    if(a.mode==="closed"){ return vpick("interro_wait"); }
    const st = a.mode==="complete" ? "done" : (a.mode==="active"?"active":"start");
    const key="cs_dlg_"+npcId+"_"+a.id+"_"+st;
    const v=t(key); return (v===key)? null : v;
  }
  function caseOnTalk(npcId){
    if(introActiveFor(npcId)){ introOnTalk(npcId); return; }
    const a=caseActiveFor(npcId); if(!a) return;
    const q=QUESTS[a.id];
    if(a.mode==="start"){ if(q.season && season!==q.season) setSeason(q.season);
      qStart(a.id);
      if(DISCOVER_ON_START[a.id]){ discoverArea(DISCOVER_ON_START[a.id]); }   // bridge quests reveal their target area
      saveGame(); }
    else if(a.mode==="closed"){ banner(vpick("interro_wait_b")); }
    else if(a.mode==="complete"){
      if(q.hasPickup){
        // climax beats use the phased CONFRONT; others use the simple interrogation
        const finishBeat = ()=>{
          if(CONFRONT_SNODI[a.id]){ startCaseConfront(a.id); }
          else { startInterrogation(a.id); }
        };
        // gate chain on key beats: reconstruction -> deduction -> confront/interrogation
        const runDeductionThen = ()=>{
          if(DEDUCTION_SNODI[a.id] && !CASE.deduced[a.id]){ startDeduction(a.id, finishBeat); }
          else { finishBeat(); }
        };
        const runReconThen = ()=>{
          if(RECON_SNODI[a.id] && !CASE.reconstructed[a.id]){ startReconstruction(a.id, runDeductionThen); }
          else { runDeductionThen(); }
        };
        // scripted fight first (rare, only on FIGHT_SNODI), if not already won
        if(NAVAL_SNODI[a.id] && !(CASE.naval && CASE.naval[a.id])){
          const cfg=NAVAL_SNODI[a.id]; const kind=(typeof cfg==="string")?cfg:cfg.k; const mode=(typeof cfg==="string")?"sink":cfg.m;
          startNaval(kind, (res)=>{
            if(res==="win"){ if(!CASE.naval)CASE.naval={}; CASE.naval[a.id]=1; const g=navalWinReward(kind); player.gold+=g; banner(t("bt_reward").replace("#",g)); saveGame(); runReconThen(); }
            else { const pen=navalLossPenalty(kind); player.gold=Math.max(0,player.gold-pen); CASE.closedUntil[a.id]=dayCount+1; banner(t("bt_lost").replace("#",pen)); showExamine(vpick("interro_fail")); saveGame(); }   // lost the sea battle -> try again
          }, {mode:mode});
          return;
        }
        if(FIGHT_SNODI[a.id] && !CASE.fought[a.id]){
          // Crudo Merchant: story duels are now TURN-BASED (Pokémon-style) so weapons & armour matter.
          startBattle(storyDuelEnemy(a.id), (res)=>{
            if(res==="win"||res==="parley"){
              CASE.fought[a.id]=true;
              // weapon rewards on specific duels
              const wr=DUEL_WEAPON_REWARD[a.id];
              if(wr){ if(wr==="cutlass") unlockWeapon(wr); else { if(player.weapons.indexOf(wr)<0){ player.weapons.push(wr); const m=PLAYER_MOVES.find(w=>w.id===wr); banner(t("wp_gift").replace("%", m?t(m.key):wr)); SFX.quest&&SFX.quest(); } } }
              if(DUEL_ARQUEBUS_TIP[a.id]){ setFlag("arquebusStocked"); banner(t("wp_arq_stock")); }
              saveGame(); runReconThen();
            } else {
              // lost or fled -> retry the duel next time you talk
              CASE.closedUntil[a.id]=dayCount+1; showExamine(vpick("interro_fail")); saveGame();
            }
          });
        }
        else { runReconThen(); }
      }
      else { qComplete(a.id); banner(t("cs_"+a.id+"_doneb")); saveGame(); afterCaseComplete(a.id); }
    }
  }
  // ---- MORAL CHOICES + ENDING: called after a case quest completes ----

  // Generic reconstruction core. items = [{key,label}] IN THE CORRECT chronological order.
  function runReconstruction(items, onWin, onFail){
    const correctOrder=items.map(x=>x.key);

      const remaining=items.filter(x=>!picked.includes(x.key));
      if(remaining.length===0){
        if(picked.join(",")===correctOrder.join(",")){ showExamine(vpick("recon_ok"), ()=>{ if(onWin) onWin(); }); saveGame(); }
        else { picked.length=0; showExamine(vpick("recon_no"), ()=>{ if(onFail) onFail(); }); }
        return;

      const title = picked.length===0 ? vpick("recon_first") : vpick("recon_next");
      askChoice(title, remaining.map(x=>({label:x.label, key:x.key})), (i,opt)=>{ picked.push(opt.key); step(); });

  function startDeduction(id, after){

    for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }

  // ---- SHADOWING / TAIL (light stealth): follow a suspect without being noticed ----

  // ---- SCOUR / SEARCH THE SCENE: find N hidden clue-spots in an area, guided by a hot/cold proximity bar ----

      const near=Math.max(0,1-Math.min(d,20)/20);
      ctx.fillStyle="#0a0a12"; ctx.fillRect(W-38,5,32,6);
      ctx.fillStyle= near>0.7?"#7ae06a":(near>0.35?"#e0d040":"#e05a5a");
      ctx.fillRect(W-37,6,Math.round(30*near),4);
    }
    if(chase.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(chase.msg,W/2,H-18,pal().accent); }
    else textCenter(t("chase_hint"),W/2,H-12,"#ffd0d0");
  }
  function drawClue(x,y){
    // small glowing evidence marker (folded paper / object)
    ctx.fillStyle="#0a0a12"; ctx.fillRect(x+4,y+6,8,7);
    ctx.fillStyle="#d8d0b0"; ctx.fillRect(x+5,y+7,6,5);
    ctx.fillStyle="#b83028"; ctx.fillRect(x+5,y+7,6,1);
    if(Math.floor(performance.now()/300)%2===0){ ctx.fillStyle="#ffcf50"; ctx.fillRect(x+7,y+4,2,2); }
  }

  // ---- INTRO (casual, yellow): Crudo arrives; marinaio sends him to the widow; talking to her
  //      completes the intro and unlocks the case + the casual quests. ----
  const INTRO = { startNpc:"hawkins", endNpc:"moll" };
  function introActiveFor(npcId){
    const q=QUESTS.intro; if(!q) return null;
    if(npcId===INTRO.startNpc && q.status==="available") return "start";
    if(npcId===INTRO.startNpc && q.status==="active") return "active";
    if(npcId===INTRO.endNpc && q.status==="active") return "end";
    return null;
  }
  function introLines(npcId){
    const m=introActiveFor(npcId); if(!m) return null;
    const key = m==="end" ? "intro_end" : (m==="active" ? "intro_wait" : "intro_start");
    const v=t(key); return (v===key)? null : v;
  }
  function introOnTalk(npcId){
    const m=introActiveFor(npcId); if(!m) return false;
    if(typeof tutOnStoryTalk==="function") tutOnStoryTalk();
    if(m==="start"){
      qStart("intro"); saveGame();
      // explain the marker system, then ask if understood; "no" repeats the explanation.
      const explainThenAsk=()=>{
        showExamine([].concat(t("intro_marks"), t("intro_marks2")), ()=>{
          askYesNo(t("intro_understood_q"), ()=>{
            showExamine(t("intro_go_widow"));   // YES -> go to the widow
          }, ()=>{
            explainThenAsk();                    // NO -> explain again + ask again
          });
        });
      };
      explainThenAsk();
      return true;
    }
    if(m==="end"){ qComplete("intro"); unlockCasualQuests(); unlockAfterIntro(); banner(t("intro_done")); saveGame(); return true; }
    return true; // "active": marinaio just repeats, no state change
  }
  function introNpcHasMark(npcId){ const m=introActiveFor(npcId); return m==="start"||m==="end"; }
  function unlockAfterIntro(){
    if(CASE.introDone) return; CASE.introDone=true;
    const first = CASE.order[0]; if(first && QUESTS[first]) QUESTS[first].status="available";
    if(typeof sqActivate==="function") sqActivate();   // unlock casual side-quests now
    saveGame();
  }

  // ================= SIDE-QUEST SLOT ENGINE (casual yellow quests, self-contained) =================
  const SQ_KINDS = ["recon","morale","confront","tail","fight","courier"];
  const SLOTS_PER_KIND = 1;   // one active side-quest per kind at a time (6 kinds pre-scooter, 7 after unlock),
                              // rotated by the slot engine. While one yellow is ACCEPTED/in progress
                              // (SQ.acceptedNpc set) all OTHER yellow markers hide, in-game and on the map.
  const SQ = { pool:{}, queueIdx:{}, active:[], done:{}, byNpc:{}, acceptedNpc:null, log:[] };
  SQ_KINDS.forEach(k=>{ SQ.pool[k]=[]; SQ.queueIdx[k]=0; });
  function sqLoadPool(){
    const src = window.SIDEQUESTS || null;
    // Crudo Merchant: only REAL side-quests from window.SIDEQUESTS. If none are defined, the pool stays
    // empty (no placeholder "..." junk missions). The hand-authored micro-quests still run normally.
    SQ_KINDS.forEach(k=>{ SQ.pool[k] = (src && src[k]) ? src[k].slice() : []; });
  }
  // NPCs that are already dedicated micro-quest givers/receivers: they must NEVER also receive an SQ
  // side-quest (no "double hat" -> a single yellow source per NPC).
  const MICRO_GIVER_NPCS = new Set(["nonna","pino","boy","girl","fornaio","marinaio","nico","mamma"]);
  function sqCandidateNpcs(area){
    const all=[];
    if(!area || area==="town"){ npcs.forEach(n=>{ if(n) n._area="town"; all.push(n); }); }
    for(const ak in AREA_NPCS){ (AREA_NPCS[ak]||[]).forEach(n=>{ if(n){ n._area=ak; all.push(n); } }); }
    let list = all.filter(n=> n && n.id && !n.caseNpc && !n.fishing && !MICRO_GIVER_NPCS.has(n.id));
    if(area) list = list.filter(n=> n._area===area);
    return list;
  }
  function npcBusy(npcId){
    if(typeof caseActiveFor==="function" && caseActiveFor(npcId)) return true;
    if(typeof introActiveFor==="function" && introActiveFor(npcId)) return true;
    if(SQ.byNpc[npcId]) return true;
    return false;
  }
  function sqActivate(){
    // casual side-quests unlock only AFTER the intro is completed
    if(!(window.CASE_REF && window.CASE_REF.introDone)) return;
    SQ_KINDS.forEach(kind=>{
      let activeOfKind = SQ.active.filter(m=>m.kind===kind).length;
      while(activeOfKind < SLOTS_PER_KIND && SQ.queueIdx[kind] < SQ.pool[kind].length){
        const m = SQ.pool[kind][SQ.queueIdx[kind]++];
        if(SQ.done[m.id]) continue;
        let npcId = m.npcId;
        if(!npcId || npcBusy(npcId)){
          // prefer a free NPC in the mission's own area, else any free NPC
          let free = sqCandidateNpcs(m.area).find(n=>!npcBusy(n.id));
          if(!free) free = sqCandidateNpcs().find(n=>!npcBusy(n.id));
          if(!free){ SQ.queueIdx[kind]--; break; }
          npcId = free.id;
        }
        m._npc = npcId; SQ.byNpc[npcId]=m; SQ.active.push(m); activeOfKind++;
      }
    });
  }
  function sqNpcMission(npcId){ return SQ.byNpc[npcId] || null; }
  function sqComplete(m){
    SQ.done[m.id]=true; SQ.active = SQ.active.filter(x=>x!==m); if(m._npc) delete SQ.byNpc[m._npc];
    // chronological log for the Journal's "completed micro-quests" list
    if(!SQ.log) SQ.log=[];
    if(!SQ.log.some(e=>e.id===m.id)){
      SQ.log.push({ id:m.id, kind:m.kind, title:(m.title||{it:m.id,en:m.id}), giver:(m.giver||null) });
    }
    saveGame(); sqActivate();
  }
  // true if a casual side-quest activity is currently in progress (one yellow at a time)
  function sqBusy(){
    if(typeof courier!=="undefined" && courier.active) return true;
    if(tail.active && tail.id===null) return true;      // a casual tail is running
    if(chase.active && chase.id===null) return true;    // a casual scooter chase is running
    if(confront.active || fight.active || battle.active || naval.active || choice.active || fishing.active) return true;
    return false;
  }
  function sqStart(m){
    if(sqBusy() || SQ.acceptedNpc){ banner(t("sq_busy")); return; }   // finish the current yellow quest first
    // mark this yellow quest as accepted/in-progress: hides ALL other yellow markers (game + map)
    SQ.acceptedNpc = m._npc || null;
    const release = ()=>{ SQ.acceptedNpc=null; };
    const win = ()=>{ release(); banner(t("sq_done")); sqComplete(m); };
    const fail = (msgKey)=>{ release(); banner(t(msgKey||"sq_fail")); saveGame(); };
    if(m.kind==="morale"){
      askChoice((m.q&&m.q[lang])||"...", [ {label:(m.a&&m.a[lang])||"A",key:"A"}, {label:(m.b&&m.b[lang])||"B",key:"B"} ], ()=>{ showExamine(vpick("moral_after"), win); });
    } else if(m.kind==="recon"){
      const items=(m.events||[]).map((e,i)=>({key:"e"+i, label:trim((e[lang]||e.it||"")) }));
      runReconstruction(items, win, ()=>fail());
    } else if(m.kind==="confront"){
      const opts=(m.args||[]).map(a=>({label:trim((a.t&&a.t[lang])||""), good:!!a.good}));
      confront.caseId=null;
      runConfront(opts, win, ()=>fail(), (m.intro&&m.intro[lang]));
    } else if(m.kind==="tail"){
      runTailCfg(m.tail, win, ()=>fail());
    } else if(m.kind==="fight"){
      startFight("sq_"+m.id, win);
    } else if(m.kind==="courier"){
      startCourier(m, win, ()=>fail());
    } else { win(); }
  }
  // ---- COURIER side-quest: cross-map timed delivery on foot (reach a target in ANOTHER area) ----
  const courier={ active:false, area:"", tx:0, ty:0, t:0, tmax:1, onWin:null, onFail:null, msg:"", msgT:0 };
  function startCourier(m, onWin, onFail){
    courier.active=true; courier.area=m.to[0]; courier.tx=m.to[1]; courier.ty=m.to[2];
    courier.t=m.time||70; courier.tmax=m.time||70; courier.onWin=onWin; courier.onFail=onFail;
    courier.msg=t("cr_go"); courier.msgT=2.4;
  }
  function updateCourier(dt){
    if(!courier.active) return;
    if(courier.msgT>0) courier.msgT-=dt;
    courier.t-=dt;
    if(areaKey===courier.area && !insideKey && Math.abs(player.tx-courier.tx)+Math.abs(player.ty-courier.ty)<=1){
      courier.active=false; showExamine([t("cr_done")], courier.onWin); return;
    }
    if(courier.t<=0){ courier.active=false; showExamine([t("cr_toolate")], courier.onFail); return; }
  }
  function drawCourierUI(){
    if(!courier.active) return;
    text(t("cr_label"),8,6,"#ffe0a0");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#3a2e1a"; ctx.fillRect(8,16,W-16,6);
    const frac=Math.max(0,Math.min(1,courier.t/courier.tmax)); ctx.fillStyle=frac<0.3?"#d83a3a":"#e0a840"; ctx.fillRect(8,16,Math.round((W-16)*frac),6);
    // destination hint (area name), and whether you are in the right area
    const dest=(t("area_"+courier.area)||courier.area);
    const here=(areaKey===courier.area);
    if(courier.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(courier.msg,W/2,H-18,pal().accent); }
    else { panelBox(6,H-22,W-12,18); textCenter((here?t("cr_here"):t("cr_to")+" "+dest),W/2,H-18, here?"#7ae06a":pal().accent); }
  }
  function runTailCfg(cfg, onWin, onFail){
    tail.active=true; tail.id=null; tail.suspicion=0; tail.msg=t("tail_intro"); tail.msgT=2.4;
    tail._onWin=onWin; tail._onFail=onFail;
    tail.target={ px:cfg.from[0]*TILE, py:cfg.from[1]*TILE, dir:"down", animT:0, dest:cfg.to.slice(), speed:cfg.speed||16, path:null, replan:0, tgt:null };
  }
  function serializeSQ(){ return { done:SQ.done, qi:SQ.queueIdx, log:SQ.log||[] }; }
  function restoreSQ(o){ if(!o) return; if(o.done) SQ.done=o.done; if(o.qi) SQ.queueIdx=o.qi; SQ.log=o.log||[]; }
  function sqInit(){ sqLoadPool(); SQ.active=[]; SQ.byNpc={}; SQ.acceptedNpc=null; if(!SQ.log) SQ.log=[]; sqActivate(); }
  window.SQ_REF = SQ;

  // ================= TEST HOOK (headless harness only; inert in normal play) =================
  // Exposes internal state for the Node regression suite. Never used by gameplay.
  window.__CRUDO_TEST__ = {
    get STR(){ return STR; }, get AREAS(){ return AREAS; }, get AREA_GRID(){ return AREA_GRID; },
    get QUESTS(){ return QUESTS; }, get TUT_STEPS(){ return TUT_STEPS; }, get tut(){ return tut; },
    t: (k)=>t(k), get lang(){ return lang; },
    get player(){ return player; }, get npcs(){ return npcs; }, get AREA_NPCS(){ return AREA_NPCS; },
    get areaKey(){ return areaKey; },
    get screen(){ return screen; }, setScreen: (s)=>{ screen=s; },
    update: (dt)=>update(dt), draw: ()=>draw(),
    useArea: (k)=>{ if(AREAS[k]){ areaKey=k; useMap(AREAS[k]); return true; } return false; },
    talkTo: (n)=>{ try{ if(n && typeof n.onTalk==="function") n.onTalk(n); if(n && typeof n.lines==="function") n.lines(); return true; }catch(e){ return e; } },
    get TUT2_STEPS(){ return TUT2_STEPS; }, get tut2(){ return tut2; },
    get GUIDE_PAGES(){ return GUIDE_PAGES; }, get RULES_PAGES(){ return RULES_PAGES; }, get MENU_KEYS(){ return MENU_KEYS; },
    get learned(){ return learned; }, teachOnce: (k,cb)=>teachOnce(k,cb),
    tut2Start: ()=>tut2Start(), tut2Do: (k)=>tut2Do(k), tut2Count: ()=>tut2Count(), tut2Cur: ()=>tut2Cur(),
    // economy access (diagnostics)
    get market(){ return (typeof market!=="undefined")?market:null; },
    get TRADE_GOODS(){ return (typeof TRADE_GOODS!=="undefined")?TRADE_GOODS:null; },
    get TRADE_PORTS(){ return (typeof TRADE_PORTS!=="undefined")?TRADE_PORTS:null; },
    get TRADE_HUBS(){ return (typeof TRADE_HUBS!=="undefined")?TRADE_HUBS:null; },
    goodPrice: (p,gid)=>(typeof goodPrice==="function"?goodPrice(p,gid):null),
    marketNudge: (p,gid,d)=>(typeof marketNudge==="function"?marketNudge(p,gid,d):null),
    investProd: (p,gid)=>(typeof investProd==="function"?investProd(p,gid):null),
    marketInit: ()=>(typeof marketInit==="function"?marketInit():null),
    marketTick: (dt)=>(typeof marketTick==="function"?marketTick(dt):null),
    // story access (diagnostics)
    get QORDER(){ return (typeof QORDER!=="undefined")?QORDER:null; },
    get CASE(){ return window.CASE_REF||null; },
    qStart: (id)=>(typeof qStart==="function"?qStart(id):null),
    qComplete: (id)=>(typeof qComplete==="function"?qComplete(id):null),
    afterCaseComplete: (id)=>(typeof afterCaseComplete==="function"?afterCaseComplete(id):null),
    // state
    get contract(){ return (typeof contract!=="undefined")?contract:null; },
    get route(){ return (typeof route!=="undefined")?route:null; },
    get crew(){ return (typeof crew!=="undefined")?crew:null; },
    get fame(){ return (typeof fame!=="undefined")?fame:null; },
    resetProgress: ()=>(typeof resetProgress==="function"?resetProgress():null),
    questTargetPoint: ()=>(typeof questTargetPoint==="function"?questTargetPoint():null),
    tutTargetNpc: ()=>(typeof tutTargetNpc==="function"?tutTargetNpc():null),
  };

  // ================= LOOP =================
  let last=performance.now();
  function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1; SFX.setTempoScale(1.0); update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
