<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const W = 192, H = 168, TILE = 16;

  // ================= INPUT =================
  const keys = { up:false, down:false, left:false, right:false, a:false, b:false, start:false, select:false };
  const pressedEdge = {}; const heldSince = {};
  function setKey(k, val){ if(!(k in keys)) return;
    if(val && !keys[k]){ pressedEdge[k]=true; heldSince[k]=performance.now(); SFX.unlock(); if(SFX[k]) SFX[k](); }
    keys[k]=val; }
  function consumePress(k){ if(pressedEdge[k]){ pressedEdge[k]=false; return true; } return false; }
  const keyMap = { ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
    KeyW:"up",KeyS:"down",KeyA:"left",KeyD:"right", KeyZ:"a",KeyX:"b",KeyK:"a",KeyL:"b",
    Enter:"start",ShiftRight:"select",ShiftLeft:"select" };
  window.addEventListener("keydown", e=>{ const k=keyMap[e.code]; if(k){ setKey(k,true); e.preventDefault(); } });
  window.addEventListener("keyup", e=>{ const k=keyMap[e.code]; if(k){ setKey(k,false); e.preventDefault(); } });
  document.querySelectorAll("[data-key]").forEach(btn=>{
    const k=btn.getAttribute("data-key");

  // clock in [0,1): 0=midnight, 0.25=6am, 0.5=noon, 0.75=6pm. One full day = DAY_LEN seconds.
  let clock=0.35;                 // start mid-morning
  const DAY_LEN=180;              // seconds for a full day/night cycle
  let dayCount=0;                 // whole days elapsed (advances when the clock passes midnight)
  let seasonAutoTimer=0;          // seasons rotate every SEASON_AUTO_SECS of effective play
  const SEASON_AUTO_SECS=300;     // 5 minutes of effective play per season
  function advanceClock(dt){ const nc=clock+dt/DAY_LEN; if(nc>=1){ dayCount+=Math.floor(nc); } clock=nc%1; }
  // 0 = full day, 1 = deep night (used for tinting + lit windows)
  function nightFactor(){
    // dark between ~19:30 (0.81) and ~5:30 (0.23), smooth transitions
    const h=clock;
    if(h>0.27 && h<0.75) return 0;                 // daytime
    if(h>=0.75 && h<0.83) return (h-0.75)/0.08;    // dusk
    if(h>=0.83 || h<0.19) return 1;                // night
    return 1-((h-0.19)/0.08);                      // dawn
  }
  function clockLabel(){ const mins=Math.floor(clock*24*60); const hh=String(Math.floor(mins/60)).padStart(2,"0"); const mm=String(mins%60).padStart(2,"0"); return hh+":"+mm; }

  // Crudo Merchant: find the nearest DOCK tile ('w') around a given tile, scanning a small radius.
  // Returns {tx,ty} of the closest walkable dock tile, or null if none is nearby. This lets the player
  // disembark from the boat whenever they're TOUCHING the pier, even if the exact facing tile is a
  // fence '!', open water '~', or blocked by a moored boat (fixes "stuck floating at the pier" bug).
  function nearestDockTile(fromTx, fromTy, radius){
    radius = radius||2;
    let best=null, bestD=Infinity;
    for(let dy=-radius; dy<=radius; dy++){
      for(let dx=-radius; dx<=radius; dx++){
        const tx=fromTx+dx, ty=fromTy+dy;
        if(tileAt(tx,ty)!=="w") continue;          // 'w' = walkable pier/dock tile
        if(isMooredBlock(tx,ty)) continue;          // don't land onto a tile covered by a moored hull
        const d=Math.abs(dx)+Math.abs(dy);
        if(d<bestD){ bestD=d; best={tx,ty}; }
      }
    }
    return best;
  }

  // ================= WEATHER (particles ~50% duty per season) =================
  // spring=wind (drifting petals/breeze), autumn=rain, winter=snow. summer=clear.
  const weather = { on:false, timer:0, phase:6, particles:[] };
  function weatherKind(){ if(season==="winter") return "snow"; if(season==="autumn") return "rain"; if(season==="spring") return "wind"; return "none"; }
  function resetWeather(){ weather.particles.length=0; weather.on=false; weather.timer=0; weather.phase=3+Math.random()*4; }
  function spawnParticles(kind){
    weather.particles.length=0;
    const n = kind==="rain"?70 : kind==="snow"?55 : kind==="wind"?26 : 0;
    for(let i=0;i<n;i++){
      weather.particles.push({ x:Math.random()*(W+40)-20, y:Math.random()*H, s:Math.random()*0.6+0.7, o:Math.random()*Math.PI*2 });
    }
  }
  function updateWeather(dt){
    const kind=weatherKind();
    if(kind==="none"){ weather.on=false; weather.particles.length=0; return; }
    weather.timer+=dt;
    if(weather.timer>=weather.phase){ // toggle on/off -> ~50% duty
      weather.timer=0; weather.phase=4+Math.random()*4; weather.on=!weather.on;
      if(weather.on) spawnParticles(kind); else weather.particles.length=0;
    }
    if(!weather.on) return;
    for(const p of weather.particles){
      if(kind==="rain"){ p.y+=dt*220*p.s; p.x+=dt*40; }
      else if(kind==="snow"){ p.o+=dt*2; p.y+=dt*38*p.s; p.x+=Math.sin(p.o)*dt*22; }
      else if(kind==="wind"){ p.o+=dt*3; p.x+=dt*70*p.s; p.y+=Math.sin(p.o)*dt*18; }
      if(p.y>H+4){ p.y=-4; p.x=Math.random()*(W+40)-20; }
      if(p.x>W+20){ p.x=-20; p.y=Math.random()*H; }
    }
  }
  function drawWeather(){
    if(!weather.on) return;
    const kind=weatherKind();
    if(kind==="rain"){
      ctx.strokeStyle="rgba(180,210,240,0.6)"; ctx.lineWidth=1;
      ctx.beginPath();
      for(const p of weather.particles){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+5); }
      ctx.stroke();
      ctx.fillStyle="rgba(40,60,90,0.10)"; ctx.fillRect(0,0,W,H);
    } else if(kind==="snow"){
      ctx.fillStyle="rgba(255,255,255,0.92)";
      for(const p of weather.particles){ const s=p.s>1.1?2:1; ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s); }
    } else if(kind==="wind"){
      // breeze streaks + a few drifting petals/leaves
      ctx.strokeStyle="rgba(255,255,255,0.22)"; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+8,p.y-1); }
      ctx.stroke();
      const petal = season==="spring" ? "#f6b8d6" : "#e0a030";
      for(let i=1;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.fillStyle=petal; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); }
    }
  }

  // ================= FOG (rolling banks, all seasons, ~independent duty) =================
  // Drifting fog banks that roll in and out regardless of season, for a noir atmosphere.
  const fog = { banks:[], intensity:0, target:0, timer:0, phase:8 };
  function resetFog(){ fog.banks.length=0; fog.intensity=0; fog.target=0.9; fog.timer=0; fog.phase=6+Math.random()*4;
    for(let i=0;i<12;i++){
      fog.banks.push({ x:Math.random()*(W+120)-60, y:Math.random()*H, s:Math.random()*0.6+0.7,
        vx:5+Math.random()*10, w:44+Math.random()*70, h:16+Math.random()*20, o:Math.random()*Math.PI*2 });
    }
  }
  function updateFog(dt){
    // toggle target intensity in/out (~50% duty) so banks roll through then thin out
    fog.timer+=dt;
    if(fog.timer>=fog.phase){ fog.timer=0; fog.phase=7+Math.random()*6; fog.target = fog.target>0.4 ? 0.0 : 0.9; }
    // ease current intensity toward target
    fog.intensity += (fog.target-fog.intensity)*Math.min(1,dt*0.6);
    for(const b of fog.banks){
      b.o+=dt*0.25; b.x+=dt*(b.vx*(0.6+b.s*0.6)); b.y+=Math.sin(b.o)*dt*3;
      if(b.x-b.w>W+60){ b.x=-b.w-Math.random()*40; b.y=Math.random()*H; }
    }
  }
  function drawFog(){
    if(fog.intensity<=0.01) return;
    const gi=fog.intensity;
    // low uniform haze
    ctx.fillStyle="rgba(158,170,180,"+(0.12*gi).toFixed(3)+")"; ctx.fillRect(0,0,W,H);
    // drifting banks
    for(const b of fog.banks){
      ctx.fillStyle="rgba(184,196,204,"+((0.05+0.05*b.s)*gi).toFixed(3)+")";
      ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h));
    }
  }

  function text7(str,x,y,color){ ctx.fillStyle=color||"#f0f0e0"; ctx.font="7px monospace"; ctx.textBaseline="top"; ctx.fillText(str,x,y); ctx.font="8px monospace"; }
  // Crudo Merchant: pixel-accurate word-wrap drawer. Splits `str` to fit within maxW px, breaking overly
  // long words by characters, and draws up to maxLines lines from (x,y) at 8px. Used by every message box
  // (duel, naval, examine…) so text never spills outside its panel.
  function drawWrapped(str,x,y,maxW,color,lineH,maxLines){
    lineH=lineH||10; maxLines=maxLines||3; ctx.font="8px monospace"; ctx.textBaseline="top";
    const out=[]; let line="";
    const push=()=>{ if(line){ out.push(line); line=""; } };
    String(str||"").split(" ").forEach(w=>{
      while(ctx.measureText(w).width>maxW){ let cut=w.length; while(cut>1 && ctx.measureText(w.slice(0,cut)).width>maxW) cut--; if(line) push(); out.push(w.slice(0,cut)); w=w.slice(cut); }
      const test=line?line+" "+w:w; if(ctx.measureText(test).width>maxW){ push(); line=w; } else line=test;
    });
    if(line) out.push(line);
    ctx.fillStyle=color||"#f0f0e0";
    for(let i=0;i<Math.min(out.length,maxLines);i++) ctx.fillText(out[i], x, y+i*lineH);
    return Math.min(out.length,maxLines);
  }
  function textOutlined(str,x,y,color,outline){ ctx.font="8px monospace"; ctx.textBaseline="top"; ctx.fillStyle=outline||"#000"; ctx.fillText(str,x+1,y);ctx.fillText(str,x-1,y);ctx.fillText(str,x,y+1);ctx.fillText(str,x,y-1); ctx.fillStyle=color||"#f0f0e0"; ctx.fillText(str,x,y); }
  function textCenter(str,cx,y,color){ ctx.font="8px monospace"; ctx.textBaseline="top"; ctx.textAlign="center"; ctx.fillStyle=color||"#f0f0e0"; ctx.fillText(str,cx,y); ctx.textAlign="left"; }

  // A) BOUNTIES ("Le Taglie del Porto"): one active at a time, infinite rotation, rising gold.
  // types: hunt (kill N of a creature) | treasure (dig an X on an area map) | naval (sink N King's ships)
  const BOUNTY_HUNT=[
    {enemy:"octopus", nameKey:"en_octopus"}, {enemy:"orca", nameKey:"en_orca"}, {enemy:"leviathan", nameKey:"en_leviathan"}
  ];
  const TREASURE_AREAS=["town","holiday","forestNW","forestNE","mountain","industrial","cape","island"];
  const bounty={ active:null, tier:0, treasure:null };   // treasure = {area,tx,ty}
  function bountyGold(){ return 40 + bounty.tier*25; }    // rising reward
  function bountyFame(){ return 12 + bounty.tier*4; }
  function rollBounty(){
    bounty.tier++;
    const r=Math.random();
    if(r<0.45){ // HUNT
      const h=BOUNTY_HUNT[Math.floor(Math.random()*BOUNTY_HUNT.length)];
      const need=2+Math.floor(bounty.tier/2)%3;   // 2..4
      bounty.active={ type:"hunt", enemy:h.enemy, nameKey:h.nameKey, need, have:0, gold:bountyGold() };
      bounty.treasure=null;
    } else if(r<0.75){ // TREASURE
      const area=TREASURE_AREAS[Math.floor(Math.random()*TREASURE_AREAS.length)];
      const spot=randomWalkableTile(area) || {tx:5,ty:5};
      bounty.treasure={ area, tx:spot.tx, ty:spot.ty };
      bounty.active={ type:"treasure", area, gold:bountyGold()+30 };
    } else { // NAVAL
      const need=1+ (bounty.tier%3===0?1:0);
      bounty.active={ type:"naval", need, have:0, gold:bountyGold()+20 };
      bounty.treasure=null;
    }
    saveGame();
  }
  function randomWalkableTile(area){ const rows=AREAS[area]; if(!rows) return null; const W2=rows[0].length,H2=rows.length;
    for(let i=0;i<120;i++){ const tx=2+Math.floor(Math.random()*(W2-4)), ty=2+Math.floor(Math.random()*(H2-4)); const c=rows[ty][tx];
      if(c==="."||c==="s"||c==="m"||c==="y"||c==="j"||c===",") return {tx,ty}; }
    return null; }
  function bountyDoneReady(){ const b=bounty.active; if(!b) return false;
    if(b.type==="hunt"||b.type==="naval") return b.have>=b.need;
    if(b.type==="treasure") return b.dug===true;
    return false; }
  function bountyText(){ const b=bounty.active; if(!b) return t("bnt_none");
    if(b.type==="hunt") return t("bnt_hunt").replace("%",t(b.nameKey)).replace("#",b.have+"/"+b.need);
    if(b.type==="naval") return t("bnt_naval").replace("#",b.have+"/"+b.need);
    if(b.type==="treasure") return t("bnt_treasure").replace("%",t("area_"+b.area)||b.area)+(b.dug?" \u2713":"");
    return ""; }
  // called by combat when a creature/ship is defeated (kind = enemy id for hunt; navalWin flags sink)
  function bountyOnKill(enemyId){ const b=bounty.active; if(b&&b.type==="hunt"&&enemyId===b.enemy&&b.have<b.need){ b.have++; banner(bountyText()); saveGame(); } }
  function bountyOnSink(){ const b=bounty.active; if(b&&b.type==="naval"&&b.have<b.need){ b.have++; banner(bountyText()); saveGame(); } }
  function openBounties(){
    const b=bounty.active; const opts=[];
    if(b && bountyDoneReady()) opts.push({label:t("bnt_claim").replace("#",b.gold),key:"__claim"});
    if(!b) opts.push({label:t("bnt_take"),key:"__roll"});
    opts.push({label:t("dock_stay"),key:"__cancel"});
    const title = b ? (t("bnt_current")+" "+bountyText()) : t("bnt_none");
    askChoice(title, opts, (i,opt)=>{
      if(opt.key==="__roll"){ rollBounty(); if(typeof tut2OnBounty==="function") tut2OnBounty(); showExamine([t("bnt_new"), bountyText()]); }
      else if(opt.key==="__claim"){ const g=bounty.active.gold; player.gold+=g; addFame(bountyFame());
        banner(t("bnt_paid").replace("#",g)); bounty.active=null; bounty.treasure=null; SFX.unlock&&SFX.unlock(); saveGame();
        rollBounty(); showExamine([t("bnt_new"), bountyText()]); }
    });
  }
  function crewMax(){ return (BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop).crewMax; }
  function crewPct(){ return 1 + crew*CREW_PCT_EACH; }         // multiplier for all ship values
  function nextCrewCost(){ return CREW_BASE_COST + crew*25; }   // rising cost per new hire
  // legacy bonus accessor kept for the on-foot battle/loot code: crew adds a small flat bonus
  function crewBonus(kind){
    if(kind==="dmg")   return Math.round(crew*1.2);
    if(kind==="maxhp") return crew*4;
    if(kind==="heal")  return crew>=4?4:0;
    if(kind==="speed") return crew*0.02;
    if(kind==="loot")  return crew*0.06;   // capienza: +bottino per crew
    return 0;
  }
  function hasCrew(){ return crew>0; }

  // Crudo Merchant: cross a sea border into a neighbor area preserving boat/swim state. Always lands
  // the player on a navigable water tile of the destination ('~' anywhere, 'q' in King's Borough).
  function crossSeaEdge(key, dir, forceCol){
    if(insideKey) return;
    const wasBoat=player.boat, wasSwim=player.swimming;
    areaKey=key; useMap(AREAS[key]);
    const isWater=(tx,ty)=>{ if(tx<0||ty<0||tx>=cur.w||ty>=cur.h) return false; const c=cur.rows[ty][tx]; return c==="~"||(key==="industrial"&&c==="q"); };
    let ex=player.tx, ey=player.ty;
    if(dir==="N") ey=cur.h-1; else if(dir==="S") ey=0; else if(dir==="W") ex=cur.w-1; else if(dir==="E") ex=0;
    if(typeof forceCol==="number") ex=forceCol;
    ex=Math.max(0,Math.min(cur.w-1,ex)); ey=Math.max(0,Math.min(cur.h-1,ey));
    if(!isWater(ex,ey)){
      let best=null,bd=1e9;
      // forced column: search along it first (stay in a corridor)
      if(typeof forceCol==="number"){ for(let ty=0;ty<cur.h;ty++){ if(isWater(ex,ty)){ const d=Math.abs(ty-ey); if(d<bd){bd=d;best=[ex,ty];} } } }
      // otherwise scan the WHOLE map for the nearest navigable water to the intended entry point
      if(!best){ for(let ty=0;ty<cur.h;ty++)for(let tx=0;tx<cur.w;tx++){ if(isWater(tx,ty)){ const d=Math.abs(tx-ex)+Math.abs(ty-ey); if(d<bd){bd=d;best=[tx,ty];} } } }
      if(best){ ex=best[0]; ey=best[1]; }
    }
    player.tx=ex; player.ty=ey; player.px=ex*TILE; player.py=ey*TILE; player.moving=false;
    player.boat=wasBoat; player.swimming = wasBoat ? false : true;   // stay afloat (boat) or keep swimming
    banner(t("area_"+key)||AREA_LABEL[key]||key); SFX.door&&SFX.door(); saveGame();
  }

  function qAdvance(id){ const q=QUESTS[id]; if(!q||q.status!=="active") return;
    q.step++;
    if(q.step>=q.steps.length-1){ /* on last step */ }
    saveGame();

  function qComplete(id){ const q=QUESTS[id]; if(!q||q.status==="done") return;
    q.status="done"; q.step=q.steps.length-1; (SFX.miniWin?SFX.miniWin():SFX.questDone()); if(SFX.vibrate) SFX.vibrate([30,40,30]); questPopup(t("quest_done")+" "+t(q.nameK));
    // unlock next main quest that needs this one
    QORDER.forEach(k=>{ const nq=QUESTS[k]; if(nq && nq.needs===id && nq.status==="locked"){ nq.status="available"; } });
    checkChapterComplete(); saveGame();
  }
  function checkChapterComplete(){
    const mains=QORDER.filter(k=>QUESTS[k].chap===chapter && QUESTS[k].type==="main");

  // True once the central story is fully finished (all red quests done, and there is at least one).
  function caseAllDone(){ let any=false; for(const id of CASE_QUESTS){ any=true; if(!QUESTS[id] || QUESTS[id].status!=="done") return false; } return any; }
  // Returns "case" | "casual" | null for the actionable quest an NPC currently offers.
  function npcQuestKind(n){
    if(!n) return null;
    if(typeof introNpcHasMark==="function" && introNpcHasMark(n.id)) return "casual";  // intro is yellow
    if(typeof caseNpcHasQuest==="function" && caseNpcHasQuest(n)) return "case";
    // ---- "ONE YELLOW AT A TIME": while any casual quest is accepted/in progress, hide EVERY other
    // yellow marker (both the in-game "!" and the map dots). Covers BOTH systems:
    //   1) SQ slot-engine side-quests (SQ.acceptedNpc / sqBusy)
    //   2) the original micro-quests cat/shell/parcel/kids/oldfriend/photos (microQuestActiveNpc)
    // They reappear once the running one is resolved.
    const microNpc = (typeof microQuestActiveNpc==="function") ? microQuestActiveNpc() : null;
    const microRunning = (microNpc!==null);
    const sqRunning = (SQ.acceptedNpc!=null) || (typeof sqBusy==="function" && sqBusy());
    const yellowLocked = microRunning || sqRunning;
    // the single NPC allowed to keep its yellow "!" while locked (the one that advances/closes the running quest)
    const allowedNpc = microRunning ? microNpc : SQ.acceptedNpc;
    if(yellowLocked){
      if(!allowedNpc || n.id!==allowedNpc) return null;
      // even the allowed NPC only shows a "!" if it has an action available RIGHT NOW, of the SAME
      // kind as the running quest: during a micro-quest only its own giver-action counts (not a
      // concurrent SQ); during an SQ only that SQ counts. (e.g. while the cat is being searched,
      // nonna has nothing to do -> no marker, even if she also holds a side-quest.)
      const hasAction = microRunning ? npcHasQuest(n)
                                     : (typeof sqNpcMission==="function" && !!sqNpcMission(n.id));
      return hasAction ? "casual" : null;
    }
    // nothing running: show every available yellow marker (SQ side-quests + micro-quests)
    if(typeof sqNpcMission==="function" && sqNpcMission(n.id)) return "casual";
    if(!npcHasQuest(n)) return null;
    return "casual";
  }

    minCol = minCol||0; maxRow = (maxRow==null)?rows.length-1:maxRow;
    const isSea=(x,y)=>{ if(y<0||y>=rows.length||x<0||x>=rows[0].length) return true; const c=rows[y][x]; return c==="~"||c==="g"; };
    const bad=(x,y)=> isSea(x,y) || x<minCol || y>maxRow || (avoidSand && rows[y] && rows[y][x]==="s");
    if(!bad(tx,ty)) return [tx,ty];
    for(let rad=1; rad<=16; rad++){ for(let dy=-rad;dy<=rad;dy++) for(let dx=-rad;dx<=rad;dx++){
      const x=tx+dx,y=ty+dy; if(x<minCol||y<0||y>maxRow||x>=rows[0].length||y>=rows.length) continue;
      const c=rows[y][x]; if(c!=="~"&&c!=="g"&&c!=="T"&&!OUT_SOLID.has(c) && !(avoidSand&&c==="s")) return [x,y]; } }
    return [Math.max(tx,minCol),Math.min(ty,maxRow)];
  }
  function snapNpcsOffWater(){
    for(const ak in AREA_NPCS){ const rows=AREAS[ak]; if(!rows) continue;
      // Pirates' Bay (holiday) & Lighthouse Cape (cape): keep NPCs EAST of the west sea corridor/cliff
      // (col>=9), and in Pirates' Bay keep them out of the southern BEACH (rows>=28) so none appear to
      // "swim" on the sand. (Points 3 & beach-npc fix)
      const minCol=(ak==="holiday"||ak==="cape")?9:0;
      const maxRow=(ak==="holiday")?26:undefined;      // holiday: stay above the south beach
      const avoidSand=(ak==="holiday");
      for(const n of AREA_NPCS[ak]){
        const [sx,sy]=_nearestDry(rows,n.tx,n.ty,minCol,maxRow,avoidSand); n.tx=sx; n.ty=sy; n.px=sx*TILE; n.py=sy*TILE;
        if(n.home) n.home=_nearestDry(rows,n.home[0],n.home[1],minCol,maxRow,avoidSand);
        if(n.routine) n.routine.forEach(seg=>{ if(seg.go) seg.go=_nearestDry(rows,seg.go[0],seg.go[1],minCol,maxRow,avoidSand); });
      }
    }
  }

  function seaTileAt(area,tx,ty){ const rows=AREAS[area]; if(!rows) return false; if(ty<0||ty>=rows.length||tx<0||tx>=rows[0].length) return false;
    const c=rows[ty][tx]; return c==="~"||c==="q"; }   // open navigable water (~ everywhere, q = King's Borough harbour)
  // Crudo Merchant: ambient boats stay OFFSHORE in coastal areas (far from the beach), where the buoys used to be.
  const SHIP_COASTAL=new Set(["town","holiday","industrial"]);
  const SHIP_FAR_ROW=37;   // in coastal areas, boats only sail on rows >= this (deep water)
  function shipWaterAt(area,tx,ty){
    if(!seaTileAt(area,tx,ty)) return false;
    if(SHIP_COASTAL.has(area) && ty<SHIP_FAR_ROW) return false;   // keep them far from shore
    return true;
  }
  function spawnShips(area){
    ships=[]; const n=SHIPS_BY_AREA[area]; if(!n) return;
    const rows=AREAS[area]; if(!rows) return; const W2=rows[0].length,H2=rows.length;
    for(let i=0;i<n;i++){
      let tx,ty,tries=0;
      // spawn on ship-water, and keep hostile challengers FAR from the player's entry point
      // (fixes: getting attacked the instant you enter the water)
      do{ tx=2+Math.floor(Math.random()*(W2-4)); ty=2+Math.floor(Math.random()*(H2-4)); tries++; }
      while((!shipWaterAt(area,tx,ty) || (Math.abs(tx-player.tx)+Math.abs(ty-player.ty) < 10)) && tries<200);
      if(!shipWaterAt(area,tx,ty)) continue;
      const kind=SHIP_KINDS[Math.floor(Math.random()*SHIP_KINDS.length)];
      const speed=(kind==="rowboat"?10:kind==="sloop"?16:kind==="brig"?22:26);
      // Crudo Merchant: HOSTILE challenger ships patrol the OPEN SEA only (the dedicated battle area).
      // Coastal/approach waters (cape, town, holiday, island, northern seas) stay peaceful for ambient ships.
      const hostile = ((area==="opensea") && (i<3) && kind!=="rowboat");
      const navalKind = (kind==="galleon"?"galleon":(kind==="brig"?"brig":"sloop"));
      // Crudo Merchant (world event): a rare RICH MERCHANT in the open waters — big gold if you sink it
      const rich = (area==="opensea") && hostile && (i===0) && (Math.random()<0.25);
      ships.push({ kind, px:tx*TILE, py:ty*TILE, dir:(Math.random()<0.5?"left":"right"),
        vx:(Math.random()<0.5?-1:1), vy:(Math.random()*2-1)*0.3, sp:speed, rndT:Math.random()*3, hostile, navalKind, rich });
    }
    navalCooldown=Math.max(navalCooldown,3.0);   // grace period on entering any sea area: no instant engagement
  }
  function updateShips(dt){
    const rows=cur.rows; if(!rows) return; const W2=cur.w,H2=cur.h;

      if(s.hostile && !insideKey && player.boat){
        const dpx=player.px-s.px, dpy=player.py-s.py; const d=Math.hypot(dpx,dpy)||1;
        if(d < TILE*12){ s.vx=dpx/d; s.vy=dpy/d; }

  // ======================================================================================
  // Crudo Merchant — TRADE SYSTEM ("Mercatorio" in miniature)
  // Four trading hubs (Natives' Archipelago big island, Free Port, King's Borough, Lighthouse
  // Cape) each PRODUCE some goods cheaply and DEMAND others dearly. Prices drift over time and
  // react to your trades (buying nudges the local price up, selling nudges it down; prices then
  // slowly revert to their mean). Buy low here, sail, sell high there. Cargo hold is limited by
  // your boat. A trader NPC in each hub opens the market with A.
  // ======================================================================================
  const TRADE_GOODS = [
    { id:"fish",   nameK:"tg_fish",   base:8,   col:"#8fb8d0" },
    { id:"rum",    nameK:"tg_rum",    base:16,  col:"#b5642a" },
    { id:"timber", nameK:"tg_timber", base:12,  col:"#7a5230" },
    { id:"spice",  nameK:"tg_spice",  base:26,  col:"#d08a2a" },
    { id:"iron",   nameK:"tg_iron",   base:34,  col:"#8a8f98" },
    { id:"pearl",  nameK:"tg_pearl",  base:55,  col:"#e6dcc8" }
  ];
  // profile: <1 = the hub PRODUCES it (cheap here), >1 = the hub DEMANDS it (dear here).
  // Crudo Merchant — DYNAMIC ECONOMY: each port also PRODUCES some goods and CONSUMES others over time.
  //   prod[gid] = units produced per economic tick (base, before investment).
  //   cons[gid] = units consumed per economic tick.
  // Stock rises with production, falls with consumption; PRICE follows supply/demand (stock).
  const TRADE_PORTS = {
    forestNW:   { nameK:"area_forestNW",   prof:{ fish:0.7, pearl:0.55, spice:0.8, rum:1.35, iron:1.5,  timber:1.15 },
                  prod:{ pearl:3, spice:3, fish:1 }, cons:{ rum:3, iron:2, timber:1 } }, // Natives: pearls/spice; want rum/iron
    town:       { nameK:"area_town",       prof:{ fish:0.85,rum:0.7,  timber:0.9, spice:1.2, iron:1.15, pearl:1.25 },
                  prod:{ fish:4, rum:3 }, cons:{ timber:2, iron:2, spice:1 } }, // Free Port: fish/rum; want timber/iron
    industrial: { nameK:"area_industrial", prof:{ iron:0.6, timber:0.75,rum:1.2,  fish:1.15, spice:1.25,pearl:1.2  },
                  prod:{ iron:4, timber:3 }, cons:{ fish:2, rum:2, pearl:1 } }, // King's Borough: iron/timber; want fish/rum
    cape:       { nameK:"area_cape",       prof:{ fish:0.75,timber:0.95,rum:1.1, spice:1.1, iron:1.2,  pearl:0.85 },
                  prod:{ fish:3, pearl:2 }, cons:{ iron:2, spice:2, timber:1 } }  // Lighthouse Cape: fish/pearls; want iron/spice
  };
  const TRADE_HUBS = ["forestNW","town","industrial","cape"];
  // ---- SEASONAL ECONOMY: each season shifts PRODUCTION (prodMul) and DEMAND (demandMul) per good. ----
  //   prodMul  < 1 => that good is produced LESS this season (scarce -> price rises)
  //   demandMul> 1 => that good is wanted MORE this season (price rises)
  // Tema Caraibi 1650-1730: inverno = mari grossi (poca pesca/spezie, tanto rum/legname per scaldarsi e
  // riparare); estate = pesca e perle abbondanti, gran sete di rum; primavera/autunno = raccolti/scorte.
  const SEASON_ECON = {
    spring: { prod:{ spice:1.3, timber:1.2, fish:1.0 }, demand:{ pearl:1.1, spice:1.1 } },
    summer: { prod:{ fish:1.4, pearl:1.4, spice:1.1 }, demand:{ rum:1.3, fish:1.1 } },
    autumn: { prod:{ timber:1.3, iron:1.1, spice:1.2 }, demand:{ iron:1.15, timber:1.1 } },
    winter: { prod:{ fish:0.5, spice:0.5, pearl:0.7 }, demand:{ rum:1.4, timber:1.35, iron:1.2 } }
  };
  function seasonProdMul(gid){ const s=SEASON_ECON[season]; return (s&&s.prod&&s.prod[gid])||1; }
  function seasonDemandMul(gid){ const s=SEASON_ECON[season]; return (s&&s.demand&&s.demand[gid])||1; }
  // ---- PRODUCTION CHAINS: a WORKED good needs an INPUT raw good to be produced. ----
  //   Rum   <- Spice   (canna/melassa -> distillato)
  //   Iron  <- Timber  (legname/carbone -> fusione lingotti)
  //   Pearl <- Fish    (la pesca sostiene i cercatori di perle)
  // A port only produces a worked good if it holds enough of the input, which it CONSUMES.
  // If the input runs out, that production stalls (price of the worked good rises -> a trade signal).
  // Raw goods (fish, spice, timber) have no recipe and are produced directly as before.
  const RECIPES = { rum:{ in:"spice", ratio:1 }, iron:{ in:"timber", ratio:1 }, pearl:{ in:"fish", ratio:1 } };
  // ---- DYNAMIC MARKET STATE ----
  // stock[port][good] = current warehouse units (supply). invest[port][good] = production upgrade level.
  // event = a transient boom/shortage in one port/good. prices[] is kept in sync (derived from stock)
  // for backwards compatibility with save/restore and any code reading market.prices.
  const STOCK_CAP = 60;        // max warehouse units per good
  const STOCK_MID = 30;        // "balanced" stock -> multiplier ~1.0
  const INVEST_STEP = 2;       // extra production units per invest level
  const INVEST_COST0 = 150;    // base cost of the first investment level (rises per level)
  const market = { prices:{}, stock:{}, invest:{}, event:null, seeded:false, t:0 };
  function marketInit(){
    for(const p of TRADE_HUBS){
      market.prices[p]={}; market.stock[p]={}; market.invest[p]={};
      const P=TRADE_PORTS[p];
      for(const g of TRADE_GOODS){
        // start producers with surplus stock, consumers with scarcity
        const prod=(P.prod&&P.prod[g.id])||0, cons=(P.cons&&P.cons[g.id])||0;
        let s=STOCK_MID; if(prod>cons) s=STOCK_MID+14; else if(cons>prod) s=STOCK_MID-14;
        market.stock[p][g.id]=Math.max(2, Math.min(STOCK_CAP, s + Math.round((Math.random()*8-4))));
        market.invest[p][g.id]=0;
        market.prices[p][g.id]=stockMult(market.stock[p][g.id]);
      }
    }
    market.event=null; market.seeded=true;
  }
  // supply/demand multiplier from stock: full warehouse -> cheap (~0.6), empty -> dear (~1.7).
  function stockMult(s){
    const r=(STOCK_MID - s)/STOCK_MID;         // +1 empty, -1 full
    return Math.max(0.6, Math.min(1.7, 1.0 + r*0.7));
  }
  // cargo hold: how much you carry of each good, limited by boat capacity
  const cargo = {}; TRADE_GOODS.forEach(g=>cargo[g.id]=0);
  function cargoUsed(){ let s=0; for(const g of TRADE_GOODS) s+=cargo[g.id]; return s; }
  function cargoCap(){ const b=(BOAT_TYPES&&BOAT_TYPES[player.boatType])||null; const base=b&&b.hold?b.hold:(b&&b.cap?b.cap:12); return base; }
  // the live price a good trades at in a port (rounded doubloons)
  function goodPrice(port, gid){
    const g=TRADE_GOODS.find(x=>x.id===gid); if(!g) return 0;
    const prof=(TRADE_PORTS[port]&&TRADE_PORTS[port].prof[gid])||1;
    const dyn=(market.prices[port]&&market.prices[port][gid])||1;
    let ev=1;
    if(market.event && market.event.port===port && market.event.gid===gid){ ev = market.event.type==="shortage" ? 1.5 : 0.6; }
    const seas = (typeof seasonDemandMul==="function") ? seasonDemandMul(gid) : 1;   // seasonal demand
    return Math.max(1, Math.round(g.base*prof*dyn*ev*seas));
  }
  // Investment: cost to raise a port/good production by one level (rising curve).
  function investCost(port, gid){ const lvl=(market.invest[port]&&market.invest[port][gid])||0; return Math.round(INVEST_COST0*Math.pow(1.6,lvl)); }
  function investProd(port, gid){ // invest in a port's production of a good; returns true on success
    if(!market.invest[port]) return false;
    const cost=investCost(port,gid); if(player.gold<cost) return false;
    player.gold-=cost; market.invest[port][gid]=(market.invest[port][gid]||0)+1;
    market.stock[port][gid]=Math.min(STOCK_CAP,(market.stock[port][gid]||0)+6); // immediate small boost
    saveGame(); return true;
  }
  // world-clock driven: produce/consume stock per port, refresh derived prices, run random events.
  function marketTick(dt){
    if(!market.seeded) marketInit();
    market.t+=dt;
    if(market.t < 3.0) return; market.t=0;   // one economic step every ~3s of play
    for(const p of TRADE_HUBS){
      const P=TRADE_PORTS[p];
      // 1) apply CONSUMPTION and RAW production first; compute intended production for each good.
      //    Worked goods (with a RECIPE) are then limited by the available input, which they consume.
      const wanted={};   // intended production units per good (after invest + season)
      for(const g of TRADE_GOODS){
        const gid=g.id;
        const invLvl=(market.invest[p]&&market.invest[p][gid])||0;
        wanted[gid]=(((P.prod&&P.prod[gid])||0) + invLvl*INVEST_STEP) * seasonProdMul(gid);
      }
      // resolve worked goods: cap production by input in stock, and consume that input.
      for(const gid in RECIPES){
        if(!wanted[gid]) continue;
        const rec=RECIPES[gid]; const need=wanted[gid]*rec.ratio;
        const have=market.stock[p][rec.in]||0;
        const made=Math.max(0, Math.min(wanted[gid], have/rec.ratio));   // limited by input
        wanted[gid]=made;
        market.stock[p][rec.in]=Math.max(0, have - made*rec.ratio);      // consume the input
      }
      // 2) apply production - base consumption + self-correction + noise
      for(const g of TRADE_GOODS){
        const gid=g.id;
        const prod=wanted[gid];
        const cons=(P.cons&&P.cons[gid])||0;
        let s=market.stock[p][gid];
        s += prod - cons;
        s += (STOCK_MID - s)*0.02;             // gentle pull toward balance (markets self-correct)
        s += (Math.random()*2-1)*0.8;          // small noise
        market.stock[p][gid]=Math.max(0, Math.min(STOCK_CAP, s));
        market.prices[p][gid]=stockMult(market.stock[p][gid]);
      }
    }
    // random economic EVENT: rare boom/shortage that spikes one port/good (a trading opportunity).
    if(market.event){ market.event.tLeft-=3.0; if(market.event.tLeft<=0) market.event=null; }
    else if(Math.random()<0.03){
      const p=TRADE_HUBS[Math.floor(Math.random()*TRADE_HUBS.length)];
      const g=TRADE_GOODS[Math.floor(Math.random()*TRADE_GOODS.length)];
      const type=Math.random()<0.5?"shortage":"boom";
      market.event={ port:p, gid:g.id, type, tLeft:60 };   // ~60s window
      if(typeof banner==="function"){ const pn=t(TRADE_PORTS[p].nameK), gn=t(g.nameK);
        banner((type==="shortage"?t("eco_shortage"):t("eco_boom")).replace("#g",gn).replace("#p",pn)); }
    }
  }
  // player buy/sell moves REAL stock (buying drains supply -> price up; selling floods it -> price down).
  function marketNudge(port, gid, dir){ // dir +1 buy (price up), -1 sell (price down)
    if(!market.stock[port]) return;
    market.stock[port][gid]=Math.max(0, Math.min(STOCK_CAP, (market.stock[port][gid]||STOCK_MID) - dir*2));
    market.prices[port][gid]=stockMult(market.stock[port][gid]);
  }
  // ---- trade menu overlay (styled like the shipyard) ----
  const trade = { open:false, port:null, sel:0, note:"", noteT:0 };
  function openTrade(port){ if(!market.seeded) marketInit(); trade.open=true; trade.port=port; trade.sel=0; trade.note=""; trade.noteT=0; SFX.confirm&&SFX.confirm(); if(typeof teachOnce==="function") teachOnce("trade"); }
  function updateTrade(){
    if(trade.noteT>0) trade.noteT-=1/60;
    const N=TRADE_GOODS.length;
    if(consumePress("up")){ trade.sel=(trade.sel-1+N)%N; SFX.talk&&SFX.talk(); }
    if(consumePress("down")){ trade.sel=(trade.sel+1)%N; SFX.talk&&SFX.talk(); }
    if(consumePress("b")){ trade.open=false; SFX.cancel&&SFX.cancel(); saveGame(); return; }
    const g=TRADE_GOODS[trade.sel]; const port=trade.port; const price=goodPrice(port,g.id);
    // A = BUY one, LEFT = SELL one (also B handled above)
    if(consumePress("a")){
      if(cargoUsed()>=cargoCap()){ trade.note=t("tr_full"); trade.noteT=2.0; SFX.cancel&&SFX.cancel(); return; }
      if((player.gold||0)<price){ trade.note=t("tr_nogold"); trade.noteT=2.0; SFX.cancel&&SFX.cancel(); return; }
      player.gold-=price; cargo[g.id]++; marketNudge(port,g.id,+1); if(typeof tutOnBuy==="function") tutOnBuy(); SFX.confirm&&SFX.confirm();
      trade.note=t("tr_bought").replace("#",price); trade.noteT=1.5;
    }
    if(consumePress("left")||consumePress("right")){
      if(cargo[g.id]<=0){ trade.note=t("tr_none"); trade.noteT=1.5; SFX.cancel&&SFX.cancel(); return; }
      player.gold+=price; cargo[g.id]--; marketNudge(port,g.id,-1); SFX.unlock&&SFX.unlock();
      trade.note=t("tr_sold").replace("#",price); trade.noteT=1.5;
      if(typeof tut2OnSell==="function") tut2OnSell();
    }
  }
  function drawTrade(){
    const bx=4, by=10, bw=W-8, bh=H-14;
    ctx.fillStyle="#0e0e18"; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle="#f0f0e0"; ctx.lineWidth=1; ctx.strokeRect(bx+1.5,by+1.5,bw-3,bh-3);
    const IL=bx+6;
    ctx.font="8px monospace"; ctx.textBaseline="top"; ctx.textAlign="center"; ctx.fillStyle="#f0c860";
    ctx.fillText(t("tr_title")+" - "+(t(TRADE_PORTS[trade.port].nameK)||trade.port), W/2, by+4); ctx.textAlign="left";
    // gold + cargo counters
    ctx.fillStyle="#e8c040"; ctx.fillRect(bx+bw-34,by+3,4,4); ctx.fillStyle="#b8901f"; ctx.fillRect(bx+bw-34,by+6,4,2);

      const sel=(i===trade.sel); const selc= sel?"#ffe070":"#dfe8f2";
      if(sel){ ctx.fillStyle="#26324a"; ctx.fillRect(IL-2,y-1,bw-14,10); }   // barra selezione
      const name=(t(g.nameK)+"          ").slice(0,9);

  }

  // ======================================================================================
  // Crudo Merchant — MERCHANT MODE: automated TRADE ROUTES.
  // Beyond hand-trading at the counter, you can dispatch your SHIP on a round-trip route to
  // another hub. It runs in REAL TIME and its outcome depends on the ship you own:
  //   • Capacity  = BOAT_TYPES[boatType].hold  (how much cargo the run carries)
  //   • Speed     = shipValues().spd           (shorter travel time)
  //   • Security  = shipValues().def + atk     (chance to fend off pirate raids en route)
  // One route at a time (the ship is busy). You buy the goods up front; the ship sails to the
  // destination, sells at that hub's live price on arrival, and returns the gold. Raids may cost
  // part of the cargo if security is low.
  // ======================================================================================
  // logical sailing "distance" between hubs (relative units) -> scaled by ship speed into seconds
  const ROUTE_DIST = {
    "forestNW|town":5, "forestNW|industrial":6, "forestNW|cape":5,
    "town|industrial":3, "town|cape":4, "industrial|cape":6
  };
  function routeDist(a,b){ return ROUTE_DIST[a+"|"+b] || ROUTE_DIST[b+"|"+a] || 5; }
  // security score 0..100 from the ship's combat values (hull+guns+ram) and crew
  function shipSecurity(){ const v=shipValues(); return Math.max(5, Math.min(100, Math.round(v.def*0.25 + v.atk*0.6))); }
  function shipHold(){ const b=BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop; return b.hold||12; }
  function shipSpeedFactor(){ const v=shipValues(); return Math.max(0.5, v.spd/100); }   // >1 faster
  // active route (persisted). status: null | {from,to,good,qty,buyCost,total,elapsed,leg,raided}
  let route = null;
  // Crudo Merchant: lifetime Merchant-mode progress (persisted).
  const merchantStats = { routes:0, profit:0, revenue:0, best:0, raids:0 };
  const ROUTE_BASE_SECS = 12;   // seconds per distance unit at speed factor 1.0, PER LEG
  function routeLegSecs(from,to){ return Math.round(ROUTE_BASE_SECS*routeDist(from,to)/shipSpeedFactor()); }
  // Crudo Merchant: TRANSPORT COST — moving goods costs money that scales with DISTANCE and QUANTITY.
  //   shipping = SHIP_FEE_PER_DIST * distance * qty  (deducted from the route revenue on return).
  // This gives geography weight: long hauls cost more; nearby ports are cheaper to serve.
  const SHIP_FEE_PER_DIST = 0.9;
  function routeShipCost(from,to,qty){ return Math.round(SHIP_FEE_PER_DIST*routeDist(from,to)*qty); }
  function startRoute(from,to,gid,qty){
    if(route) return false;
    const price=goodPrice(from,gid); const cost=price*qty;
    if((player.gold||0)<cost) return "nogold";
    if(qty<=0 || qty>shipHold()) return "cap";
    player.gold-=cost;
    const legSecs=routeLegSecs(from,to);
    const shipCost=routeShipCost(from,to,qty);
    route = { from, to, good:gid, qty, buyCost:cost, shipCost, dist:routeDist(from,to), elapsed:0, leg:"out", legSecs, raided:0, done:false, msg:"" };
    banner((t("rt_started")||"Route started").replace("#",qty).replace("%",t(TRADE_PORTS[to].nameK)));
    if(typeof tut2OnRoute==="function") tut2OnRoute();
    saveGame(); return true;
  }
  function routeTick(dt){
    if(!route || route.done) return;
    route.elapsed += dt;
    if(route.leg==="out"){
      // mid-leg pirate raid check (once). Longer routes are RISKIER: raid chance grows with distance.
      if(route.raided===0 && route.elapsed>=route.legSecs*0.5){
        route.raided=1;
        const sec=shipSecurity();
        const distRisk = (route.dist||5)*3;                // +3% raid roll per distance unit
        if(Math.random()*100 > (sec - distRisk)){          // long hauls harder to protect
          const lost=Math.max(1, Math.round(route.qty*(0.2+Math.random()*0.3)));
          route.qty=Math.max(0, route.qty-lost); route.lostQty=lost;
        }
      }
      if(route.elapsed>=route.legSecs){ route.leg="back"; route.elapsed=0; route.arrivePrice=goodPrice(route.to, route.good); }
    } else { // returning with the gold
      if(route.elapsed>=route.legSecs){ resolveRoute(); }
    }
  }
  function resolveRoute(){
    if(!route) return;
    const price = route.arrivePrice || goodPrice(route.to, route.good);
    const gross = price*route.qty;
    const ship = route.shipCost||0;                        // transport cost scales with distance x qty
    const revenue = Math.max(0, gross - ship);             // net paid to the player
    player.gold += revenue;
    marketNudge(route.to, route.good, -1);                 // selling at destination softens its price
    const profit = revenue - route.buyCost;
    // Crudo Merchant: track lifetime merchant progress
    merchantStats.routes++; merchantStats.revenue+=revenue; merchantStats.profit+=profit;
    if(profit>merchantStats.best) merchantStats.best=profit;
    if(route.lostQty) merchantStats.raids++;
    let msg = (t("rt_done")||"Route done: +#d").replace("#", revenue);
    if(ship) msg += " ("+(t("rt_shipcost")||"transport -#").replace("#",ship)+")";
    if(route.lostQty) msg += " ("+(t("rt_raided")||"raid! lost %").replace("%",route.lostQty)+")";
    banner(msg);
    route=null; saveGame();
  }
  function routeStatusLine(){
    if(!route) return null;
    const total=route.legSecs; const rem=Math.max(0, Math.ceil(total-route.elapsed));
    const legTxt = route.leg==="out" ? (t("rt_outbound")||"-> %").replace("%", t(TRADE_PORTS[route.to].nameK))
                                     : (t("rt_return")||"<- home");
    return (t("rt_ship")||"Ship")+": "+legTxt+"  "+rem+"s";
  }
  // ---- Merchant menu additions: choose to hand-trade OR dispatch a route ----
  function openMerchant(port){
    if(typeof tutOnMerchant==="function") tutOnMerchant();
    if(route){ // a route is running: show status, offer to hand-trade meanwhile
      askChoice((t("rt_busy")||"Your ship is on a route.")+" "+(routeStatusLine()||""), [
        {label:t("mm_counter")||"Trade at the counter", key:"counter"},
        {label:t("dock_stay")||"Leave", key:"cancel"}
      ], (i,opt)=>{ if(opt.key==="counter") openTrade(port); });
      return;
    }
    askChoice(t("mm_q")||"What will you do, captain?", [
      {label:t("mm_counter")||"Trade at the counter", key:"counter"},
      {label:t("mm_route")||"Set up a trade route", key:"route"},
      {label:t("mm_invest")||"Invest in the port", key:"invest"},
      {label:t("mm_contract")||"Contracts", key:"contract"},
      {label:t("dock_stay")||"Leave", key:"cancel"}
    ], (i,opt)=>{
      if(opt.key==="counter"){ openTrade(port); }
      else if(opt.key==="route"){ chooseRouteDest(port); }
      else if(opt.key==="invest"){ openInvest(port); }
      else if(opt.key==="contract"){ openContracts(port); }
    });
  }
  // PORT INVESTMENT: spend gold to permanently raise a port's production of a good (progressione infinita).
  // Higher production -> stable surplus -> the port becomes a growing income source.
  function openInvest(port){
    const opts = TRADE_GOODS
      .filter(g=> (TRADE_PORTS[port].prod && TRADE_PORTS[port].prod[g.id]) )   // only goods the port actually produces
      .map(g=>{ const lvl=(market.invest[port]&&market.invest[port][g.id])||0; const cost=investCost(port,g.id);
        return { label:t(g.nameK)+"  "+t("inv_lvl")+lvl+"  "+t("inv_cost")+cost+"d", key:g.id, cost }; });
    opts.push({ label:t("dock_stay")||"Back", key:"cancel" });
    askChoice(t("inv_title")+" - "+t(TRADE_PORTS[port].nameK), opts, (i,opt)=>{
      if(opt.key==="cancel") return;
      if(player.gold < opt.cost){ banner(t("inv_nogold")); SFX.cancel&&SFX.cancel(); return; }
      if(investProd(port, opt.key)){
        SFX.unlock&&SFX.unlock();
        banner(t("inv_done").replace("#g",t(TRADE_GOODS.find(g=>g.id===opt.key).nameK)).replace("#p",t(TRADE_PORTS[port].nameK)));
        if(typeof tut2OnInvest==="function") tut2OnInvest();
        openInvest(port);   // reopen so you can keep investing
      }
    });
  }
  // ================= LONG-TERM CONTRACTS =================
  // A contract: deliver N crates of a good to a destination port within a deadline (days), for a FIXED
  // premium price (higher than spot). Protects the player from price swings and gives recurring goals.
  // One active contract at a time. contract = { good, qty, from, to, price, dueDay, accepted }
  let contract = null;
  let contractOffer = {};   // per-port pending OFFER the player can accept (regenerated over time)
  function makeOffer(port){
    const dests=TRADE_HUBS.filter(h=>h!==port);
    const to=dests[Math.floor(Math.random()*dests.length)];
    const g=TRADE_GOODS[Math.floor(Math.random()*TRADE_GOODS.length)];
    const qty=4+Math.floor(Math.random()*6);                       // 4..9 crates
    const dist=(typeof routeDist==="function")?routeDist(port,to):5;
    const spot=goodPrice(to, g.id);
    // premium grows with distance: far deliveries pay more (they cost more to serve).
    const price=Math.round(spot*(1.35+Math.random()*0.35) + dist*2);
    const days=Math.max(3, Math.round(dist*0.8) + 2 + Math.floor(Math.random()*2));  // more days for far ports
    return { good:g.id, qty, from:port, to, price, days, dist };
  }
  function contractReward(c){ return c.price*c.qty; }
  function openContracts(port){
    // If a contract is ACTIVE: show status; allow delivery if we're at destination with the cargo.
    if(contract && contract.accepted){
      const c=contract; const gname=t(TRADE_GOODS.find(g=>g.id===c.good).nameK); const dst=t(TRADE_PORTS[c.to].nameK);
      const daysLeft=Math.max(0, c.dueDay - dayCount);
      if(port===c.to){
        const have=cargo[c.good]||0;
        if(have>=c.qty){
          askChoice(t("ct_deliver_q").replace("#n",c.qty).replace("#g",gname), [
            {label:t("ct_deliver")+" (+"+contractReward(c)+"d)", key:"deliver"},
            {label:t("dock_stay")||"Back", key:"cancel"}
          ], (i,opt)=>{ if(opt.key==="deliver"){ deliverContract(); } });
          return;
        }
        showExamine([t("ct_need").replace("#n",c.qty).replace("#g",gname), t("ct_have").replace("#n",have)]);
        return;
      }
      showExamine([ t("ct_active").replace("#n",c.qty).replace("#g",gname).replace("#p",dst),
                    t("ct_reward").replace("#d",contractReward(c)), t("ct_due").replace("#n",daysLeft) ]);
      return;
    }
    // No active contract: present the port's OFFER (generate one if missing).
    if(!contractOffer[port]) contractOffer[port]=makeOffer(port);
    const o=contractOffer[port]; const gname=t(TRADE_GOODS.find(g=>g.id===o.good).nameK); const dst=t(TRADE_PORTS[o.to].nameK);
    askChoice(
      t("ct_offer").replace("#n",o.qty).replace("#g",gname).replace("#p",dst)+"  (+"+contractReward(o)+"d, "+o.days+"gg)",
      [ {label:t("ct_accept"), key:"accept"}, {label:t("dock_stay")||"Back", key:"cancel"} ],
      (i,opt)=>{ if(opt.key==="accept"){
        contract={ good:o.good, qty:o.qty, from:o.from, to:o.to, price:o.price, dueDay:dayCount+o.days, accepted:true };
        contractOffer[port]=null; SFX.confirm&&SFX.confirm();
        banner(t("ct_taken").replace("#n",o.qty).replace("#g",gname).replace("#p",dst)); if(typeof tut2OnContract==="function") tut2OnContract(); saveGame();
      } });
  }
  function deliverContract(){
    const c=contract; if(!c) return;
    cargo[c.good]=Math.max(0,(cargo[c.good]||0)-c.qty);
    const reward=contractReward(c);
    player.gold+=reward; addFame&&addFame(6);
    if(typeof merchantStats!=="undefined"){ merchantStats.revenue+=reward; merchantStats.profit+=reward; }
    banner(t("ct_done").replace("#d",reward)); SFX.miniWin?SFX.miniWin():(SFX.questDone&&SFX.questDone());
    contract=null; saveGame();
  }
  // deadline check: called from the world clock each frame; fails the contract if the day passed.
  let _contractLastDay=0;
  function contractTick(){
    if(contract && contract.accepted && dayCount>contract.dueDay){
      banner(t("ct_failed")); SFX.cancel&&SFX.cancel(); contract=null; saveGame();
    }
  }
  function chooseRouteDest(from){
    const dests=TRADE_HUBS.filter(h=>h!==from);
    askChoice(t("rt_pickdest")||"Sail to which hub?",
      dests.map(d=>({label:t(TRADE_PORTS[d].nameK), key:d})).concat([{label:t("dock_stay")||"Back", key:"cancel"}]),
      (i,opt)=>{ if(opt.key!=="cancel") chooseRouteGood(from, opt.key); });
  }
  function chooseRouteGood(from,to){
    // suggest goods that are cheap here and dear there (best margin first)
    const ranked=TRADE_GOODS.slice().sort((a,b)=>(goodPrice(to,b.id)-goodPrice(from,b.id))-(goodPrice(to,a.id)-goodPrice(from,a.id)));
    askChoice(t("rt_pickgood")||"Load which good?",
      ranked.map(g=>{ const buy=goodPrice(from,g.id), sell=goodPrice(to,g.id);
        return {label:t(g.nameK)+"  "+buy+"->"+sell+"d", key:g.id}; }).concat([{label:t("dock_stay")||"Back", key:"cancel"}]),
      (i,opt)=>{ if(opt.key!=="cancel") chooseRouteQty(from,to,opt.key); });
  }
  function chooseRouteQty(from,to,gid){
    const hold=shipHold(); const price=goodPrice(from,gid); const maxAfford=Math.floor((player.gold||0)/Math.max(1,price));
    const maxQty=Math.max(0, Math.min(hold, maxAfford));
    if(maxQty<=0){ banner(t("tr_nogold")||"Not enough gold."); return; }
    const opts=[]; [Math.ceil(maxQty*0.25),Math.ceil(maxQty*0.5),maxQty].forEach(q=>{ if(q>0 && !opts.find(o=>o.q===q)) opts.push({q}); });
    askChoice((t("rt_pickqty")||"How much? (hold #, secs %)").replace("#",hold).replace("%",routeLegSecs(from,to)),
      opts.map(o=>({label:o.q+"x  ("+(price*o.q)+"d +trasp."+routeShipCost(from,to,o.q)+"d)", key:"q:"+o.q})).concat([{label:t("dock_stay")||"Back", key:"cancel"}]),
      (i,opt)=>{ if(opt.key&&opt.key.indexOf("q:")===0){ const q=parseInt(opt.key.slice(2)); const r=startRoute(from,to,gid,q); if(r==="nogold") banner(t("tr_nogold")); } });
  }



  // ---- multiple-choice prompt (used for interrogations) ----
  // choice = { active, title, options:[{label, correct}], sel, onPick(idx,opt) }
  const choice={ active:false, title:"", options:[], sel:0, onPick:null };
  function askChoice(title, options, onPick){ choice.active=true; choice.title=title; choice.options=options; choice.sel=0; choice.onPick=onPick; SFX.talk(); }
  function updateChoice(){
    if(consumePress("up")){ choice.sel=(choice.sel-1+choice.options.length)%choice.options.length; SFX.up&&SFX.up(); }
    if(consumePress("down")){ choice.sel=(choice.sel+1)%choice.options.length; SFX.down&&SFX.down(); }
    if(consumePress("b")){ choice.active=false; SFX.cancel(); return; }
    if(consumePress("a")){ const i=choice.sel, opt=choice.options[i]; const cb=choice.onPick; choice.active=false; SFX.confirm(); if(cb) cb(i,opt); }
  }
  function drawChoice(){
    const n=choice.options.length;
    // measure how many lines the title needs (wrapped) so the box grows to fit
    ctx.font="8px monospace"; const titleMaxW=W-24;
    const titleLines=(function(str){ const out=[]; let line=""; String(str||"").split(" ").forEach(w=>{ const test=line?line+" "+w:w; if(ctx.measureText(test).width>titleMaxW){ if(line)out.push(line); line=w; } else line=test; }); if(line)out.push(line); return out.slice(0,2); })(choice.title);
    const th=titleLines.length*10;

    titleLines.forEach((l,i)=> text(l, 12, by+5+i*10, "#f0d840"));
    const optY0=by+7+th;
    choice.options.forEach((o,i)=>{ const sel=i===choice.sel; const ox=14, oy=optY0+i*11; const selc=sel?pal().accent:"#c8c8d0";
      if(o.label.indexOf("! ")===0){
        text((sel?"> ":"  "), ox, oy, selc);
        text("!", ox+12, oy, "#ffd020");
        drawWrapped(o.label.slice(2), ox+18, oy, W-24-(ox+18-6), selc, 10, 1);
      } else {
        text(sel?"> ":"  ", ox, oy, selc);
        drawWrapped(o.label, ox+12, oy, W-24-(ox+12-6), selc, 10, 1);
      }
    });
  }

  // ---- CONFRONT: phased "verbal boss": beat the suspect's resistance with the right proofs ----
  // confront = { active, id, res, comp, options:[{label,key,good}], sel, msg, msgT, onWin, onLose }
  // Per-quest custom line for a story beat: returns cs_<id>_<key> if defined, else "" (caller falls back).
  function csvar(id, key){ if(!id) return ""; const k="cs_"+id+"_"+key; const v=t(k); return (v===k)? "" : v; }
  const confront={ active:false, id:null, caseId:null, res:100, comp:100, options:[], sel:0, msg:"", msgT:0, onWin:null, onLose:null, endT:0, ended:null };
  function startConfront(id, goodKeys, onWin, onLose){
    // options = collected clues; the "good" ones (goodKeys) chip the suspect's resistance
    const opts=[];
    (CASE.order||[]).forEach(k=>{ const c=CASE.clues[k]; if(c&&c.taken){ const d=t("cs_"+k+"_clue"); if(d!=="cs_"+k+"_clue") opts.push({label:trim(d), key:k, good:goodKeys.indexOf(k)>=0}); } });
    confront.caseId=id;
    runConfront(opts, onWin, onLose, csvar(id,"confront_intro")||t("confront_intro"));
  }
  // Generic confront core (reused by the central case AND by side quests with their own arguments).
  function runConfront(options, onWin, onLose, introMsg){
    confront.active=true; confront.id=null; confront.res=100; confront.comp=100; confront.options=options; confront.sel=0;
    confront.msg=introMsg||t("confront_intro"); confront.msgT=2.2; confront.onWin=onWin; confront.onLose=onLose; confront.endT=0; confront.ended=null;
    SFX.talk();
    if(typeof teachOnce==="function") teachOnce("confront");
  }
  function updateConfront(dt){
    if(confront.msgT>0) confront.msgT-=dt;
    if(confront.ended){ confront.endT-=dt; if(confront.endT<=0){ const cb=confront.ended==="win"?confront.onWin:confront.onLose; confront.active=false; if(cb) cb(); } return; }
    if(consumePress("up")){ confront.sel=(confront.sel-1+confront.options.length)%confront.options.length; SFX.up&&SFX.up(); }
    if(consumePress("down")){ confront.sel=(confront.sel+1)%confront.options.length; SFX.down&&SFX.down(); }
    if(consumePress("a")){
      const opt=confront.options[confront.sel];
      if(opt.good){ confront.res=Math.max(0, confront.res-35); confront.msg=csvar(confront.caseId,"confront_hit")||vpick("confront_hit")[0]||"..."; confront.msgT=1.8; SFX.confirm(); triggerShake(2,20);
        if(confront.res<=0){ confront.msg=csvar(confront.caseId,"confront_win")||t("confront_win"); confront.msgT=1.6; confront.ended="win"; confront.endT=1.6; SFX.questDone&&SFX.questDone(); }
      } else { confront.comp=Math.max(0, confront.comp-25); confront.res=Math.min(100, confront.res+8); confront.msg=csvar(confront.caseId,"confront_miss")||vpick("confront_miss")[0]||"..."; confront.msgT=1.8; SFX.cancel();
        if(confront.comp<=0){ confront.msg=t("confront_lose"); confront.msgT=1.6; confront.ended="lose"; confront.endT=1.6; }
      }
    }
  }
  function drawConfront(){
    // dim background
    ctx.fillStyle="rgba(6,8,12,0.55)"; ctx.fillRect(0,0,W,H);
    // suspect resistance bar (top) + captain composure bar (bottom)
    function bar(x,y,w,h,frac,col,bg){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x-1,y-1,w+2,h+2); ctx.fillStyle=bg; ctx.fillRect(x,y,w,h); ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*Math.max(0,frac)),h); }
    text(t("confront_suspect"), 8, 6, "#ff8a6a"); bar(8,16,W-16,6, confront.res/100, "#d83a3a", "#3a1e1e");
    text(t("confront_you"), 8, 28, "#8ad0ff"); bar(8,38,W-16,6, confront.comp/100, "#3a8ad0", "#1e2a3a");
    // message line
    if(confront.msgT>0){ panelBox(6,50,W-12,18); drawWrapped(confront.msg, 12, 54, W-24, pal().accent, 9, 2); }
    // options menu
    const opts=confront.options; const n=Math.min(opts.length,5); const bh=14+n*11; const by=H-bh-4;
    panelBox(6,by,W-12,bh); text(t("confront_q"),12,by+4,"#f0d840");
    // show a window of options around sel
    let start=Math.max(0, Math.min(confront.sel-2, opts.length-n));
    for(let i=0;i<n;i++){ const o=opts[start+i]; const sel=(start+i)===confront.sel; const selc=sel?pal().accent:"#c8c8d0";
      text(sel?"> ":"  ", 14, by+16+i*11, selc); drawWrapped(o.label, 26, by+16+i*11, W-24-20, selc, 10, 1); }
  }

  // ---- FIGHT (Zelda-like scripted duel): move + attack (A) + dodge (B), HP bars ----
  // Arena in screen space. Rare, story-scripted encounters only.
  const AR = { x:16, y:52, w:W-32, h:H-84 };   // arena rectangle
  const fight = { active:false, id:null, onWin:null,
    px:0, py:0, pdir:"down", php:100, patk:0, pdodge:0, pinv:0, phit:0,
    ex:0, ey:0, ehp:100, etimer:0, elunge:0, ehit:0, msg:"", msgT:0, endT:0, ended:null };
  function startFight(id, onWin){
    fight.active=true; fight.id=id; fight.onWin=onWin;
    fight.px=AR.x+20; fight.py=AR.y+AR.h/2; fight.pdir="right"; fight.php=100; fight.patk=0; fight.pdodge=0; fight.pinv=0; fight.phit=0;
    fight.ex=AR.x+AR.w-24; fight.ey=AR.y+AR.h/2; fight.ehp=100; fight.etimer=1.2; fight.elunge=0; fight.ehit=0;
    fight.msg=csvar(id,"fight_intro")||t("fight_intro"); fight.msgT=2.0; fight.endT=0; fight.ended=null;
    SFX.talk();
    if(typeof teachOnce==="function") teachOnce("fight");
  }
  function updateFight(dt){
    if(fight.msgT>0) fight.msgT-=dt;
    if(fight.ended){ fight.endT-=dt; if(fight.endT<=0){ if(fight.ended==="win"){ const cb=fight.onWin; fight.active=false; if(cb) cb(); } else { startFight(fight.id, fight.onWin); } } return; }
    const PSPD=70;
    // player movement
    let mvx=0,mvy=0;
    if(keys.left){mvx=-1;fight.pdir="left";} else if(keys.right){mvx=1;fight.pdir="right";}
    if(keys.up){mvy=-1;fight.pdir="up";} else if(keys.down){mvy=1;fight.pdir="down";}
    // dodge dash
    if(fight.pdodge>0){ fight.pdodge-=dt; fight.pinv=Math.max(fight.pinv, 0.02); }
    const spd = fight.pdodge>0 ? PSPD*2.4 : PSPD;
    fight.px=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.px+mvx*spd*dt));
    fight.py=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.py+mvy*spd*dt));
    if(fight.pinv>0) fight.pinv-=dt;
    if(fight.phit>0) fight.phit-=dt;
    if(fight.ehit>0) fight.ehit-=dt;
    if(fight.patk>0) fight.patk-=dt;
    // attack (A): short reach in facing direction
    if(consumePress("a") && fight.patk<=0){ fight.patk=0.22; SFX.b&&SFX.b();
      const range=16; let ax=fight.px, ay=fight.py;
      if(fight.pdir==="left")ax-=range; else if(fight.pdir==="right")ax+=range; else if(fight.pdir==="up")ay-=range; else ay+=range;
      if(Math.abs(ax-fight.ex)<12 && Math.abs(ay-fight.ey)<12){ fight.ehp=Math.max(0,fight.ehp-18); fight.ehit=0.2;
        triggerShake(3, 25);   // small shake + short vibration on a landed hit
        if(fight.ehp<=0){ fight.msg=csvar(fight.id,"fight_win")||t("fight_win"); fight.msgT=1.6; fight.ended="win"; fight.endT=1.6; SFX.questDone&&SFX.questDone(); triggerShake(5,60); }
      }
    }
    // dodge (B)
    if(consumePress("b") && fight.pdodge<=0){ fight.pdodge=0.18; fight.pinv=0.3; SFX.confirm(); }
    // enemy AI: chase, then lunge periodically
    if(fight.elunge>0){ fight.elunge-=dt;
      // during lunge, dash toward last player pos
      fight.ex+=fight.elvx*dt; fight.ey+=fight.elvy*dt;
    } else {
      const dx=fight.px-fight.ex, dy=fight.py-fight.ey; const d=Math.hypot(dx,dy)||1;
      fight.ex+=dx/d*40*dt; fight.ey+=dy/d*40*dt;
      fight.etimer-=dt;
      if(fight.etimer<=0){ fight.etimer=1.4+Math.random()*0.8; fight.elunge=0.35; const dd=Math.hypot(dx,dy)||1; fight.elvx=dx/dd*160; fight.elvy=dy/dd*160; }
    }
    fight.ex=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.ex));
    fight.ey=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.ey));
    // enemy hits player on contact (unless dodging/invulnerable)
    if(Math.abs(fight.px-fight.ex)<10 && Math.abs(fight.py-fight.ey)<10 && fight.pinv<=0 && fight.phit<=0){
      fight.php=Math.max(0, fight.php-12); fight.phit=0.6; fight.pinv=0.4; SFX.cancel();
      triggerShake(4, 40);   // taking a hit shakes a bit more + vibrates
      if(fight.php<=0){ fight.msg=t("fight_lose"); fight.msgT=1.6; fight.ended="lose"; fight.endT=1.6; }
    }
  }
  function drawFight(){
    ctx.fillStyle="rgba(6,8,12,0.7)"; ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#1a1a22"; ctx.fillRect(AR.x,AR.y,AR.w,AR.h);
    ctx.strokeStyle="#3a3a48"; ctx.lineWidth=1; ctx.strokeRect(AR.x+0.5,AR.y+0.5,AR.w-1,AR.h-1);

    function bar(x,y,w,frac,col){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x-1,y-1,w+2,6); ctx.fillStyle="#3a1e1e"; ctx.fillRect(x,y,w,4); ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*Math.max(0,frac)),4); }
    text(t("fight_you"),8,4,"#8ad0ff"); bar(8,14,70,fight.php/100,"#3a8ad0");
    text(t("fight_enemy"),W-64,4,"#ff8a6a"); bar(W-64,14,56,fight.ehp/100,"#d83a3a");
    // enemy (red-ish thug)
    const eflash=fight.ehit>0 && Math.floor(performance.now()/60)%2===0;
    drawHuman(fight.ex-8, fight.ey-16, "left", true, Math.floor(performance.now()/150)%2, {skin:"#e0b080",hair:"#1a1a1a",shirt:eflash?"#ffffff":"#7a2a2a",shirtDk:"#5a1e1e",pants:"#2a2028",kind:"ym"});
    // player (captain), flashing if hit

    if(!pflash) drawHuman(fight.px-8, fight.py-16, fight.pdir, (keys.left||keys.right||keys.up||keys.down), Math.floor(performance.now()/150)%2, {skin:"#f0c890",hair:"#2a2018",shirt:"#1a1a1e",shirtDk:"#0e0e12",pants:"#2f4d78",kind:"ym"});
    // attack flash
    if(fight.patk>0.1){ ctx.fillStyle="#fff2a0"; let ax=fight.px, ay=fight.py; const r=14;
      if(fight.pdir==="left")ax-=r; else if(fight.pdir==="right")ax+=r; else if(fight.pdir==="up")ay-=r; else ay+=r;
      ctx.fillRect(ax-3,ay-3,6,6); }
    if(fight.msgT>0){ panelBox(6,H-22,W-12,18); drawWrapped(fight.msg,12,H-18,W-24,pal().accent,9,2); }
    else textCenter(t("fight_hint"),W/2,H-12,"#8a8a9a");
  }

  // ================= Crudo Merchant: NAVAL BATTLE (real-time, top-down, Zelda-style) =================
  // Fought directly on the sea. Steer with the D-pad; broadside (A) when an enemy is abeam (to your side);
  // ram with your prow for reduced damage. Wind boosts/limits speed. Upgrades: cannons per side, prow, hull.
  const NAVAL_CANNONS=[  // per-side cannon count -> total broadside damage multiplier (1..4 guns)
    {n:1,mul:1}, {n:2,mul:2}, {n:3,mul:3}, {n:4,mul:4}
  ];
  const PROW_TIERS=[  // ram prow material -> ram damage % (of a base) ; index = tier
    {key:"prow_wood",   dmg:0.20}, {key:"prow_solid", dmg:0.30}, {key:"prow_double", dmg:0.42},
    {key:"prow_bronze", dmg:0.58}, {key:"prow_iron",  dmg:0.80}
  ];
  const HULL_TIERS=[  // hull material -> max HP
    {key:"hull_wood",   hp:100}, {key:"hull_solid", hp:135}, {key:"hull_double", hp:180},
    {key:"hull_bronze", hp:235}, {key:"hull_iron",  hp:300}
  ];
  const NAVAL_BASE_BROADSIDE=14;   // damage of a single-cannon broadside (scaled by cannon count)
  const NAVAL_RAM_BASE=40;         // base ram damage, scaled by prow % (so wood prow = 8)
  // Enemy ship roster
  // Crudo Merchant: enemy ships form a smooth difficulty curve tuned to the ship the player is expected to
  // own at each story beat. gold = reward for a WIN (loss penalty is a fraction of it, see naval handlers).
  //   sloop  (early, ky06)        -> player: Scialuppa/Deriva
  //   brig   (mid, ky08/12/20)    -> player: Deriva/Caravella
  //   galleon(late, ky18/27/31)   -> player: Caravella/Fregata
  //   royal  (endgame, ky38/41)   -> player: Fregata/Veliero
  const NAVAL_ENEMIES={
    sloop:   { nameKey:"nv_sloop",   tier:1, hp:75,  guns:1, speed:52, gold:35,  col:"#8a6a3a" },
    brig:    { nameKey:"nv_brig",    tier:2, hp:140, guns:2, speed:46, gold:60,  col:"#7a5230" },
    galleon: { nameKey:"nv_galleon", tier:3, hp:220, guns:3, speed:40, gold:110, col:"#6a4a28" },
    royal:   { nameKey:"nv_royal",   tier:4, hp:320, guns:4, speed:44, gold:190, col:"#3a4a7a" },
    // Crudo Merchant: SEA MONSTERS fought as naval battles (broadside + ram). beast=draw as a creature.
    // Point 3: monsters are STRONGER — higher hp, an `atk` power (they don't use cannons), a faster
    // attack cadence (atkRate<1 = quicker), and a wider strike reach.
    kraken:  { nameKey:"en_octopus", tier:2, hp:100, guns:0, atk:8,  atkRate:1.2, reach:76, speed:38, gold:70,  col:"#8a3a6a", beast:"octopus" },
    orcapod: { nameKey:"en_orca",    tier:2, hp:90,  guns:0, atk:7,  atkRate:1.1, reach:74, speed:54, gold:64,  col:"#20242c", beast:"orca" },
    leviathan:{nameKey:"en_leviathan",tier:3,hp:150, guns:0, atk:11, atkRate:1.2, reach:82, speed:36, gold:190, col:"#3a4a5a", beast:"whale" }
  };
  // Crudo Merchant: gold you LOSE when a naval battle is lost = a proportion of the enemy's reward tier
  // (a tougher fight risks more, but pays more). Capped at what you actually have.
  function navalLossPenalty(enemyKind){ const e=NAVAL_ENEMIES[enemyKind]||NAVAL_ENEMIES.sloop; return Math.round(e.gold*0.30); }
  function navalWinReward(enemyKind){ const e=NAVAL_ENEMIES[enemyKind]||NAVAL_ENEMIES.sloop; return Math.round(e.gold*(1+crewBonus("loot"))); }
  const naval = { active:false, onEnd:null, result:null, msg:"", msgT:0, ended:null, endT:0, intro:0,
    px:0, py:0, pang:0, pvel:0, php:0, pmax:0, pcool:0, pflash:0, pfire:0,
    ex:0, ey:0, eang:0, evel:0, ehp:0, emax:0, ecool:0, eflash:0, efire:0, etimer:0,
    windAng:0, windT:0, shots:[], enemyKind:"sloop", saveTx:0, saveTy:0, saveDir:"down",
    mode:"sink", timer:0, ally:null, forts:[], boarded:false };
  function playerShipStats(){
    const ty=BOAT_TYPES[player.boatType]||BOAT_TYPES.sloop;
    const s=player.ship||{cannons:0,prow:0,hull:0};
    const gunIdx=Math.min(NAVAL_CANNONS.length-1, s.cannons, ty.gunMax-1);   // cannons capped by type
    const prow=Math.min(PROW_TIERS.length-1, s.prow, ty.prowMax);
    const hull=Math.min(HULL_TIERS.length-1, s.hull, ty.hullMax);
    const pct=crewPct();
    return { guns:NAVAL_CANNONS[gunIdx].n, broMul:NAVAL_CANNONS[gunIdx].mul*pct,
      ramPct:PROW_TIERS[prow].dmg*pct, maxhp:Math.round(HULL_TIERS[hull].hp*pct),
      speedMul:ty.speedMul*(1+ (pct-1)*0.5), agiMul:ty.agiMul };
  }
  function startNaval(enemyKind, onEnd, opts){
    opts=opts||{};
    const e=NAVAL_ENEMIES[enemyKind]||NAVAL_ENEMIES.sloop;
    naval.saveTx=player.tx; naval.saveTy=player.ty; naval.saveDir=player.dir;
    const st=playerShipStats();
    naval.active=true; naval.onEnd=onEnd||null; naval.enemyKind=enemyKind; naval.result=null; naval.ended=null; naval.endT=0; naval.intro=1.4;
    naval.px=AR.x+30; naval.py=AR.y+AR.h/2; naval.pang=0; naval.pvel=0; naval.pmax=st.maxhp; naval.php=st.maxhp; naval.pcool=0; naval.pflash=0; naval.pfire=0;
    naval.ex=AR.x+AR.w-30; naval.ey=AR.y+AR.h/2; naval.eang=Math.PI; naval.evel=0; naval.emax=e.hp; naval.ehp=e.hp; naval.ecool=0; naval.eflash=0; naval.efire=0; naval.etimer=1.5;
    naval.windAng=Math.random()*Math.PI*2; naval.windT=0; naval.shots=[];
    // --- objective mode ---
    naval.mode = opts.mode || "sink";
    naval.timer = opts.time || 0;        // for flee (countdown to safety) / survive
    naval.ally = null; naval.forts = []; naval.boarded=false;
    if(naval.mode==="escort"){ naval.ally={ x:AR.x+20, y:AR.y+18, hp:100, max:100, ang:0, t:0 }; }
    if(naval.mode==="board"){ naval.emax=e.hp; naval.ehp=e.hp; }   // reduce to threshold, then ram to board
    if(naval.mode==="batteries"){
      naval.ex=-999; naval.ey=-999;   // no ship (batteries only)
      naval.forts=[ {x:AR.x+AR.w-20,y:AR.y+16,hp:40,max:40,cool:Math.random()*2},
                    {x:AR.x+AR.w-20,y:AR.y+AR.h-16,hp:40,max:40,cool:Math.random()*2},
                    {x:AR.x+AR.w-40,y:AR.y+AR.h/2,hp:40,max:40,cool:Math.random()*2} ];
    }
    if(naval.mode==="flee"){ naval.timer=opts.time||22; }   // survive/escape for N seconds (or reach the left edge)
    naval.msg = t(naval.mode==="sink" ? "nv_appears" : ("nv_obj_"+naval.mode)).replace("%",t(e.nameKey)); naval.msgT=2.2;
    SFX.talk&&SFX.talk();
    if(typeof teachOnce==="function") teachOnce("naval");
  }
  function navalEnemy(){ return NAVAL_ENEMIES[naval.enemyKind]||NAVAL_ENEMIES.sloop; }
  function angDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
  function windFactor(ang){ // 1.5 downwind .. 0.6 upwind (dot of heading vs wind)
    const dot=Math.cos(angDiff(ang,naval.windAng)); return 1.05+0.45*dot;   // 0.6 .. 1.5
  }
  function navalFireBroadside(){
    if(naval.pcool>0) return;
    const st=playerShipStats();
    // cannons fire perpendicular to heading (both sides). Check enemy is roughly abeam.
    const toE=Math.atan2(naval.ey-naval.py, naval.ex-naval.px);
    const rel=angDiff(toE, naval.pang);   // ~±90° means abeam
    const abeam=Math.abs(Math.abs(rel)-Math.PI/2) < 0.5;   // within ~28° of perpendicular
    const dist=Math.hypot(naval.ex-naval.px, naval.ey-naval.py);
    naval.pcool=1.1; naval.pfire=0.2; SFX.b&&SFX.b(); triggerShake(3,25);
    // muzzle smoke shots on both sides
    const side=(rel>0?1:-1);
    for(let i=0;i<st.guns;i++){ naval.shots.push({x:naval.px+Math.cos(naval.pang+side*Math.PI/2)*(6+i*3), y:naval.py+Math.sin(naval.pang+side*Math.PI/2)*(6+i*3), t:0.3, side:side}); }
    if(abeam && dist<70){
      const dmg=NAVAL_BASE_BROADSIDE*st.broMul + Math.floor(Math.random()*5);
      // in "board" mode you can't sink below 1 HP with cannons: you must ram to board & capture
      const floor = (naval.mode==="board") ? Math.round(naval.emax*0.18) : 0;
      naval.ehp=Math.max(floor,naval.ehp-dmg); naval.eflash=0.25; triggerShake(4,40);
      naval.msg=t("nv_broadside").replace("#",dmg); naval.msgT=1.0; SFX.cancel&&SFX.cancel(); SFX.woodCrack&&SFX.woodCrack();
      if(naval.ehp<=0 && naval.mode!=="board"){ navalWin(); }
    } else if(naval.mode==="batteries" && naval.forts.length){
      // broadside a shore battery when abeam of it
      let hit=false;
      for(const f of naval.forts){ if(f.hp<=0) continue;
        const toF=Math.atan2(f.y-naval.py, f.x-naval.px); const relF=angDiff(toF, naval.pang);
        const abF=Math.abs(Math.abs(relF)-Math.PI/2)<0.6; const dF=Math.hypot(f.x-naval.px,f.y-naval.py);
        if(abF && dF<80){ const dmg=NAVAL_BASE_BROADSIDE*st.broMul+Math.floor(Math.random()*5); f.hp=Math.max(0,f.hp-dmg); f.flash=0.25; triggerShake(4,40); hit=true;
          naval.msg=t("nv_broadside").replace("#",dmg); naval.msgT=1.0; SFX.cancel&&SFX.cancel(); SFX.woodCrack&&SFX.woodCrack(); break; } }
      if(!hit){ naval.msg=t("nv_miss"); naval.msgT=0.8; }
      if(naval.forts.every(f=>f.hp<=0)) navalWin();
    } else {
      naval.msg=t("nv_miss"); naval.msgT=0.8;   // not lined up abeam / too far
    }
  }
  function navalWin(){ naval.ended="win"; naval.result="win"; naval.endT=1.6; naval.msg=t("nv_win"); naval.msgT=1.6; SFX.questDone&&SFX.questDone(); if(typeof tut2OnNaval==="function") tut2OnNaval(); }
  function navalLose(){ naval.ended="lose"; naval.result="lose"; naval.endT=1.6; naval.msg=t("nv_lose"); naval.msgT=1.6; SFX.cancel&&SFX.cancel(); }
  function updateNaval(dt){
    if(naval.msgT>0) naval.msgT-=dt;
    if(naval.pflash>0) naval.pflash-=dt; if(naval.eflash>0) naval.eflash-=dt;
    if(naval.pfire>0) naval.pfire-=dt; if(naval.efire>0) naval.efire-=dt;
    if(naval.pcool>0) naval.pcool-=dt; if(naval.ecool>0) naval.ecool-=dt;
    // shots fade
    naval.shots.forEach(s=>s.t-=dt); naval.shots=naval.shots.filter(s=>s.t>0);
    // wind slowly rotates
    naval.windT+=dt; if(naval.windT>4){ naval.windT=0; naval.windAng+=(Math.random()-0.5)*0.8; }
    if(naval.intro>0){ naval.intro-=dt; return; }
    if(naval.ended){ naval.endT-=dt; if(naval.endT<=0){ const cb=naval.onEnd, r=naval.result; naval.active=false;
        // resume where the battle started
        player.tx=naval.saveTx; player.ty=naval.saveTy; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir=naval.saveDir; player.moving=false;
        if(cb) cb(r); } return; }
    // --- player ship control: left/right turn, up = thrust forward, down = brake/reverse ---
    const st=playerShipStats(); const wf=windFactor(naval.pang);
    const TURN=1.9*dt*(0.7+0.3*wf);   // upwind turns are a touch slower (wf small)
    if(keys.left) naval.pang-=TURN;
    if(keys.right) naval.pang+=TURN;
    const BASE=58;
    let targetV=0;
    if(keys.up) targetV=BASE*wf;              // sail forward, wind-scaled
    else if(keys.down) targetV=-BASE*0.4;     // slow reverse
    naval.pvel += (targetV-naval.pvel)*Math.min(1,dt*2.2);
    naval.px += Math.cos(naval.pang)*naval.pvel*dt;
    naval.py += Math.sin(naval.pang)*naval.pvel*dt;
    // keep in arena
    naval.px=Math.max(AR.x+8, Math.min(AR.x+AR.w-8, naval.px));
    naval.py=Math.max(AR.y+8, Math.min(AR.y+AR.h-8, naval.py));
    // fire broadside
    if(consumePress("a")) navalFireBroadside();
    // --- objective: FLEE (survive/escape) ---
    if(naval.mode==="flee"){
      naval.timer-=dt;
      if(naval.px<=AR.x+12){ navalWin(); }          // reached the left edge = escaped
      else if(naval.timer<=0){ navalWin(); }         // survived long enough = shook them off
    }
    // --- ram / board: prow contact with the enemy ---
    const dx=naval.ex-naval.px, dy=naval.ey-naval.py, d=Math.hypot(dx,dy)||1;
    if(naval.ex>-900 && d<14){
      const aim=Math.abs(angDiff(Math.atan2(dy,dx), naval.pang));
      if(naval.mode==="board" && naval.ehp<=Math.round(naval.emax*0.20)+1 && aim<0.9){
        naval.boarded=true; naval.msg=t("nv_board_ok"); naval.msgT=1.2; navalWin(); return;   // captured!
      }
      if(aim<0.7 && naval.pcool<=0.9){
        const dmg=Math.round(NAVAL_RAM_BASE*st.ramPct)+Math.floor(Math.random()*3);
        const floor=(naval.mode==="board")?1:0;
        naval.ehp=Math.max(floor,naval.ehp-dmg); naval.eflash=0.25; triggerShake(3,30); naval.pcool=Math.max(naval.pcool,0.6);
        naval.msg=t("nv_ram").replace("#",dmg); naval.msgT=0.9; SFX.b&&SFX.b(); SFX.woodCrack&&SFX.woodCrack();
        naval.ex+=dx/d*8; naval.ey+=dy/d*8; naval.pvel*=0.3;
        if(naval.ehp<=0 && naval.mode!=="board"){ navalWin(); }
      } else { naval.pvel*=0.5; naval.px-=dx/d*2; naval.py-=dy/d*2; }
    }
    // --- escort ally: drifts slowly; enemy also targets it; lose if it sinks ---
    if(naval.mode==="escort" && naval.ally){
      const a=naval.ally; a.t+=dt; a.x += Math.cos(a.t*0.3)*6*dt; a.y += Math.sin(a.t*0.4)*5*dt;
      a.x=Math.max(AR.x+8,Math.min(AR.x+AR.w-8,a.x)); a.y=Math.max(AR.y+8,Math.min(AR.y+AR.h-8,a.y));
      if(a.hp<=0){ navalLose(); return; }
    }
    // --- shore batteries: fire at the player; win handled in broadside ---
    if(naval.mode==="batteries"){
      for(const f of naval.forts){ if(f.hp<=0) continue; if(f.flash>0)f.flash-=dt; f.cool-=dt;
        if(f.cool<=0){ f.cool=1.8+Math.random(); const dF=Math.hypot(f.x-naval.px,f.y-naval.py);

  // A King's duellist: HP and attack grow with the mission number.
  function storyDuelEnemy(questId){
    const q=QUESTS[questId]; const ord=(q&&q.order)?q.order:1;
    const hp  = Math.round(50 + ord*6.5);            // grows with the mission number (a touch gentler)
    const lo  = Math.round(6  + ord*0.55);           // attack low end grows with order
    const hi  = Math.round(11 + ord*0.9);            // attack high end grows with order
    // look scales too: early = pirate bruiser, late royal = King's soldier
    const royal = ord>=28;

      ? {skin:"#e8c090",hair:"#1a1a1a",shirt:"#26407a",shirtDk:"#1a2e5a",pants:"#2a2028",outfit:"guard"}
      : {skin:"#e0b080",hair:"#1a1a1a",shirt:"#5a2a6a",shirtDk:"#3e1c4a",pants:"#2a2028",outfit:"pirate"};

  // Crudo Merchant (Fase 5.3): trigger a battle when the player touches a hostile creature.
  function checkBattleEncounter(){
    if(battle.active||fight.active||insideKey||battleCooldown>0||player.boat) return;
    for(const a of fauna){
      if(!a.landHostile) continue;   // Crudo Merchant: NESSUN duello a terra a contatto (nessuna creatura è landHostile)
      const eid=a.enemy||a.kind; const h=HOSTILE_FAUNA[a.kind]||(a.enemy?{enemy:a.enemy,gold:(ENEMIES[a.enemy]&&ENEMIES[a.enemy].gold)||12}:null); if(!h) continue;

        const foe=a;   // capture the creature so we can remove it on victory

        startBattle(eid, (result)=>{
          battleCooldown=1.2;
          if(result==="win"||result==="parley"){
            const i=fauna.indexOf(foe); if(i>=0) fauna.splice(i,1);   // creature defeated/left
            if(result==="win"){ const g=Math.round(h.gold*(1+crewBonus("loot"))); player.gold+=g; banner(t("bt_reward").replace("#",g)); addFame(10); bountyOnKill(eid); }   // Crudo Merchant: weapons come from duels/armoury, not random drops
            saveGame();

            // knocked out: recover a bit, small grace
            player.gold=Math.max(0,player.gold-Math.floor(h.gold/2));

  const learned = {};
